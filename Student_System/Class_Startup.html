<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room 8 · Class Startup</title>
<!--
  Class_Startup.html — the do-now slide on the LCD projector. REBUILT 2026-10-27.

  WHAT CHANGED: every pull from the class system is GONE (the GAS webhook, the
  10-day rotation auto-detect, Class_Log, assignments_data, display_instructions_data,
  the LLM outcome picker, the seating/roster popups, the homeroom feed). This file
  now stands alone: you TYPE the day's plan into the PLAN block right below this
  comment, save, and refresh the projector browser (F5). No keys, no sheet, no
  cache versioning, nothing to load but this one file.

  The previous system version (auto class detection, outcome strip, seating popup,
  log webhooks) lives in this repo's git history if anything from it is ever missed
  (see commits before 2026-10-27). The seating chart itself still exists:
  Seating_Editor.html runs on its own.

  TO EDIT THE PLAN: open this file in any editor, change the words between the
  EDIT marks (keep the quote marks around each line), save, press F5 on the
  projector. That's the whole workflow.

  Keyboard: F = fullscreen.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f0f2f5;
        --surface: #ffffff;
        --ink: #1c2622;
        --body: #3d4a44;
        --muted: #7a8781;
        --line: #d7dedb;
        --accent: #006376;
        --accent-soft: #e5f0f2;
        --amber: #b45309;
        --amber-soft: #fef3c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Source Sans 3', 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
        padding: 3.2vh 4vw 2.4vh 4vw;
        display: flex;
        flex-direction: column;
    }
    .topbar {
        display: flex; justify-content: space-between; align-items: baseline;
        border-bottom: 3px solid var(--ink); padding-bottom: 1.4vh; gap: 2vw;
    }
    .course { font-family: 'JetBrains Mono', monospace; font-weight: 800; font-size: max(14px, 2.2vh); letter-spacing: .1em; text-transform: uppercase; color: var(--accent); }
    .clockline { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: max(16px, 2.6vh); color: var(--body); text-align: right; }
    .clockline .clock { font-size: max(20px, 3.4vh); color: var(--ink); }
    h1 {
        font-family: 'Arvo', serif; font-weight: 700;
        font-size: max(40px, 9.5vh); line-height: 1.02;
        margin: 3.2vh 0 2.6vh 0; letter-spacing: -.01em;
    }
    .steps { list-style: none; max-width: 62ch; }
    .steps li {
        display: flex; align-items: flex-start; gap: 1.6vw;
        background: var(--surface); border: 2px solid var(--line);
        border-left: 8px solid var(--accent); border-radius: 10px;
        padding: 2vh 1.6vw; margin-bottom: 1.8vh;
        font-size: max(19px, 3.6vh); font-weight: 600; line-height: 1.3; color: var(--ink);
    }
    .steps li em { font-style: normal; }
    .steps .num {
        font-family: 'JetBrains Mono', monospace; font-weight: 800;
        font-size: max(18px, 3.4vh); color: #fff; background: var(--accent);
        border-radius: 8px; min-width: 1.55em; height: 1.55em;
        display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .also { margin-top: 2.4vh; background: var(--amber-soft); border: 2px solid var(--amber); border-radius: 10px; padding: 1.8vh 1.6vw; max-width: 62ch; }
    .also .h { font-family: 'JetBrains Mono', monospace; font-size: max(12px, 1.9vh); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); margin-bottom: 1vh; }
    .also ul { list-style: none; }
    .also li { font-size: max(16px, 2.7vh); line-height: 1.4; margin-bottom: .9vh; padding-left: 1.5em; position: relative; color: var(--ink); }
    .also li::before { content: "\2713"; position: absolute; left: 0; font-weight: 800; color: var(--amber); }
    .foot { margin-top: auto; padding-top: 2vh; display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: max(11px, 1.6vh); font-weight: 600; color: var(--muted); letter-spacing: .04em; }
</style>
</head>
<body>

<!-- ================================================================
     EDIT TODAY'S PLAN HERE — change only the words inside the quotes.
     steps  = the numbered list kids read first (one string per step)
     also   = the smaller "also" strip (one string per line)
     course = the label in the top-left corner
     Then SAVE this file and refresh the projector browser (F5).
     ================================================================ -->
<script>
var PLAN = {
    course: "Room 8 \u00b7 902 \u00b7 First Class",
    steps: [
        "Complete the research form for your group's claims.",
        "Get signed approval for each design from Mr Waugh before proceeding.",
        "Read the instructions CAREFULLY, especially the limitations (images, etc.)."
    ],
    also: [
        "Permission slips are on the board; check whose is still there.",
        "Need a 902 schedule? Additional printed copies are on the table."
    ]
};
</script>
<!-- ============== END PLAN — everything below just renders it ============== -->

<div class="topbar">
    <div class="course" id="courseLabel"></div>
    <div class="clockline"><span class="clock" id="clock"></span> &nbsp; <span id="dateline"></span></div>
</div>
<h1>Do this now</h1>
<ol class="steps" id="stepsList"></ol>
<div class="also" id="alsoBox" style="display:none;">
    <div class="h">Also</div>
    <ul id="alsoList"></ul>
</div>
<div class="foot">
    <span>ROOM 8 &middot; MR WAUGH</span>
    <span>F = FULLSCREEN &middot; EDIT THE PLAN IN THIS FILE, SAVE, REFRESH (F5)</span>
</div>
<script>
    /* ES5 on purpose: the projector browser is old. No arrow functions, no let/const. */
    (function () {
        function esc(s) {
            return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        var steps = document.getElementById("stepsList");
        var i, li;
        for (i = 0; i < PLAN.steps.length; i++) {
            li = document.createElement("li");
            li.innerHTML = "<em class=\"num\">" + (i + 1) + "</em><em>" + esc(PLAN.steps[i]) + "</em>";
            steps.appendChild(li);
        }
        if (PLAN.also && PLAN.also.length) {
            var box = document.getElementById("alsoBox");
            var ul = document.getElementById("alsoList");
            box.style.display = "block";
            for (i = 0; i < PLAN.also.length; i++) {
                li = document.createElement("li");
                li.innerHTML = esc(PLAN.also[i]);
                ul.appendChild(li);
            }
        }
        document.getElementById("courseLabel").innerHTML = esc(PLAN.course);

        function tick() {
            var now = new Date();
            var h = now.getHours(), m = now.getMinutes();
            var ampm = h >= 12 ? "pm" : "am";
            h = h % 12; if (h === 0) h = 12;
            var mm = (m < 10 ? "0" : "") + m;
            document.getElementById("clock").innerHTML = h + ":" + mm + " " + ampm;
            var days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            var mons = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            document.getElementById("dateline").innerHTML = days[now.getDay()] + " &middot; " + mons[now.getMonth()] + " " + now.getDate();
        }
        tick();
        window.setInterval(tick, 15000);

        document.addEventListener("keydown", function (e) {
            var k = e.key || e.keyCode;
            if (k === "f" || k === "F") {
                if (document.fullscreenElement) { document.exitFullscreen(); }
                else { document.documentElement.requestFullscreen(); }
            }
        });
    })();
</script>
</body>
</html>
