<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Room 8 · Class Log — What We Did / What's Next</title>
<!--
  Class_Log_Tracker.html — Mr. Waugh's per-section "last class / next class" tracker.
  Teacher-only. Data lives in the Class_Log tab of the Room 8 Master Google Sheet,
  read/written through the Student Webhook Backend (api.js: getClassLog / submitClassLog).
  Offline seed: class_log_seed_data.js · Schedule engine: class_log_meetings_data.js
  Update from your phone: edit the Class_Log tab in the Google Sheet app, or use the
  quick-log panel here. See CLASS_LOG_README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
    --bg-page: #f0f2f5;
    --bg-surface: #ffffff;
    --bg-card-hover: #f8fafc;
    --border-card: #d5dbe3;
    --border-subtle: #e5e9f0;
    --border-highlight: #ed786a;
    --text-main: #1e2530;
    --text-heading: #181f2b;
    --text-muted: #475569;
    --text-dim: #64748b;
    --coral: #ed786a;
    --coral-hover: #fd887a;
    --coral-dark: #d65b4c;
    --coral-bg: #fff1f0;
    --coral-border: #fecdd3;
    --blue: #1d4ed8;
    --blue-bg: #eff6ff;
    --blue-border: #bfdbfe;
    --emerald: #15803d;
    --emerald-bg: #dcfce7;
    --emerald-border: #86efac;
    --amber: #b45309;
    --amber-bg: #fef3c7;
    --amber-border: #fde68a;
    --font-heading: 'Arvo', Georgia, serif;
    --font-body: 'Source Sans 3', 'Source Sans Pro', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg-page);
    color: var(--text-main);
    font-family: var(--font-body);
    font-size: 15px;
    padding: 18px 22px 30px;
}
h1, h2, h3 { font-family: var(--font-heading); font-weight: 700; color: var(--text-heading); }
.mono { font-family: var(--font-mono); }

/* ---------- Header ---------- */
header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding-bottom: 12px; margin-bottom: 14px;
    border-bottom: 2px solid var(--border-subtle);
    box-shadow: inset 0 -4px 0 0 #ffffff, inset 0 -6px 0 0 var(--border-card);
}
.badge-room {
    background: var(--coral); color: #ffffff; font-family: var(--font-heading);
    font-weight: 700; border-radius: 6px; padding: 4px 12px; letter-spacing: 0.5px;
    box-shadow: 0 2px 6px rgba(237, 120, 106, 0.3);
}
header h1 { font-size: 1.45rem; text-shadow: 0.04em 0.06em 0 rgba(0, 0, 0, 0.08); }
header .spacer { flex: 1; }
.today-chip {
    font-family: var(--font-mono); font-weight: 700; font-size: 0.95rem;
    background: var(--blue-bg); border: 1px solid var(--blue-border); color: var(--blue);
    border-radius: 6px; padding: 5px 12px;
}
.sync-pill {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.4px;
    border-radius: 999px; padding: 4px 11px; border: 1px solid var(--border-card);
    background: var(--bg-surface); color: var(--text-dim); cursor: pointer;
}
.sync-pill.live { color: var(--emerald); border-color: var(--emerald-border); background: var(--emerald-bg); }
.sync-pill.seed { color: var(--amber); border-color: var(--amber-border); background: var(--amber-bg); }

/* ---------- Today strip ---------- */
.today-strip {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 14px;
}
.today-strip .strip-label {
    font-family: var(--font-heading); font-weight: 700; font-size: 0.82rem;
    text-transform: uppercase; letter-spacing: 1px; color: var(--text-dim);
    margin-right: 4px;
}
.today-chip-class {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--bg-surface); border: 1px solid var(--border-card);
    border-radius: 6px; padding: 4px 10px; font-size: 0.88rem; font-weight: 600;
}
.today-chip-class .p { font-family: var(--font-mono); font-weight: 700; color: var(--coral-dark); font-size: 0.8rem; }
.today-chip-class.done { opacity: 0.55; text-decoration: line-through; }
.strip-none { color: var(--text-dim); font-style: italic; }

/* ---------- Quick log ---------- */
.quicklog {
    background: var(--bg-surface); border: 1px solid var(--border-card);
    border-left: 4px solid var(--coral); border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    padding: 12px 14px; margin-bottom: 16px;
}
.quicklog h2 { font-size: 0.95rem; margin-bottom: 9px; letter-spacing: 0.3px; }
.quicklog form { display: grid; grid-template-columns: 150px 92px 1fr 1fr auto; gap: 8px; align-items: start; }
.quicklog label {
    display: block; font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.7px; color: var(--text-dim); margin-bottom: 3px;
}
.quicklog input, .quicklog select, .quicklog textarea {
    width: 100%; font-family: var(--font-body); font-size: 0.92rem; color: var(--text-main);
    border: 1px solid var(--border-card); border-radius: 6px; padding: 6px 8px; background: #fff;
}
.quicklog textarea { resize: vertical; min-height: 44px; }
.quicklog input:focus, .quicklog select:focus, .quicklog textarea:focus {
    outline: none; border-color: var(--coral); box-shadow: 0 0 0 2px var(--coral-bg);
}
.quicklog button {
    align-self: end; height: 36px; padding: 0 18px;
    background: var(--coral); color: #fff; border: none; border-radius: 6px;
    font-family: var(--font-heading); font-weight: 700; font-size: 0.9rem;
    letter-spacing: 0.4px; cursor: pointer; box-shadow: 0 2px 6px rgba(237,120,106,0.3);
}
.quicklog button:hover { background: var(--coral-hover); }
.quicklog button:disabled { background: var(--text-dim); cursor: wait; }
.log-status { grid-column: 1 / -1; font-size: 0.85rem; font-weight: 600; min-height: 1.1em; }
.log-status.ok { color: var(--emerald); }
.log-status.err { color: var(--coral-dark); }

/* ---------- Section cards ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(345px, 1fr)); gap: 12px; }
.card {
    background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05); padding: 11px 13px;
}
.card.needs-logging { border-color: var(--border-highlight); box-shadow: 0 2px 8px rgba(237,120,106,0.18); }
.card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
.sec-code { font-family: var(--font-mono); font-weight: 800; font-size: 0.95rem; color: var(--coral-dark); white-space: nowrap; }
.sec-name { font-family: var(--font-heading); font-weight: 700; font-size: 0.95rem; color: var(--text-heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-slots { font-family: var(--font-mono); font-weight: 500; font-size: 0.68rem; color: var(--text-dim); margin-bottom: 7px; }
.slide-link { margin-left: auto; text-decoration: none; font-size: 0.95rem; opacity: 0.65; }
.slide-link:hover { opacity: 1; }
.block { border-top: 1px dashed var(--border-subtle); padding: 7px 0 2px; }
.block .b-label {
    font-size: 0.64rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.9px;
    color: var(--text-dim); margin-bottom: 2px;
}
.block .b-meta { font-family: var(--font-mono); font-weight: 700; font-size: 0.8rem; color: var(--text-muted); }
.b-meta .cls-tag { color: var(--purple); }
.count {
    display: inline-block; font-family: var(--font-mono); font-weight: 800; font-size: 0.68rem;
    border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px;
}
.count.today { background: var(--coral-bg); border: 1px solid var(--coral-border); color: var(--coral-dark); }
.count.soon { background: var(--amber-bg); border: 1px solid var(--amber-border); color: var(--amber); }
.count.later { background: var(--bg-page); border: 1px solid var(--border-card); color: var(--text-dim); }
.b-text { font-size: 0.9rem; line-height: 1.32; color: var(--text-main); }
.b-text.empty { color: var(--text-dim); font-style: italic; }
.hint { font-size: 0.8rem; color: var(--purple); font-weight: 600; margin-top: 4px; }
.plan-tag {
    display: inline-block; font-family: var(--font-mono); font-weight: 700; font-size: 0.62rem;
    background: var(--purple-bg); border: 1px solid var(--purple-border); color: var(--purple);
    border-radius: 4px; padding: 0 6px; margin-left: 6px; vertical-align: 1px; letter-spacing: 0.5px;
}
.plan-link {
    float: right; font-weight: 600; font-size: 0.72rem; color: var(--coral-dark);
    cursor: pointer; text-transform: none; letter-spacing: 0.2px;
}
.plan-link:hover { text-decoration: underline; }
.plan-editor {
    display: none; margin-top: 7px; padding: 8px;
    background: var(--bg-page); border: 1px solid var(--border-card); border-radius: 6px;
}
.plan-editor.open { display: block; }
.plan-editor textarea, .plan-editor input {
    width: 100%; font-family: var(--font-body); font-size: 0.88rem; color: var(--text-main);
    border: 1px solid var(--border-card); border-radius: 5px; padding: 5px 7px; background: #fff;
    margin-bottom: 6px;
}
.plan-editor input { width: 90px; }
.plan-editor .pe-btns { display: flex; gap: 6px; align-items: center; }
.plan-editor button {
    border: none; border-radius: 5px; padding: 4px 12px; cursor: pointer;
    font-family: var(--font-heading); font-weight: 700; font-size: 0.78rem;
}
.plan-editor .pe-save { background: var(--coral); color: #fff; }
.plan-editor .pe-clear { background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border-card) !important; }
.plan-editor .pe-status { font-size: 0.75rem; font-weight: 600; color: var(--emerald); }
footer { margin-top: 18px; font-size: 0.75rem; color: var(--text-dim); }

@media (max-width: 900px) {
    body { padding: 12px; }
    .quicklog form { grid-template-columns: 1fr 1fr; }
    .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
    <span class="badge-room">ROOM 8</span>
    <h1>Class Log — Did / Do Next</h1>
    <span class="spacer"></span>
    <span class="today-chip" id="todayChip">…</span>
    <button class="sync-pill" id="syncPill" title="Refresh from Google Sheet">SEED</button>
</header>

<div class="today-strip" id="todayStrip">
    <span class="strip-label">Today</span>
    <span class="strip-none">loading…</span>
</div>

<section class="quicklog">
    <h2>Quick Log — what happened in class?</h2>
    <form id="logForm">
        <div>
            <label for="qlSection">Class</label>
            <select id="qlSection"></select>
        </div>
        <div>
            <label for="qlDate">Date</label>
            <input type="date" id="qlDate">
        </div>
        <div>
            <label for="qlDid">What we did</label>
            <textarea id="qlDid" rows="2" placeholder="Finished Real Issues dossier research…"></textarea>
        </div>
        <div>
            <label for="qlNext">Next class / bring</label>
            <textarea id="qlNext" rows="2" placeholder="Quiz 1 — study sheet went home"></textarea>
        </div>
        <div>
            <label for="qlClassNo">Class #</label>
            <input type="number" id="qlClassNo" min="1" max="99" placeholder="#">
            <button type="submit" id="qlSave" style="margin-top:8px; width:100%;">Log it</button>
        </div>
        <div class="log-status" id="logStatus"></div>
    </form>
</section>

<main class="cards" id="cards"></main>

<footer>
    Schedule: weekday-anchored 10-day cycle (verified against your 2026–27 course calendars) ·
    Live data: Class_Log tab, Room 8 Master Sheet · Offline seed: class_log_seed_data.js ·
    <a href="javascript:void(0)" id="pinLink" style="color:var(--coral-dark)">teacher PIN</a> ·
    <a href="CLASS_LOG_README.md" style="color:var(--coral-dark)">how to maintain</a>
</footer>

<script src="class_log_meetings_data.js"></script>
<script src="class_log_lesson_maps.js"></script>
<script src="class_log_seed_data.js"></script>
<script src="api.js"></script>
<script>
(function () {
    'use strict';
    const MEET = window.CLASS_LOG_MEETINGS.sections;
    const MAPS = window.CLASS_LOG_LESSON_MAPS || {};
    const ORDER = ["902-CIT", "902-HL", "901-CIT", "901-HL", "903-CIT", "903-HL",
                   "801-HE", "802-HE", "803-HE", "804-HE"];

    // ---------- state ----------
    let entries = (window.CLASS_LOG_SEED && window.CLASS_LOG_SEED.entries) ? window.CLASS_LOG_SEED.entries.slice() : [];
    let plans = (window.CLASS_LOG_SEED && window.CLASS_LOG_SEED.plans) ? window.CLASS_LOG_SEED.plans : {};
    let live = false;
    const PIN_KEY = 'room8_class_log_pin';

    // ---------- date helpers ----------
    function fmtShort(iso) { // '2026-09-23' -> 'Wed Sep 23'
        const d = new Date(iso + 'T12:00:00');
        return d.toLocaleDateString('en-CA', { weekday: 'short', month: 'short', day: 'numeric' });
    }
    function todayISO() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function diffDays(iso) {
        return Math.round((new Date(iso + 'T12:00:00') - new Date(todayISO() + 'T12:00:00')) / 86400000);
    }
    // Weekday-anchored 10-day cycle (mirrors tools/build_class_log_meetings.py)
    function cycleDayOf(iso) {
        const d = new Date(iso + 'T12:00:00');
        const wd = d.getDay(); // 0 Sun .. 6 Sat
        if (wd === 0 || wd === 6) return null;
        const anchor = new Date('2026-09-14T12:00:00');
        const weeks = Math.floor((d - anchor) / (7 * 86400000));
        return wd <= 5 ? (weeks % 2 === 0 ? wd : wd + 5) : null;
    }

    // ---------- log entry helpers ----------
    function entriesFor(sec) {
        return entries.filter(e => e.section === sec)
                      .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    }
    function lastEntry(sec) { const e = entriesFor(sec); return e.length ? e[e.length - 1] : null; }
    function meetingsOf(sec) { return (MEET[sec] && MEET[sec].meetings) || []; }
    function nextMeeting(sec) {
        const today = todayISO();
        const seen = entriesFor(sec).map(e => e.date);
        const ms = meetingsOf(sec);
        for (const m of ms) {
            if (m.d >= today && !seen.includes(m.d)) return m;
        }
        return null;
    }
    function suggestedNext(sec) {
        const last = lastEntry(sec);
        const plan = plans[sec];
        const course = MEET[sec] ? MEET[sec].course : '';
        const map = MAPS[course];
        if (!map) return null;
        let n, manual = false;
        if (plan && /^\d+$/.test(String(plan.classNo || '').trim())) {
            n = parseInt(plan.classNo, 10); manual = true;
        } else if (last && /^\d+$/.test(String(last.classNo || '').trim())) {
            n = parseInt(last.classNo, 10) + 1;
        } else if (!last) {
            n = 1;
        } else {
            return 'Lesson # not tracked — type the next Class # when logging';
        }
        const title = map.classes[n] || unitTitle(map, n);
        return 'Class ' + n + (title ? ' — ' + title : '') +
               (manual ? ' · set by plan' : '') +
               (n <= map.total ? '' : ' (past plan end)');
    }
    function unitTitle(map, n) {
        for (const u of (map.units || [])) if (n >= u.from && n <= u.to) return u.title;
        return '';
    }

    // ---------- render ----------
    function render() {
        renderHeader();
        renderTodayStrip();
        renderCards();
    }
    function renderHeader() {
        const t = todayISO();
        const cd = cycleDayOf(t);
        const label = fmtShort(t);
        document.getElementById('todayChip').textContent =
            cd ? (label + ' · Day ' + cd) : (label + ' · no school');
    }
    function renderTodayStrip() {
        const t = todayISO();
        const strip = document.getElementById('todayStrip');
        const parts = ['<span class="strip-label">Today</span>'];
        const todays = ORDER.filter(sec => meetingsOf(sec).some(m => m.d === t));
        if (!todays.length) {
            parts.push('<span class="strip-none">no Room 8 classes today</span>');
        } else {
            for (const sec of todays) {
                const m = meetingsOf(sec).find(x => x.d === t);
                const logged = entries.some(e => e.section === sec && e.date === t);
                parts.push(
                    '<span class="today-chip-class' + (logged ? ' done' : '') + '" title="' + MEET[sec].label + '">' +
                    '<span class="p">' + m.p + '</span>' + sec.replace('-', ' ') +
                    (logged ? ' ✓' : '') + '</span>'
                );
            }
        }
        strip.innerHTML = parts.join('');
    }
    function renderCards() {
        const wrap = document.getElementById('cards');
        const t = todayISO();
        // Preserve open plan editors (and anything being typed) across re-renders
        const editorState = {};
        document.querySelectorAll('.plan-editor.open').forEach(pe => {
            const secId = pe.id.replace(/^pe-/, '');
            editorState[secId] = {
                open: true,
                note: document.getElementById('pe-note-' + secId) ? document.getElementById('pe-note-' + secId).value : '',
                classNo: document.getElementById('pe-no-' + secId) ? document.getElementById('pe-no-' + secId).value : ''
            };
        });
        wrap.innerHTML = ORDER.map(sec => {
            const info = MEET[sec];
            if (!info) return '';
            const last = lastEntry(sec);
            const next = nextMeeting(sec);
            const meetsTodayNotLogged = meetingsOf(sec).some(m => m.d === t) && !(last && last.date === t);
            const course = info.course;

            let lastBlock;
            if (last) {
                const clsTag = (last.classNo && String(last.classNo).trim()) ? ' <span class="cls-tag">Cl. ' + escapeHtml(String(last.classNo).trim()) + '</span>' : '';
                lastBlock =
                    '<div class="block"><div class="b-label">Last class</div>' +
                    '<div class="b-meta">' + fmtShort(last.date) + clsTag + '</div>' +
                    '<div class="b-text' + (last.did ? '' : ' empty') + '">' +
                    (last.did ? escapeHtml(last.did) : 'no notes') + '</div></div>';
            } else {
                lastBlock =
                    '<div class="block"><div class="b-label">Last class</div>' +
                    '<div class="b-text empty">no entries yet this year</div></div>';
            }

            let nextBlock;
            if (next) {
                const dd = diffDays(next.d);
                const cls = dd === 0 ? 'today' : dd <= 2 ? 'soon' : 'later';
                const count = dd === 0 ? 'TODAY ' + next.p : dd === 1 ? 'TOMORROW' : 'in ' + dd + 'd';
                const plan = plans[sec];
                const planNote = plan && plan.note ? String(plan.note) : '';
                const planTag = planNote
                    ? '<span class="plan-tag" title="Forward plan — editable with ✎">PLAN</span>'
                    : '';
                const nextNote = planNote || (last && last.next ? escapeHtml(last.next) : '');
                nextBlock =
                    '<div class="block"><div class="b-label">Next class' +
                    '<a class="plan-link" data-action="edit-plan" data-sec="' + sec + '">✎ plan</a>' +
                    planTag + '</div>' +
                    '<div class="b-meta">' + fmtShort(next.d) + ' · ' + next.p +
                    '<span class="count ' + cls + '">' + count + '</span></div>' +
                    (nextNote ? '<div class="b-text">' + nextNote + '</div>' : '') +
                    '<div class="hint">▸ ' + escapeHtml(suggestedNext(sec) || '') + '</div>' +
                    '<div class="plan-editor" id="pe-' + sec + '">' +
                    '<label style="font-size:0.64rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--text-dim);">Next class plan (blank = clear)</label>' +
                    '<textarea id="pe-note-' + sec + '" rows="2">' + (planNote ? escapeHtml(planNote) : (last && last.next ? escapeHtml(last.next) : '')) + '</textarea>' +
                    '<input type="number" id="pe-no-' + sec + '" min="1" max="99" placeholder="#" value="' +
                        (plan && plan.classNo ? escapeHtml(String(plan.classNo)) : '') + '">' +
                    '<div class="pe-btns">' +
                    '<button type="button" class="pe-save" data-action="save-plan" data-sec="' + sec + '">Save plan</button>' +
                    '<button type="button" class="pe-clear" data-action="clear-plan" data-sec="' + sec + '">Clear</button>' +
                    '<span class="pe-status" id="pe-status-' + sec + '"></span>' +
                    '</div></div></div>';
            } else {
                nextBlock =
                    '<div class="block"><div class="b-label">Next class</div>' +
                    '<div class="b-text empty">no more scheduled meetings (summer?)</div></div>';
            }

            return (
                '<div class="card' + (meetsTodayNotLogged ? ' needs-logging' : '') + '">' +
                '<div class="card-head">' +
                '<span class="sec-code">' + sec + '</span>' +
                '<span class="sec-name">' + escapeHtml(info.label) + '</span>' +
                '<a class="slide-link" href="Class_Opening_Slide.html?section=' + sec + '" title="Open projector opening slide for this class">🎬</a>' +
                '</div>' +
                '<div class="sec-slots">' + slotSummary(sec) + '</div>' +
                lastBlock + nextBlock + '</div>'
            );
        }).join('');
        // Restore preserved plan editors (open state + in-progress typing)
        Object.keys(editorState).forEach(secId => {
            const pe = document.getElementById('pe-' + secId);
            if (!pe) return;
            pe.classList.add('open');
            const noteEl = document.getElementById('pe-note-' + secId);
            const noEl = document.getElementById('pe-no-' + secId);
            if (noteEl) noteEl.value = editorState[secId].note;
            if (noEl) noEl.value = editorState[secId].classNo;
        });
    }
    function slotSummary(sec) {
        const slots = MEET[sec].slots || {};
        return Object.keys(slots).map(d => 'D' + d + ' ' + slots[d]).join(' · ');
    }
    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------- quick log ----------
    const sectionSel = document.getElementById('qlSection');
    ORDER.forEach(sec => {
        const opt = document.createElement('option');
        opt.value = sec;
        opt.textContent = sec.replace('-', ' ') + ' — ' + (MEET[sec] ? MEET[sec].label : '');
        sectionSel.appendChild(opt);
    });
    // Pre-select the first of today's un-logged classes
    (function preselect() {
        const t = todayISO();
        const pending = ORDER.find(sec => meetingsOf(sec).some(m => m.d === t) && !entries.some(e => e.section === sec && e.date === t));
        const anyToday = ORDER.find(sec => meetingsOf(sec).some(m => m.d === t));
        sectionSel.value = pending || anyToday || ORDER[0];
    })();
    document.getElementById('qlDate').value = todayISO();

    function setStatus(msg, cls) {
        const el = document.getElementById('logStatus');
        el.textContent = msg;
        el.className = 'log-status ' + (cls || '');
    }

    document.getElementById('logForm').addEventListener('submit', async function (ev) {
        ev.preventDefault();
        const entry = {
            date: document.getElementById('qlDate').value,
            section: sectionSel.value,
            course: MEET[sectionSel.value] ? MEET[sectionSel.value].course : '',
            classNo: document.getElementById('qlClassNo').value.trim(),
            did: document.getElementById('qlDid').value.trim(),
            next: document.getElementById('qlNext').value.trim()
        };
        if (!entry.date) { setStatus('Pick a date.', 'err'); return; }
        if (!entry.did && !entry.next) { setStatus('Say what you did or what\u2019s next (or both).', 'err'); return; }

        const btn = document.getElementById('qlSave');
        btn.disabled = true;
        setStatus('Saving to Google Sheet…');
        try {
            const res = await StudentAPI.submitClassLog(entry, localStorage.getItem(PIN_KEY) || '');
            if (res && (res.status === 'class_log_saved' || res.status === 'class_log_updated')) {
                upsertLocal(entry);
                setStatus('Saved ✓ ' + entry.section + ' ' + entry.date, 'ok');
                render();
                refreshLive(true);
            } else if (res && res.status === 'submitted_no_cors') {
                upsertLocal(entry);
                setStatus('Dispatched — verifying…', 'ok');
                render();
                await refreshLive(true);
                setStatus(entries.some(e => e.section === entry.section && e.date === entry.date)
                    ? 'Saved ✓ (verified via Sheet)' : 'Dispatched — could not verify. Check the Sheet.', 'ok');
            } else {
                const msg = (res && res.message) || 'Save failed.';
                if (/PIN/i.test(msg)) {
                    const pin = prompt('Teacher PIN for the class log:');
                    if (pin) {
                        localStorage.setItem(PIN_KEY, pin);
                        btn.disabled = false;
                        setStatus('PIN saved — press Log it again.', 'ok');
                        return;
                    }
                }
                setStatus(msg, 'err');
            }
        } catch (e) {
            setStatus('Save failed: ' + e, 'err');
        }
        btn.disabled = false;
    });

    function upsertLocal(entry) {
        entries = entries.filter(e => !(e.section === entry.section && e.date === entry.date));
        entries.push(Object.assign({ timestamp: new Date().toISOString() }, entry));
        entries.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
        // Mirror the GAS-side behaviour: logging with a "next" note advances the plan
        if (entry.next) {
            plans[entry.section] = {
                note: entry.next,
                classNo: /^\d+$/.test(String(entry.classNo || '')) ? String(Number(entry.classNo) + 1)
                    : (plans[entry.section] ? plans[entry.section].classNo : ''),
                updated: new Date().toISOString()
            };
        }
    }

    // ---------- plan editor ("change direction") ----------
    async function classLogWrite(payloadBuilder, statusEl, okMsg) {
        // shared by quick-log retry + plan editor: runs the write, prompts for PIN once if needed
        let pin = localStorage.getItem(PIN_KEY) || '';
        let res = await StudentAPI_request(payloadBuilder(pin));
        if (res && /PIN/i.test(res.message || '')) {
            const entered = prompt('Teacher PIN for the class log:');
            if (entered === null) { statusEl.textContent = 'Cancelled.'; return null; }
            localStorage.setItem(PIN_KEY, entered);
            res = await StudentAPI_request(payloadBuilder(entered));
        }
        return res;
    }
    function StudentAPI_request(payload) { // thin wrapper so payload builders stay readable
        return StudentAPI._classLogPost(payload, 'HL9');
    }

    document.getElementById('cards').addEventListener('click', async function (ev) {
        const btn = ev.target.closest('[data-action]');
        if (!btn) return;
        const sec = btn.getAttribute('data-sec');
        const editor = document.getElementById('pe-' + sec);
        const statusEl = document.getElementById('pe-status-' + sec);

        if (btn.getAttribute('data-action') === 'edit-plan') {
            editor.classList.toggle('open');
            return;
        }
        if (btn.getAttribute('data-action') === 'clear-plan') {
            btn.disabled = true;
            statusEl.style.color = 'var(--emerald)';
            statusEl.textContent = 'Clearing…';
            const res = await classLogWrite(pin => ({
                action: 'set_class_plan', section: sec, note: '', classNo: '', teacherPin: pin
            }), statusEl);
            btn.disabled = false;
            if (res && (res.status === 'class_plan_set' || res.status === 'submitted_no_cors')) {
                delete plans[sec];
                statusEl.textContent = 'Cleared ✓';
                render();
                refreshLive(true);
            } else {
                statusEl.style.color = 'var(--coral-dark)';
                statusEl.textContent = (res && res.message) || 'Clear failed.';
            }
            return;
        }
        if (btn.getAttribute('data-action') === 'save-plan') {
            const note = document.getElementById('pe-note-' + sec).value.trim();
            const classNo = document.getElementById('pe-no-' + sec).value.trim();
            if (!note) { statusEl.style.color = 'var(--coral-dark)'; statusEl.textContent = 'Type a plan first (or use Clear).'; return; }
            btn.disabled = true;
            statusEl.style.color = 'var(--emerald)';
            statusEl.textContent = 'Saving…';
            const res = await classLogWrite(pin => ({
                action: 'set_class_plan', section: sec, note: note, classNo: classNo, teacherPin: pin
            }), statusEl);
            btn.disabled = false;
            if (res && (res.status === 'class_plan_set' || res.status === 'submitted_no_cors')) {
                plans[sec] = { note: note, classNo: classNo, updated: new Date().toISOString() };
                statusEl.textContent = 'Saved ✓';
                render();
                refreshLive(true);
            } else {
                statusEl.style.color = 'var(--coral-dark)';
                statusEl.textContent = (res && res.message) || 'Save failed.';
            }
        }
    });

    // ---------- live sync ----------
    const pill = document.getElementById('syncPill');
    function setPill(state, label) {
        pill.className = 'sync-pill ' + state;
        pill.textContent = label;
    }
    async function refreshLive(silent) {
        if (!silent) setPill('seed', 'SYNC…');
        try {
            const res = await StudentAPI.getClassLog();
            if (res && res.status === 'success' && Array.isArray(res.entries)) {
                entries = res.entries;
                plans = res.plans || {};
                live = true;
                setPill('live', 'LIVE ✓ ' + entries.length);
            } else if (!live) {
                setPill('seed', 'SEED (offline)');
            } else {
                setPill('seed', 'LIVE? (stale)');
            }
        } catch (e) {
            if (!live) setPill('seed', 'SEED (offline)');
        }
        render();
    }
    pill.addEventListener('click', () => refreshLive(false));
    setInterval(() => refreshLive(true), 5 * 60 * 1000);

    document.getElementById('pinLink').addEventListener('click', () => {
        const cur = localStorage.getItem(PIN_KEY) || '';
        const pin = prompt('Teacher PIN for quick-log (stored in this browser; must match the CLASS_LOG_PIN Script Property in Apps Script — leave empty there to disable):', cur);
        if (pin !== null) {
            if (pin) localStorage.setItem(PIN_KEY, pin); else localStorage.removeItem(PIN_KEY);
            setStatus(pin ? 'PIN saved.' : 'PIN cleared.', 'ok');
        }
    });

    render();
    refreshLive(true);
})();
</script>
</body>
</html>
