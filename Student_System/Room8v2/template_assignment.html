<!DOCTYPE html>

<head>
<!--
═══════════════════════════════════════════════════════════════════════════════
 ROOM 8 v2 ASSIGNMENT TEMPLATE — Bicentennial Junior High
 Mr. Waugh • 2026–27 Academic Year
═══════════════════════════════════════════════════════════════════════════════

 CORE SYSTEM ARCHITECTURE & MECHANICS:

 1. AUTHENTICATION & IDENTITY (GOOGLE SSO — ZERO PINs):
    • Students sign in with their official @gnspes.ca Google account.
    • No 3-letter PINs, no typing passwords, no roster lookup passwords.
    • Identity popup/redirect is managed by Room8.pipe (pipe.js).
    • Official roster mapping automatically resolves the student's name,
      homeroom, and course section (e.g. 902-CIT, 804-HE).
    • Off-roster / teacher accounts get a section dropdown (#r8section) that
      automatically persists and restores across reloads.

 2. PERSISTENCE & THE SERVER (SAY "SERVER", NEVER "GAS"):
    • Live cloud storage in the Room 8 Master Google Sheet via unified BACKEND_URL.
    • Client-facing badges, buttons, tooltips, and confirmation dialogs MUST
      ALWAYS say "Server" (e.g. "☁️ Server: Verified save", "⚡ Verify Server Write").
    • Never display "GAS" or "Google Apps Script" to students.
    • In-tab crash recovery via sessionStorage (r8_tab_draft_*) protects
      unsaved typing between keystrokes and the 2.5s debounced server autosave.
    • Offline event listeners queue saves and warn students if Chromebook wifi drops.

 3. INLINE SVG FAVICON:
    • Always include the inline data URI SVG favicon to avoid 404 network console
      errors on GitHub Pages.

 4. COMPLEX MATRICES & CUSTOM TABLES (STATIC RENDERING PATTERN):
    • Pre-render complex HTML tables (Numbeo grids, audit matrices, comparison tables)
      directly into sections[].fields[] as { type: 'static', html: generateTableHtml() }.
    • NEVER rely on delayed dynamic DOM injection after engine mount; pre-rendering
      guarantees the table is ready immediately and eliminates blank-table bugs.
    • Wire custom inputs into the persistence pipeline using the custom hooks:
      custom: {
        collect: function (answers) { answers.my_table = ...; },
        populate: function (data) { ...restore into table inputs... }
      }

 5. INTERACTIVE CALCULATORS & SENTENCE GENERATION:
    • Percentage / formula differences must generate full, human-readable sentences
      (e.g. "Halifax price is 233% higher" or "Halifax price is 25% lower")
      matching the styled worked example row, rather than truncated codes (-25% (Hali).
    • Allot sufficient width (28%–32%) to the % difference column so sentences fit.
    • Provide dual triggers: auto-calculate live on input/blur, AND support the manual
      [Calc %] button with clear visual feedback:
        - When clicked, button flashes "✓ Done" with green background (#15803d) for 900ms.
        - Result box briefly highlights to confirm calculation.
        - If inputs are empty/invalid, highlight the missing input with a red outline
          so the student immediately sees what needs to be filled in.

 6. COURSE-LEVEL NAMING & SCOPE (NEVER HARDCODE CLASS NUMBERS IN FILENAMES):
    • Assignments serve the entire course, NOT an individual homeroom section.
    • Filenames MUST be course-scoped (e.g. "HL8_5_Dimensions_System_Audit.html",
      NEVER "HL8_Class804_...").
    • CIT9 serves: 901-CIT, 902-CIT, 903-CIT.
    • HL9 serves:  901-HL, 902-HL, 903-HL.
    • HL8 serves:  801-HE, 802-HE, 803-HE, 804-HE.
    • Roster section mapping is resolved automatically per student via Google SSO.
    • Never create per-class forks or hardcode class numbers in filenames or queries.

 7. NO AD-HOC OR DEFUNCT LEGACY API FETCHES:
    • Never inject manual fetch() calls to old, dead script URLs (e.g. &className=804).
      They cause CORS and 404 network errors in the console.
    • All loading and saving is handled exclusively by the Room 8 v2 engine via
      pipe.load(task) and pipe.autosave() against the unified BACKEND_URL.

 8. CHROMEBOOK REALITY (ZERO RELIANCE ON BROWSER LOCALSTORAGE):
    • Student Chromebooks wipe browser storage on logout/sign-in.
    • NEVER rely on localStorage for student state, answers, or progress.
    • All persistence is strictly server-first. Off-roster section choices are bundled
      into the cloud payload (payload.section) so they travel with the student across
      any device or Chromebook session.

 HOW TO CREATE A NEW ASSIGNMENT:
   0. ASK FOR THE ADAPTATION PROFILE FIRST (do not skip):
        Before designing any task, fetch the documented adaptations for the
        section(s) this assignment serves:
          POST <BACKEND_URL> { action:'get_adaptations', teacherPin|identity,
                               section:'802-HE', aggregateOnly:true }
        Then STATE, in the response to the teacher, which adaptations this
        assignment must support and how it supports them. Design decisions that
        follow from it (writing volume, chunking, read-aloud friendliness,
        whether extra time matters) belong in that answer.
        Use aggregateOnly:true unless the teacher needs per-student detail.
        Adaptations are CONFIDENTIAL: never write names or notes into this
        public repo, and never print an adaptation label on a student's screen.
   1. Write the EXEMPLAR first (before the fields):
        Add an `exemplar: { title: '…', html: '…' }` entry to the ASSIGNMENT config —
        one worked example of strong student work for the main written task. Writing
        it BEFORE the fields defines what success looks like and catches rubric
        ambiguity while it's still cheap to fix. The engine renders it as a collapsed
        green card for students and as a comparison card at the top of the Station
        mark sheet. Keep it short (1–2 paragraphs); adapt the section heading and any
        personal framing to the no-personal-reflection rule for Healthy Living.
   2. Copy this file into your course folder (e.g., "Citizenship 9/" or "HealthyLiving8/").
   3. Ensure script tags point to pipe.js and assignment_engine.js:
        src="../Student_System/Room8v2/pipe.js"
        src="../Student_System/Room8v2/assignment_engine.js"
   4. Update ASSIGNMENT config (taskName, course, title, sections, fields).
═══════════════════════════════════════════════════════════════════════════════
-->

<style>

  }

  #r8 {

  .r8-hint { color: #64748b; font-size: 0.88rem; margin: 0 0 8px 0; }

  /* Form Controls */
  textarea, input[type=text], input[type=number], select {
    font-family: 'Source Sans Pro', sans-serif;
    font-size: 0.95rem;
    width: 100%;
    padding: 9px 12px;

  /* Chips & Radios */

  /* Bottom Actions Bar */
  .r8-bar {

  }

  /* Interactive Matrix Table */
  table.matrix {

  table.matrix td { border: 1px solid #e2e8f0; padding: 6px 10px; vertical-align: middle; }

  table.matrix input { padding: 6px 8px; font-size: 0.88rem; }

    font-size: 0.82rem;

<body>

<div id="r8"></div>

<!-- Pipeline dependencies: adjust relative path based on file location -->
<script src="../Student_System/Room8v2/pipe.js"></script>
<script src="../Student_System/Room8v2/assignment_engine.js"></script>

<script>
  // ================= CALCULATION HELPER WITH INTERACTIVE FEEDBACK =================
  // Implements live calculation, sentence formatting, and tactile button confirmation.
  window.calcRow = function (n, isManual) {
    const hfxEl  = document.getElementById('calc_a_' + n);
    const compEl = document.getElementById('calc_b_' + n);
    const out    = document.getElementById('calc_diff_' + n);
    const btn    = document.getElementById('calc_btn_' + n);
    if (!out) return;

    const valA = parseFloat((hfxEl || {}).value);
    const valB = parseFloat((compEl || {}).value);

    // Empty/invalid input handling: outline missing field if user clicked [Calc %]
    if (isNaN(valA) || isNaN(valB) || valB <= 0) {
      if (isManual) {
        if (isNaN(valA) && hfxEl) {
          hfxEl.focus();
          hfxEl.style.outline = '2px solid var(--brand-primary)';
          setTimeout(() => hfxEl.style.outline = '', 1200);
        } else if ((isNaN(valB) || valB <= 0) && compEl) {
          compEl.focus();
          compEl.style.outline = '2px solid var(--brand-primary)';
          setTimeout(() => compEl.style.outline = '', 1200);
        }
      }
      return;
    }

    const pct = ((valA - valB) / valB) * 100;
    const rounded = Math.round(Math.abs(pct));
    let sentence = '';

    if (rounded === 0 || pct === 0) {
      sentence = 'Same price in Halifax (0% diff)';
    } else if (pct > 0) {
      sentence = 'Halifax price is ' + rounded + '% higher';
    } else {
      sentence = 'Halifax price is ' + rounded + '% lower';
    }

    out.value = sentence;
    out.title = sentence;

    // Tactile button feedback when explicitly clicked
    if (isManual && btn) {
      const origText = btn.textContent;
      btn.textContent = '✓ Done';
      btn.style.background = '#15803d';
      out.style.background = '#fce7f3';
      setTimeout(() => {
        btn.textContent = origText;
        btn.style.background = '';
        out.style.background = '';
      }, 900);
    }

    if (window.Room8 && Room8.touch) Room8.touch();
  };

  // Helper to generate pre-rendered static HTML matrix
  function generateInteractiveTableHtml() {
    let rows = '';

    // Worked Example Row (styled pink)
    rows += '<tr style="background: #fdf2f8;">' +
      '<td style="color: #be185d; font-weight: 700;">Sample Item (Worked Example)</td>' +
      '<td><input type="text" value="$3.00" disabled style="background:#fce7f3; font-weight:700;"></td>' +
      '<td><input type="text" value="Bangkok, Thailand" disabled style="background:#fce7f3; font-weight:700;"></td>' +
      '<td><input type="text" value="$0.90" disabled style="background:#fce7f3; font-weight:700;"></td>' +
      '<td style="font-size: 0.8rem; color: #be185d; font-weight: 700; white-space: nowrap;">Halifax price is 233% higher</td>' +
      '</tr>';

    // Interactive Student Rows
    const SAMPLE_ITEMS = [
      { num: 1, label: '1. Meal, Inexpensive Restaurant', city: 'Delhi, India' },
      { num: 2, label: '2. 1.5L Bottle of Water', city: 'Madrid, Spain' }
    ];

    SAMPLE_ITEMS.forEach(item => {
      const n = item.num;
      rows += '<tr>' +
        '<td><b>' + item.label + '</b></td>' +
        '<td><input type="number" step="0.01" id="calc_a_' + n + '" placeholder="$ CAD" oninput="calcRow(' + n + ', false)" onblur="calcRow(' + n + ', false)"></td>' +
        '<td><input type="text" id="calc_city_' + n + '" value="' + item.city + '" readonly style="background:#f1f5f9; font-weight:600;"></td>' +
        '<td><input type="number" step="0.01" id="calc_b_' + n + '" placeholder="$ CAD" oninput="calcRow(' + n + ', false)" onblur="calcRow(' + n + ', false)"></td>' +
        '<td>' +
          '<div style="display:flex; gap:6px; align-items:center;">' +
            '<input type="text" class="nb_diff" id="calc_diff_' + n + '" placeholder="% Difference" style="flex:1; min-width:130px;">' +
            '<button type="button" class="mini" id="calc_btn_' + n + '" onclick="calcRow(' + n + ', true)" style="white-space:nowrap;">Calc %</button>' +
          '</div>' +
        '</td>' +
      '</tr>';
    });

    return '<div style="overflow-x:auto;">' +
      '<table class="matrix"><thead><tr>' +
        '<th style="width:24%;">ITEM</th>' +
        '<th style="width:14%;">HALIFAX PRICE (CAD)</th>' +
        '<th style="width:18%;">COMPARISON CITY</th>' +
        '<th style="width:14%;">CITY PRICE (CAD)</th>' +
        '<th style="width:30%;">% DIFFERENCE</th>' +
      '</tr></thead><tbody>' + rows + '</tbody></table>' +
      '</div>';
  }

  // ================= ASSIGNMENT CONFIG =================
  const ASSIGNMENT = {
    taskName: 'TEMPLATE — Rename Me (Room 8 v2)',
    course: 'CIT9',                                     // CIT9, HL9, or HL8
    title: 'Assignment Title Goes Here',
    kicker: 'COURSE · UNIT · ASSIGNMENT',
    badge: 'POINTS • CLASS',
    classList: ['901-CIT', '902-CIT', '903-CIT'],      // Fallback sections for off-roster accounts
    introHtml:
      '<p>What students read before they start: the scenario, the outcomes, and guidelines.</p>' +
      '<p><b>New this round:</b> sign in with your <code>@gnspes.ca</code> account — no PINs needed. Work autosaves live to the server.</p>',
    sections: [
      {
        num: '1',
        title: 'Section One — Questions & Prompts',
        hint: 'Standard form inputs automatically serialize and restore.',
        fields: [
          { id: 'p1_notes', type: 'textarea', label: '1 · Written Analysis:', hint: 'Explain your reasoning with evidence', rows: 4 },
          { id: 'p1_choice', type: 'select', label: '2 · Policy Selection:', options: ['Option A: Expand Transit', 'Option B: Rent Stabilization', 'Option C: Incentive Grants'] },
          { id: 'p1_checks', type: 'checks', label: '3 · Key Factors Identified:', options: ['Affordability', 'Supply Chain', 'Zoning Laws', 'Inflation'] }
        ]
      },
      {
        num: '2',
        title: 'Section Two — Interactive Matrix & Calculations',
        hint: 'Demonstrates pre-rendered static table with custom collect/populate hooks.',
        fields: [
          { id: 'interactiveTableWrap', type: 'static', html: generateInteractiveTableHtml() }
        ]
      }
    ]
  };

  // ================= SERVER ENDPOINTS & INITIALIZATION =================
  // Official deployed Google Apps Script webhooks (Room 8 Master backend)
  const IDENTITY_URL = 'https://script.google.com/a/macros/gnspes.ca/s/AKfycbxzrLHgG2_vq8lh3VFB7SfPvbqXnn1atuz5S61oGlLul_l_jmlhrRc7Nwww__k9f5L0Rw/exec';
  const BACKEND_URL  = 'https://script.google.com/macros/s/AKfycbz73P9FG2HLIJMl9NY9iex9y1TIm1E8cRglvgrsNVAtrrtUJGXgtP3hwKanl_aWJHuMcw/exec';

  Room8.init({ identityUrl: IDENTITY_URL, backendUrl: BACKEND_URL });

  // Mount with custom serialization hooks for custom static tables
  R8Assignment.mount({
    mount: document.getElementById('r8'),
    pipe: Room8,
    assignment: ASSIGNMENT,
    custom: {
      collect: function (answers) {
        // Collect custom table rows
        answers.custom_matrix = [1, 2].map(function (n) {
          const a = document.getElementById('calc_a_' + n);
          const b = document.getElementById('calc_b_' + n);
          const diff = document.getElementById('calc_diff_' + n);
          return {
            row: n,
            val_a: a ? a.value : '',
            val_b: b ? b.value : '',
            difference: diff ? diff.value : ''
          };
        });
      },
      populate: function (data) {
        // Restore custom table rows
        (data.custom_matrix || []).forEach(function (r) {
          const n = r.row;
          const a = document.getElementById('calc_a_' + n);
          const b = document.getElementById('calc_b_' + n);
          const diff = document.getElementById('calc_diff_' + n);
          if (a && r.val_a) a.value = r.val_a;
          if (b && r.val_b) b.value = r.val_b;
          if (diff && r.difference) diff.value = r.difference;
          if (r.val_a && r.val_b) calcRow(n, false);
        });
      }
    }
  });
</script>
</body>
