<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room 8 — New Assignment</title>
<style>
  :root { --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink);
         max-width: 720px; margin: 28px auto; padding: 0 18px; line-height: 1.5; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  #gate { padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: #f8fafc; }
  #gate h2 { margin: 0 0 6px; font-size: 1.1rem; }
  header.who { font-size: .9rem; color: var(--muted); border-bottom: 1px solid var(--line);
               padding-bottom: 10px; margin-bottom: 16px; }
  header.who b { color: var(--ink); }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  textarea, input, select { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line);
                            border-radius: 6px; }
  textarea { min-height: 140px; resize: vertical; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0;
           background: #1e293b; color: #fff; cursor: pointer; margin-top: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 12px; font-weight: 600; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); } #status.warn { color: var(--warn); }
  .hint { color: var(--muted); font-size: .85rem; font-weight: 400; }
  #restored { display:none; margin: 0 0 12px; padding: 10px 12px; border: 1px solid #bbf7d0;
              background: #f0fdf4; border-radius: 8px; font-size: .9rem; }
</style>
</head>
<body>
  <div id="gate">
    <h2>Sign in to start</h2>
    <p class="hint">Use your school Google account — no PIN, nothing to type.</p>
    <button type="button" onclick="signIn()">Sign in with your school account</button>
    <div id="gateMsg" class="hint" style="margin-top:10px"></div>
  </div>

  <div id="app" hidden>
    <h1 id="title">New Assignment</h1>
    <p class="sub">Your identity comes from your signed-in <code>@gnspes.ca</code> Google account.</p>
    <header class="who">Signed in as <b id="who">…</b>
      <button type="button" onclick="switchAccount()" style="margin:0 0 0 10px;padding:2px 10px;background:#e2e8f0;color:#0f172a;font-size:.8rem">switch</button>
    </header>

    <div id="restored">Restored your last saved work for this assignment.</div>

    <fieldset id="work">
      <!-- ==== ASSIGNMENT FIELDS GO HERE ==== -->
      <label for="answer">Your response</label>
      <textarea id="answer" placeholder="Type here…"></textarea>
      <!-- =================================== -->
    </fieldset>

    <button id="saveBtn" type="button" onclick="saveNow()">Save</button>
    <div id="status" class="hint">Not saved yet.</div>
  </div>

<script>
  // ================= CONFIG (fill these two, per deployment) =================
  const IDENTITY_URL = 'https://script.google.com/a/macros/gnspes.ca/s/AKfycbxzrLHgG2_vq8lh3VFB7SfPvbqXnn1atuz5S61oGlLul_l_jmlhrRc7Nwww__k9f5L0Rw/exec';
  const VAULT_URL    = 'https://script.google.com/macros/s/AKfycbzhCVthh1eWPNo2apOZPTJPhMDVcyL7Q7PrSxIlhiEbauTbXnEJBJcUCSAnPg2X4cZi/exec';
  // ==========================================================================
  const TASK_NAME = 'New Assignment (Google-auth pilot)';
  const SECTIONS  = ['901-CIT', '902-CIT', '903-CIT'];   // [] hides the picker
  const ID_KEY    = 'r8id';          // sessionStorage ONLY holds the sign-in token, never work
  const AUTOSAVE_MS = 2500;

  let identity = null;
  let lastSavedHash = null;
  let timer = null;
  let popupRef = null;

  (function boot() {
    const m = (location.hash || '').match(/[#&]r8id=([^&]+)/);
    if (m) {
      try { identity = JSON.parse(atobUrl(m[1])); sessionStorage.setItem(ID_KEY, JSON.stringify(identity)); }
      catch (e) {}
      history.replaceState(null, '', location.pathname + location.search);
    }
    if (!identity) { try { const s = sessionStorage.getItem(ID_KEY); if (s) identity = JSON.parse(s); } catch (e) {} }
    if (identity && identity.email && identity.sig) showApp(); else showGate();
  })();

  function showGate() { document.getElementById('app').hidden = true; document.getElementById('gate').hidden = false; }

  function showApp() {
    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('who').textContent = identity.email;
    if (SECTIONS.length) {
      const w = document.getElementById('work');
      const lbl = document.createElement('label'); lbl.htmlFor = 'section'; lbl.textContent = 'Section';
      const sel = document.createElement('select'); sel.id = 'section';
      sel.innerHTML = '<option value="">Select your section…</option>' + SECTIONS.map(s => '<option>' + s + '</option>').join('');
      w.insertBefore(sel, w.firstChild); w.insertBefore(lbl, sel);
      sel.addEventListener('change', onChange);
    }
    document.getElementById('answer').addEventListener('input', onChange);
    // Flush a pending save if the tab is hidden/closed (best effort; autosave is the real safety net)
    document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
    window.addEventListener('pagehide', flush);
    restore();
  }

  // ---- restore from the SERVER (no on-device storage) ----
  function restore() {
    setStatus('Loading your saved work…', '');
    post(VAULT_URL, { action: 'load_assignment', email: identity.email, ts: identity.ts, sig: identity.sig, task: TASK_NAME })
      .then(j => {
        if (j && j.status === 'ok' && j.found) {
          if (j.data && typeof j.data.answer === 'string') document.getElementById('answer').value = j.data.answer;
          if (j.section) { const s = document.getElementById('section'); if (s) s.value = j.section; }
          document.getElementById('restored').style.display = 'block';
          lastSavedHash = hash();
          setStatus('Restored your last save' + (j.savedAt ? ' (' + new Date(j.savedAt).toLocaleString() + ')' : '') + '.', 'ok');
        } else if (j && j.status === 'auth_failed') {
          onAuthFailed(j.reason);
        } else {
          setStatus('Not saved yet.', '');
        }
      })
      .catch(() => setStatus('Could not load previous work (network). You can still type and Save.', 'warn'));
  }

  // ---- typing -> debounced server autosave ----
  function onChange() {
    clearTimeout(timer);
    setStatus('Editing… (autosaves)', '');
    timer = setTimeout(save, AUTOSAVE_MS);
  }
  function flush() { clearTimeout(timer); if (isDirty()) save(); }
  function saveNow() { clearTimeout(timer); save(); }

  function currentFields() {
    return { answer: document.getElementById('answer').value, section: (document.getElementById('section') || {}).value || '' };
  }
  function hash() { return JSON.stringify(currentFields()); }
  function isDirty() { return hash() !== lastSavedHash; }

  function save() {
    if (!identity) { showGate(); return; }
    if (!isDirty()) { return; }
    const fields = currentFields();
    const requestId = 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const summary = 'answer: ' + (fields.answer || '').slice(0, 80);
    const payload = { action: 'submit_assignment', email: identity.email, ts: identity.ts, sig: identity.sig,
                      task: TASK_NAME, section: fields.section, summary, data: fields, requestId };
    const btn = document.getElementById('saveBtn'); btn.disabled = true;
    setStatus('Saving…', '');
    post(VAULT_URL, payload)
      .then(j => {
        btn.disabled = false;
        if (j && j.status === 'submitted_successfully') { lastSavedHash = hash(); setStatus('Saved ✓', 'ok'); }
        else if (j && j.status === 'auth_failed') { onAuthFailed(j.reason); }
        else { setStatus('Not saved: ' + ((j && (j.reason || j.message)) || 'unknown'), 'bad'); }
      })
      .catch(() => {
        btn.disabled = false;
        // CORS-blocked / network: best-effort no-cors dispatch + beacon, then confirm.
        try { fetch(VAULT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), keepalive: true }); } catch (e) {}
        try { if (navigator.sendBeacon) navigator.sendBeacon(VAULT_URL, new Blob([JSON.stringify(payload)], { type: 'text/plain;charset=utf-8' })); } catch (e) {}
        setStatus('Saved — verifying…', 'warn');
        setTimeout(() => verify(requestId), 2500);
      });
  }

  function verify(requestId) {
    fetch(VAULT_URL + '?action=verify&requestId=' + encodeURIComponent(requestId) + '&t=' + Date.now())
      .then(r => r.json())
      .then(j => { if (j && j.found) { lastSavedHash = hash(); setStatus('Saved ✓', 'ok'); } else setStatus('Not confirmed yet — keep working; it will retry.', 'warn'); })
      .catch(() => setStatus('Could not confirm — keep working; it will retry.', 'warn'));
  }

  function onAuthFailed(reason) {
    if (reason === 'stale_or_future' || reason === 'bad_sig' || reason === 'missing') {
      try { sessionStorage.removeItem(ID_KEY); } catch (e) {}
      identity = null;
      const el = document.getElementById('status');
      el.className = 'warn';
      el.innerHTML = 'Your sign-in expired — work is kept on the server. <button type="button" onclick="signIn()" style="margin:0;padding:4px 10px;font-size:.85rem">Sign in again</button>';
    } else {
      setStatus('Not saved: ' + reason, 'bad');
    }
  }

  function signIn() {
    // Open the Identity app in a POPUP; it postMessages the signed identity back to
    // this page, so this page never leaves its own origin.
    const url = IDENTITY_URL + '?return=' + encodeURIComponent(location.origin);
    popupRef = window.open(url, 'r8signin', 'width=520,height=700');
    if (!popupRef) document.getElementById('gateMsg').textContent = 'Pop-up blocked — allow pop-ups for this site, then try again.';
  }

  // The Identity popup posts the signed identity here (and closes itself).
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.type !== 'r8id' || !e.data.id) return;
    const id = e.data.id;
    if (!id.email || !id.sig) return;
    identity = id;
    try { sessionStorage.setItem(ID_KEY, JSON.stringify(id)); } catch (_) {}
    showApp();
    // Close the popup from the opener: the app can't always close itself, because
    // Google's sign-in redirects push the popup's history past where close() works.
    try { if (popupRef && !popupRef.closed) popupRef.close(); } catch (_) {}
  });
  function switchAccount() { try { sessionStorage.removeItem(ID_KEY); } catch (e) {} identity = null; location.reload(); }

  // POST helper: text/plain avoids a CORS preflight; resolves with the parsed JSON.
  function post(url, obj) {
    return fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(obj), keepalive: true })
      .then(r => r.json());
  }
  function setStatus(msg, kind) { const el = document.getElementById('status'); el.textContent = msg; el.className = kind || 'hint'; }
  function atobUrl(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return atob(s); }
</script>
</body>
</html>
