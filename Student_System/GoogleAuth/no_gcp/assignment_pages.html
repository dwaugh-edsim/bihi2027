<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room 8 — New Assignment</title>
<style>
  :root { --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --ok:#15803d; --bad:#b91c1c; --warn:#b45309; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: var(--ink);
         max-width: 720px; margin: 28px auto; padding: 0 18px; line-height: 1.5; }
  h1 { font-size: 1.35rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  #gate { padding: 24px; border: 1px solid var(--line); border-radius: 10px; background: #f8fafc; }
  #gate h2 { margin: 0 0 6px; font-size: 1.1rem; }
  header.who { font-size: .9rem; color: var(--muted); border-bottom: 1px solid var(--line);
               padding-bottom: 10px; margin-bottom: 16px; }
  header.who b { color: var(--ink); }
  fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  label { display: block; font-weight: 600; margin: 10px 0 4px; }
  textarea, input, select { font: inherit; width: 100%; padding: 8px 10px; border: 1px solid var(--line);
                            border-radius: 6px; }
  textarea { min-height: 120px; resize: vertical; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 8px; border: 0;
           background: #1e293b; color: #fff; cursor: pointer; margin-top: 14px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #status { margin-top: 12px; font-weight: 600; }
  #status.ok { color: var(--ok); } #status.bad { color: var(--bad); } #status.warn { color: var(--warn); }
  .hint { color: var(--muted); font-size: .85rem; font-weight: 400; }
  #draftBar { display:none; margin: 0 0 12px; padding: 10px 12px; border: 1px solid #fde68a;
              background: #fffbeb; border-radius: 8px; font-size: .9rem; }
</style>
</head>
<body>
  <!-- Signed-out gate -->
  <div id="gate">
    <h2>Sign in to start</h2>
    <p class="hint">Use your school Google account — no PIN, nothing to type.</p>
    <button type="button" onclick="signIn()">Sign in with your school account</button>
    <div id="gateMsg" class="hint" style="margin-top:10px"></div>
  </div>

  <!-- Signed-in assignment -->
  <div id="app" hidden>
    <h1 id="title">New Assignment</h1>
    <p class="sub">Your identity comes from your signed-in <code>@gnspes.ca</code> Google account.</p>
    <header class="who">Signed in as <b id="who">…</b>
      <button type="button" onclick="signOut()" style="margin:0 0 0 10px;padding:2px 10px;background:#e2e8f0;color:#0f172a;font-size:.8rem">switch</button>
    </header>

    <div id="draftBar">We found unsaved work on this device. <button type="button" onclick="restoreDraft()" style="margin:0;padding:4px 10px;font-size:.8rem">Restore</button></div>

    <fieldset id="work">
      <!-- ==== ASSIGNMENT FIELDS GO HERE ==== -->
      <label for="answer">Your response</label>
      <textarea id="answer" placeholder="Type here…"></textarea>
      <!-- =================================== -->
    </fieldset>

    <button id="saveBtn" type="button" onclick="save()">Save</button>
    <div id="status" class="hint">Not saved yet.</div>
  </div>

<script>
  // ================= CONFIG (fill these two, per deployment) =================
  const IDENTITY_URL = 'https://script.google.com/a/macros/gnspes.ca/s/AKfycbxzrLHgG2_vq8lh3VFB7SfPvbqXnn1atuz5S61oGlLul_l_jmlhrRc7Nwww__k9f5L0Rw/exec';
  const VAULT_URL    = 'https://script.google.com/macros/s/AKfycbzhCVthh1eWPNo2apOZPTJPhMDVcyL7Q7PrSxIlhiEbauTbXnEJBJcUCSAnPg2X4cZi/exec';
  // ==========================================================================
  const TASK_NAME = 'New Assignment (Google-auth pilot)';
  const SECTIONS  = ['901-CIT', '902-CIT', '903-CIT'];   // [] hides the picker
  const ID_KEY    = 'r8id';   // sessionStorage key

  let identity = null;

  // ---- boot: read a handoff fragment, else a stored session, else the gate ----
  (function boot() {
    const m = (location.hash || '').match(/[#&]r8id=([^&]+)/);
    if (m) {
      try { identity = JSON.parse(atobUrl(m[1])); sessionStorage.setItem(ID_KEY, JSON.stringify(identity)); }
      catch (e) { /* malformed — fall through to gate */ }
      // strip the fragment so the raw identity isn't left in the URL bar / history
      history.replaceState(null, '', location.pathname + location.search);
    }
    if (!identity) {
      try { const s = sessionStorage.getItem(ID_KEY); if (s) identity = JSON.parse(s); } catch (e) {}
    }
    if (identity && identity.email && identity.sig) showApp(); else showGate();
  })();

  function showGate() {
    document.getElementById('app').hidden = true;
    document.getElementById('gate').hidden = false;
  }
  function showApp() {
    document.getElementById('gate').hidden = true;
    document.getElementById('app').hidden = false;
    document.getElementById('who').textContent = identity.email;
    if (SECTIONS.length) {
      const w = document.getElementById('work');
      const lbl = document.createElement('label'); lbl.htmlFor = 'section'; lbl.textContent = 'Section';
      const sel = document.createElement('select'); sel.id = 'section';
      sel.innerHTML = '<option value="">Select your section…</option>' + SECTIONS.map(s => '<option>' + s + '</option>').join('');
      w.insertBefore(sel, w.firstChild); w.insertBefore(lbl, sel);
    }
    if (localStorage.getItem(draftKey())) document.getElementById('draftBar').style.display = 'block';
  }

  // ---- identity handoff: bounce through the Identity app and back here ----
  function signIn() {
    const back = location.href.split('#')[0];
    location.href = IDENTITY_URL + '?return=' + encodeURIComponent(back);
  }
  function signOut() { sessionStorage.removeItem(ID_KEY); identity = null; location.reload(); }

  // ---- save: CORS POST first (reads JSON), no-cors + beacon fallback, verify ----
  async function save() {
    if (!identity) { showGate(); return; }
    const btn = document.getElementById('saveBtn');
    const sectionEl = document.getElementById('section');
    const data = { answer: document.getElementById('answer').value };
    const requestId = 'r-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const summary = 'answer: ' + (data.answer || '').slice(0, 80);
    const payload = JSON.stringify({
      action: 'submit_assignment',
      email: identity.email, ts: identity.ts, sig: identity.sig,
      task: TASK_NAME, section: sectionEl ? sectionEl.value : '',
      summary: summary, data: data, requestId: requestId
    });

    // local backup first — nothing is lost even if the network fails
    try { localStorage.setItem(draftKey(), JSON.stringify({ data: data, section: sectionEl ? sectionEl.value : '', at: Date.now() })); } catch (e) {}

    btn.disabled = true; setStatus('Saving…', '');
    try {
      const res = await fetch(VAULT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: payload, keepalive: true
      });
      const j = await res.json();
      btn.disabled = false;
      if (j.status === 'submitted_successfully') { onSaved(); return; }
      if (j.status === 'auth_failed') { onAuthFailed(j.reason); return; }
      setStatus('Not saved: ' + (j.reason || j.message || 'unknown'), 'bad');
    } catch (e) {
      // CORS blocked / network hiccup: dispatch no-cors + beacon, then verify
      try { fetch(VAULT_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: payload, keepalive: true }); } catch (e2) {}
      try { if (navigator.sendBeacon) navigator.sendBeacon(VAULT_URL, new Blob([payload], { type: 'text/plain;charset=utf-8' })); } catch (e3) {}
      setStatus('Saved — verifying…', 'warn'); btn.disabled = false;
      setTimeout(() => verify(requestId), 2500);
    }
  }

  async function verify(requestId) {
    try {
      const r = await fetch(VAULT_URL + '?action=verify&requestId=' + encodeURIComponent(requestId) + '&t=' + Date.now());
      const j = await r.json();
      if (j.found) onSaved(); else setStatus('Not confirmed yet — press Save again.', 'bad');
    } catch (e) { setStatus('Could not confirm — press Save again.', 'bad'); }
  }

  function onSaved() {
    setStatus('Saved ✓', 'ok');
    try { localStorage.removeItem(draftKey()); } catch (e) {}
    document.getElementById('draftBar').style.display = 'none';
  }
  function onAuthFailed(reason) {
    if (reason === 'stale_or_future' || reason === 'bad_sig' || reason === 'missing') {
      setStatus('Your sign-in expired — click “Sign in” again.', 'warn');
      try { sessionStorage.removeItem(ID_KEY); } catch (e) {}
      identity = null;
      const el = document.getElementById('status');
      el.innerHTML = 'Your sign-in expired. <button type="button" onclick="signIn()" style="margin:0;padding:4px 10px;font-size:.85rem">Sign in again</button>';
    } else {
      setStatus('Not saved: ' + reason, 'bad');
    }
  }

  function restoreDraft() {
    try {
      const d = JSON.parse(localStorage.getItem(draftKey()) || '{}');
      if (d.data && typeof d.data.answer === 'string') document.getElementById('answer').value = d.data.answer;
      if (d.section) { const s = document.getElementById('section'); if (s) s.value = d.section; }
      document.getElementById('draftBar').style.display = 'none';
      setStatus('Restored your unsaved work.', 'warn');
    } catch (e) {}
  }

  const draftKey = () => 'r8draft::' + (identity ? identity.email : 'anon') + '::' + TASK_NAME;
  function setStatus(msg, kind) { const el = document.getElementById('status'); el.textContent = msg; el.className = kind || 'hint'; }
  function atobUrl(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return atob(s); }
</script>
</body>
</html>
