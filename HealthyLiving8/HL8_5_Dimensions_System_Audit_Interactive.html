              '<text x="90" y="142" text-anchor="middle" font-size="7" font-weight="800" fill="#0f172a">SPIRITUAL [SPIR]</text>' +
              '<text x="66" y="66" text-anchor="end" font-size="7" font-weight="800" fill="#0f172a">INTELLECT [INT]</text>' +
              '</svg>' +
              '<div style="font-size:0.75rem; color:#64748b; font-weight:700; margin-top:4px;">LIVE TELEMETRY RADAR</div>' +
              '</div>' +
              '<div class="radar-scales">' +
              '<div style="font-size:0.85rem; color:#475569; font-weight:600;">Select your score on each axis to draw your current pentagon:</div>' +
              '</div></div>'
          },
          { id: 'radar_phys', type: 'select', label: '1. Physical — sleep debt, athletic fuel, hydration, screen fatigue:', options: SCALE5, placeholder: '— Rate 1 to 5 —' },
          { id: 'radar_ment', type: 'select', label: '2. Mental/Emotional — stress load, self-talk, emotional regulation:', options: SCALE5, placeholder: '— Rate 1 to 5 —' },
          { id: 'radar_soc', type: 'select', label: '3. Social — group chat drama, peer trust, healthy boundaries:', options: SCALE5, placeholder: '— Rate 1 to 5 —' },
          { id: 'radar_int', type: 'select', label: '4. Intellectual — focus, curiosity, problem-solving stamina:', options: SCALE5, placeholder: '— Rate 1 to 5 —' },
          { id: 'radar_spir', type: 'select', label: '5. Spiritual/Values — core compass, knowing who I am offline:', options: SCALE5, placeholder: '— Rate 1 to 5 —' },
          { id: 'anchor_dim', type: 'select', label: 'My strongest anchor dimension:', options: DIMS5, placeholder: '— Choose Anchor Dimension —' },
          { id: 'anchor_why', type: 'textarea', label: 'Why is that your anchor? (Explain your foundation):', rows: 2 }
        ]
      },
      {
        num: 2,
        title: 'Wall Gallery 10-Station Forensic Audit — Room 8 Patient Files',
        hint: 'Audit all 10 patient cases from the paper docket. Pick the Trigger Dimension, trace the 3-domino cascade, and give one sentence of direct advice.',
        fields: [
          { id: 'stationsTableWrap', type: 'static', html: generateStationsTableHtml() }
        ]
      },
      {
        num: 3,
        title: 'Circuit Breaker & Repair Lab — Cut the Live Wire',
        hint: 'Pick ONE patient from your audit (patients #02 through #10) and engineer their precise behavioral fix.',
        fields: [
          {
            id: 'lab_patient',
            type: 'select',
            label: 'Patient you are treating:',
            placeholder: '— Select Patient to Treat —',
            options: STATIONS.slice(1).map(st => 'Station #' + st.num + ' — ' + st.name + ' (' + st.tag + ')')
          },
          {
            id: 'lab_crx',
            type: 'textarea',
            label: 'Circuit Breaker [CRX] — the one high-leverage micro-habit that cuts the chain:',
            hint: 'Must be concrete, physical, and realistic (e.g. charging outside bedroom, setting a screen cutoff timer).',
            placeholder: 'e.g. Move phone charger to the hallway at 10:15 PM every school night...',
            rows: 3
          },
          {
            id: 'lab_repair',
            type: 'text',
            label: 'Repair Text [REPAIR] — a short 6–8 word message that restores damaged trust:',
            hint: 'High accountability, zero excuses (e.g. "My bad yesterday. Running on fumes.")',
            placeholder: 'e.g. "My bad yesterday. Running on fumes."'
          }
        ]
      },
      {
        num: 4,
        title: 'Review & Sign Off',
        hint: 'Check that every station is filled, then sign.',
        fields: [
          { id: 'docSignature', type: 'text', label: 'Student digital signature — type your full legal or preferred name:' }
        ]
      }
    ]
  };

  // ================= SERVER ENDPOINTS & INITIALIZATION =================
  const IDENTITY_URL = 'https://script.google.com/a/macros/gnspes.ca/s/AKfycbxzrLHgG2_vq8lh3VFB7SfPvbqXnn1atuz5S61oGlLul_l_jmlhrRc7Nwww__k9f5L0Rw/exec';
  const BACKEND_URL  = 'https://script.google.com/macros/s/AKfycbz73P9FG2HLIJMl9NY9iex9y1TIm1E8cRglvgrsNVAtrrtUJGXgtP3hwKanl_aWJHuMcw/exec';

  Room8.init({ identityUrl: IDENTITY_URL, backendUrl: BACKEND_URL });

  // Radar SVG updater: calculates vertices based on 5 scale inputs
  function updateRadar() {
    const p1 = parseInt((document.getElementById('r8f_radar_phys') || {}).value) || 0;
    const p2 = parseInt((document.getElementById('r8f_radar_ment') || {}).value) || 0;
    const p3 = parseInt((document.getElementById('r8f_radar_soc')  || {}).value) || 0;
    const p4 = parseInt((document.getElementById('r8f_radar_int')  || {}).value) || 0;
    const p5 = parseInt((document.getElementById('r8f_radar_spir') || {}).value) || 0;

    const scores = [p1, p2, p3, p5, p4]; // Top, Upper-Right, Lower-Right, Lower-Left, Upper-Left
    const center = { x: 125, y: 80 };
    const maxR = 55;

    // Angles for 5 spokes starting at 12 o'clock (-pi/2)
    const angles = [
      -Math.PI / 2,
      -Math.PI / 2 + 2 * Math.PI / 5,
      -Math.PI / 2 + 4 * Math.PI / 5,
      -Math.PI / 2 + 6 * Math.PI / 5,
      -Math.PI / 2 + 8 * Math.PI / 5
    ];

    const pts = angles.map((ang, idx) => {
      const score = Math.max(0, Math.min(5, scores[idx]));
      const r = (score / 5) * maxR;
      return {
        x: (center.x + r * Math.cos(ang)).toFixed(1),
        y: (center.y + r * Math.sin(ang)).toFixed(1)
      };
    });

    const poly = document.getElementById('radarPoly');
    if (poly) {
      poly.setAttribute('points', pts.map(p => p.x + ',' + p.y).join(' '));
    }

    pts.forEach((p, idx) => {
      const dot = document.getElementById('dot' + idx);
      if (dot) {
        dot.setAttribute('cx', p.x);
        dot.setAttribute('cy', p.y);
      }
    });
  }

  // Mount with custom table collect and populate hooks
  const api = R8Assignment.mount({
    mount: document.getElementById('r8'),
    pipe: Room8,
    assignment: ASSIGNMENT,
    custom: {
      collect: function (answers) {
        STATIONS.forEach(st => {
          const num = st.num;
          const dimEl = document.getElementById('s' + num + '_dim');
          const d1El  = document.getElementById('s' + num + '_d1');
          const d2El  = document.getElementById('s' + num + '_d2');
          const d3El  = document.getElementById('s' + num + '_d3');
          const advEl = document.getElementById('s' + num + '_advice');

          answers['s' + num + '_dim']    = dimEl ? dimEl.value : '';
          answers['s' + num + '_d1']     = d1El  ? d1El.value  : '';
          answers['s' + num + '_d2']     = d2El  ? d2El.value  : '';
          answers['s' + num + '_d3']     = d3El  ? d3El.value  : '';
          answers['s' + num + '_advice'] = advEl ? advEl.value : '';
        });
      },
      populate: function (data) {
        const answers = (data && data.answers) ? data.answers : (data || {});
        STATIONS.forEach(st => {
          const num = st.num;
          const dimEl = document.getElementById('s' + num + '_dim');
          const d1El  = document.getElementById('s' + num + '_d1');
          const d2El  = document.getElementById('s' + num + '_d2');
          const d3El  = document.getElementById('s' + num + '_d3');
          const advEl = document.getElementById('s' + num + '_advice');

          if (dimEl && answers['s' + num + '_dim'])    dimEl.value = answers['s' + num + '_dim'];
          if (d1El  && answers['s' + num + '_d1'])     d1El.value  = answers['s' + num + '_d1'];
          if (d2El  && answers['s' + num + '_d2'])     d2El.value  = answers['s' + num + '_d2'];
          if (d3El  && answers['s' + num + '_d3'])     d3El.value  = answers['s' + num + '_d3'];
          if (advEl && answers['s' + num + '_advice']) advEl.value = answers['s' + num + '_advice'];
        });
        updateRadar();
      }
    }
  });

  // Attach live listeners for radar inputs
  ['radar_phys', 'radar_ment', 'radar_soc', 'radar_int', 'radar_spir'].forEach(id => {
    const el = document.getElementById('r8f_' + id);
    if (el) el.addEventListener('change', updateRadar);
  });
</script>
