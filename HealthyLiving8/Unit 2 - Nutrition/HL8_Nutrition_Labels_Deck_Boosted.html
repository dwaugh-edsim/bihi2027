<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fuel or Trap? Reading Food Labels (AI Boosted)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #070b14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; }
  #stage { position: relative; width: 100vw; height: 100vh; background: #070b14; }
  .b-slide {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.36s ease;
  }
  .b-slide.active { opacity: 1; pointer-events: auto; z-index: 1; }
  .b-slide img { max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; display: block; }
  .b-slide.has-hdr { flex-direction: column; padding: 14px 24px 8px; gap: 6px; }
  .b-slide.has-hdr img { max-height: calc(100vh - 92px); max-width: 100%; }
  .slide-hdr {
    width: 100%; max-width: min(1480px, calc((100vh - 92px) * 16 / 9));
    display: flex; flex-direction: column; gap: 2px;
    padding: 4px 12px 6px; border-left: 4px solid #2dd4bf;
    background: linear-gradient(90deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.25));
    border-radius: 6px;
  }
  .slide-hdr .kicker {
    font-size: clamp(11px, 1.15vw, 14px); font-weight: 800; letter-spacing: 0.12em;
    text-transform: uppercase; color: #2dd4bf;
  }
  .slide-hdr h1 {
    font-size: clamp(22px, 2.7vw, 38px); font-weight: 800; line-height: 1.12;
    color: #f8fafc; letter-spacing: -0.01em;
  }
  #hud {
    position: fixed; bottom: 14px; right: 16px; z-index: 10; display: flex; align-items: center; gap: 8px;
    background: rgba(15, 23, 42, 0.84); border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 999px; padding: 6px 12px; backdrop-filter: blur(8px); font-size: 13px;
    opacity: 0.35; transition: opacity 0.2s;
  }
  #hud:hover { opacity: 1; }
  .hbtn {
    background: rgba(30, 41, 59, 0.9); color: #f8fafc; border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 999px; padding: 4px 10px; cursor: pointer; font-weight: 700; font-size: 12px; text-decoration: none;
  }
  .hbtn:hover { background: #1e293b; border-color: #2dd4bf; }
  #ctr { font-family: ui-monospace, monospace; font-weight: 700; min-width: 56px; text-align: center; color: #94a3b8; }
</style>
</head>
<body>
<div id="stage" onclick="step(1)"></div>
<div id="hud">
  <a class="hbtn" href="HL8_Nutrition_Labels_Deck.html" title="Switch to Low-Cal HTML version">Low-Cal HTML</a>
  <button class="hbtn" type="button" onclick="step(-1)">&larr;</button>
  <span id="ctr">01 / 01</span>
  <button class="hbtn" type="button" onclick="step(1)">&rarr;</button>
  <button class="hbtn" type="button" onclick="toggleFS()">Full</button>
</div>
<script>
const SLIDES = ["HL8_Nutrition_Labels_Deck_boosted/slide_01.png", "HL8_Nutrition_Labels_Deck_boosted/slide_02.png", "HL8_Nutrition_Labels_Deck_boosted/slide_03.png", "HL8_Nutrition_Labels_Deck_boosted/slide_04.png", "HL8_Nutrition_Labels_Deck_boosted/slide_05.png", "HL8_Nutrition_Labels_Deck_boosted/slide_06.png", "HL8_Nutrition_Labels_Deck_boosted/slide_07.png", "HL8_Nutrition_Labels_Deck_boosted/slide_08.png", "HL8_Nutrition_Labels_Deck_boosted/slide_09.png", "HL8_Nutrition_Labels_Deck_boosted/slide_10.png", "HL8_Nutrition_Labels_Deck_boosted/slide_11.png", "HL8_Nutrition_Labels_Deck_boosted/slide_12.png", "HL8_Nutrition_Labels_Deck_boosted/slide_13.png"];
const HEADERS = {
  2: { k: "Healthy Living 8 \u00b7 Outcome CO2 \u00b7 Health Behaviours", t: "Fuel or Trap? Reading Food Labels" },
  3: { k: "Nutrition Basics \u00b7 Term 1 of 4", t: "Calories: Your Body's Energy Unit" },
  4: { k: "Nutrition Basics \u00b7 Term 2 of 4", t: "Carbs: Fast Crash vs. Slow Fuel" },
  5: { k: "Nutrition Basics \u00b7 Term 3 of 4", t: "Protein: The Body's Builder" },
  7: { k: "Mythbusting", t: "Sugar in Fruit: Is It a Problem?" },
  8: { k: "How Canadian Labels Work", t: "Label Rule 1: Serving Size First" },
  9: { k: "How Canadian Labels Work", t: "Label Rule 2: The 5% / 15% Rule" },
  12: { k: "Mythbusting & Safety", t: "Fueling vs. Restricting: Two Opposite Traps" },
  13: { k: "Room 8 Investigation", t: "Gallery Walk: Label Autopsy (10 Stations)" }
};
const stage = document.getElementById('stage');
const frames = SLIDES.map((src, i) => {
  const d = document.createElement('div');
  const hdr = HEADERS[i + 1];
  d.className = 'b-slide' + (hdr ? ' has-hdr' : '');
  if (hdr) {
    const h = document.createElement('div');
    h.className = 'slide-hdr';
    const k = document.createElement('div');
    k.className = 'kicker';
    k.textContent = hdr.k;
    const h1 = document.createElement('h1');
    h1.textContent = hdr.t;
    h.appendChild(k);
    h.appendChild(h1);
    d.appendChild(h);
  }
  const img = document.createElement('img');
  img.src = src; img.alt = 'Slide ' + (i + 1);
  d.appendChild(img); stage.appendChild(d);
  return d;
});
let idx = 0;
function show(n) {
  idx = Math.max(0, Math.min(SLIDES.length - 1, n));
  frames.forEach((f, i) => f.classList.toggle('active', i === idx));
  const pad = v => (v < 10 ? '0' : '') + v;
  document.getElementById('ctr').textContent = pad(idx + 1) + ' / ' + pad(SLIDES.length);
  if (history.replaceState) history.replaceState(null, null, '#' + (idx + 1));
}
function step(d) { show(idx + d); }
function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(SLIDES.length - 1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFS(); }
});
const h = parseInt((location.hash || '').slice(1), 10);
show(!isNaN(h) && h >= 1 ? h - 1 : 0);
</script>
</body>
</html>
