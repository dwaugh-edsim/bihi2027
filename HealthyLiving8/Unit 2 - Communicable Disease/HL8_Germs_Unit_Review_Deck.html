<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HL8 Unit 2 • Germs and Outbreaks: Unit Review</title>
<!--
    HL8 Germs Strand Unit Review deck (quiz reveal style).
    Companion to the Centennial Case 55 sim and the germs unit test.
    Layout: a fixed 1536x864 canvas scaled to fit the screen (PowerPoint style).
    Fonts: Arvo slab display, Source Sans 3 body, JetBrains Mono labels.
    Keys: ARROW KEYS = move between questions. SPACE or click = reveal the answer.
    Edit the QUESTIONS block near the bottom of this file to change content.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        /* Strongly Typed light palette, matched to the Case 55 intro deck */
        --paper: #eceff2;
        --surface: #ffffff;
        --surface-subtle: #f8fafc;
        --line: #cbd5e1;
        --line-soft: #e5e9f0;
        --line-dark: #94a3b8;
        --ink: #1e2530;
        --ink-heading: #0f172a;
        --ink-body: #2c3440;
        --ink-muted: #475569;
        --dim: #64748b;

        --coral: #ed786a;
        --coral-dark: #c95548;
        --coral-pale: #fdf0ee;
        --teal: #0f766e;
        --teal-pale: #f0fdfa;
        --navy: #1d4ed8;
        --navy-pale: #eff6ff;
        --amber: #b45309;
        --amber-pale: #fef3c7;
        --emerald: #15803d;
        --emerald-pale: #dcfce7;

        --font-display: 'Arvo', Georgia, serif;
        --font-body: 'Source Sans 3', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; }

    html, body {
        height: 100%;
        background: #14171d;
        color: var(--ink);
        font-family: var(--font-body);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
    }

    /* Fixed stage: 1536 x 864, scaled to fit any screen */
    #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
    }
    #canvas {
        width: 1536px;
        height: 864px;
        flex: none;
        background: var(--paper);
        background-image:
            repeating-linear-gradient(135deg, rgba(30,58,138,.020) 0 2px, transparent 2px 14px);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transform-origin: center center;
        box-shadow: 0 18px 60px rgba(0,0,0,.45);
    }

    /* Header bar */
    #header {
        background: var(--surface);
        padding: 12px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        gap: 16px;
        border-bottom: 2px solid var(--line);
    }
    .header-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        min-width: 0;
    }
    .brand-mark {
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: .14em;
        color: var(--coral-dark);
        border: 2px solid var(--coral-dark);
        border-radius: 6px;
        padding: 4px 9px;
        white-space: nowrap;
    }
    .brand-title {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 19px;
        color: var(--ink-heading);
        white-space: nowrap;
    }
    .brand-sub {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--dim);
        white-space: nowrap;
    }
    #counter {
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 800;
        color: var(--ink-heading);
        background: var(--surface-subtle);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 5px 12px;
        white-space: nowrap;
    }
    .nav-btns { display: flex; gap: 8px; }
    .nav-btns button {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .06em;
        color: var(--ink-heading);
        background: var(--surface-subtle);
        border: 1.5px solid var(--line-dark);
        border-radius: 6px;
        padding: 6px 14px;
        cursor: pointer;
    }
    .nav-btns button:hover:not(:disabled) { background: var(--navy-pale); border-color: var(--navy); }
    .nav-btns button:disabled { opacity: .35; cursor: default; }

    /* Slide area */
    #slides {
        flex: 1;
        position: relative;
        overflow: hidden;
    }
    .slide {
        position: absolute;
        inset: 0;
        display: none;
        flex-direction: column;
        padding: 34px 64px 30px;
    }
    .slide.active { display: flex; }

    .eyebrow-row {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 14px;
    }
    .eyebrow-num {
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 20px;
        color: var(--surface);
        background: var(--ink-heading);
        border-radius: 8px;
        padding: 6px 14px;
        letter-spacing: .08em;
    }
    .eyebrow-cat {
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--teal);
        background: var(--teal-pale);
        border: 1.5px solid var(--teal);
        border-radius: 999px;
        padding: 7px 16px;
    }
    .eyebrow-cat.cat-germs { color: var(--coral-dark); background: var(--coral-pale); border-color: var(--coral-dark); }
    .eyebrow-cat.cat-tools { color: var(--navy); background: var(--navy-pale); border-color: var(--navy); }
    .eyebrow-cat.cat-case { color: var(--amber); background: var(--amber-pale); border-color: var(--amber); }
    .eyebrow-cat.cat-prevent { color: var(--emerald); background: var(--emerald-pale); border-color: var(--emerald); }

    .q-text {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 51px;
        line-height: 1.18;
        color: var(--ink-heading);
        max-width: 1330px;
    }
    .q-text em { font-style: normal; color: var(--coral-dark); }

    .answer-zone { margin-top: auto; }
    .reveal-hint {
        font-family: var(--font-mono);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: var(--dim);
        padding-bottom: 10px;
    }
    .answer-panel {
        display: none;
        background: var(--amber-pale);
        border: 2px solid var(--amber);
        border-left-width: 12px;
        border-radius: 12px;
        padding: 22px 30px;
    }
    .slide.revealed .answer-panel { display: block; }
    .slide.revealed .reveal-hint { visibility: hidden; }
    .answer-label {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--amber);
        margin-bottom: 8px;
    }
    .answer-text {
        font-family: var(--font-body);
        font-weight: 600;
        font-size: 30px;
        line-height: 1.3;
        color: var(--ink-heading);
    }
    .answer-text strong { font-weight: 800; color: var(--coral-dark); }
    .listen-line {
        margin-top: 12px;
        padding-top: 10px;
        border-top: 1px solid rgba(180,83,9,.35);
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--ink-muted);
    }
    .listen-line .ll-label {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .14em;
        color: var(--amber);
        margin-right: 8px;
    }

    /* Cover slide */
    .cover-num {
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 15px;
        letter-spacing: .2em;
        text-transform: uppercase;
        color: var(--coral-dark);
        margin-bottom: 14px;
    }
    .cover-title {
        font-family: var(--font-display);
        font-weight: 900;
        font-size: 78px;
        line-height: 1.06;
        color: var(--ink-heading);
        margin-bottom: 16px;
    }
    .cover-title em { font-style: normal; color: var(--coral-dark); }
    .cover-sub {
        font-size: 27px;
        font-weight: 600;
        color: var(--ink-muted);
        max-width: 1150px;
        line-height: 1.35;
    }
    .howto {
        margin-top: auto;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
    }
    .howto-card {
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-top: 6px solid var(--teal);
        border-radius: 10px;
        padding: 16px 20px;
    }
    .howto-card .h-key {
        font-family: var(--font-mono);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: var(--teal);
        margin-bottom: 6px;
    }
    .howto-card .h-body { font-size: 20px; font-weight: 600; line-height: 1.3; color: var(--ink-body); }

    /* Closer slides */
    .rules-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 8px; }
    .rule-card {
        background: var(--surface);
        border: 1.5px solid var(--line);
        border-top: 8px solid var(--emerald);
        border-radius: 12px;
        padding: 22px 24px;
        display: flex;
        flex-direction: column;
    }
    .rule-card .r-num {
        font-family: var(--font-mono);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: .16em;
        color: var(--emerald);
        margin-bottom: 8px;
    }
    .rule-card .r-name {
        font-family: var(--font-display);
        font-weight: 700;
        font-size: 29px;
        line-height: 1.15;
        color: var(--ink-heading);
        margin-bottom: 10px;
    }
    .rule-card .r-why { font-size: 21px; font-weight: 600; line-height: 1.32; color: var(--ink-body); margin-top: auto; }
    .shield-line {
        margin-top: 22px;
        background: var(--teal-pale);
        border: 2px solid var(--teal);
        border-radius: 10px;
        padding: 14px 22px;
        font-size: 24px;
        font-weight: 700;
        color: var(--ink-heading);
    }

    .moves-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 8px; }
    .next-up {
        margin-top: 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--navy-pale);
        border: 2px solid var(--navy);
        border-radius: 10px;
        padding: 14px 22px;
        font-size: 24px;
        font-weight: 700;
        color: var(--ink-heading);
    }
</style>
</head>
<body>
<div id="stage">
<div id="canvas">

    <div id="header">
        <div class="header-brand">
            <span class="brand-mark">CASE 55 &middot; CLOSED</span>
            <span>
                <span class="brand-title">Germs &amp; Outbreaks: Unit Review</span><br>
                <span class="brand-sub">Healthy Living 8 &middot; Unit 2 &middot; Communicable Disease</span>
            </span>
        </div>
        <span id="counter">1 / 1</span>
        <div class="nav-btns">
            <button id="prevBtn" onclick="go(-1)">&larr; Back</button>
            <button id="nextBtn" onclick="go(1)">Next &rarr;</button>
        </div>
    </div>

    <div id="slides"></div>

</div>
</div>

<script>
// ===================== CONTENT (edit here) =====================
// cat: WORDS | GERMS | TOOLS | CASE  (drives the chip colour)
const STATIONS = [
 { num: "01", cat: "GERMS", chip: "Germ type?",
   q: "Martha woke up with a spotty rash on her arm and a slight fever. Between a virus and bacteria, which is more likely?",
   a: "<strong>Virus.</strong> A spotty rash with fever reads viral (chickenpox style). Bacterial skin trouble sits at a wound: red, hot, swollen.",
   l: "the rash rule of thumb from Study Sheet 1." },
 { num: "02", cat: "GERMS", chip: "Germ type?",
   q: "Aiden's gym-floor scrape now looks red, hot, and swollen. Between a virus and bacteria, which is more likely?",
   a: "<strong>Bacteria.</strong> Red, hot, and swollen at a broken-skin site means a bacterial infection has entered through the cut.",
   l: "unbroken skin would have blocked it. The scrape was the open gate." },
 { num: "03", cat: "TOOLS", chip: "Pick the tool?",
   q: "Cleanup day. Desks, taps, and door handles need one kind of cleaner. Hands need a different one. Why can they not swap jobs?",
   a: "<strong>Surfaces: bleach, used by trained adults.</strong> <strong>Hands: soap and 20 seconds of running water.</strong> Bleach destroys hard shells but never goes on skin. Soap lifts germs off and rinses them down the drain.",
   l: "sanitizer kills but fails on hard shells, and plain soap only wipes germs around." },
 { num: "04", cat: "GERMS", chip: "Germ type?",
   q: "Nia ate cream cake that sat out in the sun. By night she and three friends who ate the same cake were vomiting with cramps. Virus or bacteria?",
   a: "<strong>Bacteria.</strong> Food poisoning: one contaminated food hits everyone who ate it at the same time.",
   l: "this is a single point source. Station 18's curve is the opposite pattern." },
 { num: "05", cat: "GERMS", chip: "Germ type?",
   q: "Three siblings all threw up on the same night. Nobody needed a doctor, and all were fine within two days. Virus or bacteria?",
   a: "<strong>Virus.</strong> A fast family sweep with recovery inside 24 to 48 hours is the stomach-virus pattern (norovirus style).",
   l: "no single shared meal ties them together, unlike the cake in station 4." },
 { num: "06", cat: "GERMS", chip: "Germ type?",
   q: "Ella's throat feels like fire. No cough at all, and white patches on her tonsils. Virus or bacteria?",
   a: "<strong>Bacteria.</strong> Strep throat: intense sore throat, no cough, white patches. Antibiotics DO cure strep.",
   l: "the medicine rule working the way it should." },
 { num: "07", cat: "WORDS", chip: "Entry gate?",
   q: "Kai typed on a shared keyboard, then rubbed his itchy eyes. A classmate with a bad cold used it just before him. Which gate?",
   a: "<strong>The eyes.</strong> The keyboard is a fomite: hands picked the cold virus up, then carried it straight in.",
   l: "the two-step hands model: pick UP, carry IN." },
 { num: "08", cat: "WORDS", chip: "Entry gate?",
   q: "Rhea fed the class hamster, wiped her hands on her jeans, and ate her sandwich without washing. Which gate let germs in?",
   a: "<strong>The mouth.</strong> Fingers collected germs, then the sandwich carried them in.",
   l: "soap and 20 seconds of water before eating breaks exactly this chain." },
 { num: "09", cat: "WORDS", chip: "Entry gate?",
   q: "DJ dug in the school garden all period with an uncovered scrape on his hand. Which gate did germs use?",
   a: "<strong>The cut or scrape.</strong> Broken skin is an open gate; healthy unbroken skin would have blocked them.",
   l: "the four gates: mouth, nose, eyes, cut." },
 { num: "10", cat: "GERMS", chip: "Travel route?",
   q: "Soccer players share one water bottle at practice. Cases of mono, the kissing disease, appear on the team. Which route?",
   a: "<strong>Bodily fluids.</strong> Saliva exchange through the shared bottle.",
   l: "mono's nickname is the clue." },
 { num: "11", cat: "GERMS", chip: "Travel route?",
   q: "After the nature trail hike, Lena finds a blacklegged tick on her ankle. Which route does a tick use?",
   a: "<strong>Vector.</strong> A biting creature that delivers the germ straight into the blood (Lyme disease).",
   l: "vectors are living carriers, like a taxi for pathogens." },
 { num: "12", cat: "GERMS", chip: "Travel route?",
   q: "During flu week, sick kids all touched the same doorknob and pencil sharpener but never met each other. Which route?",
   a: "<strong>Indirect contact.</strong> Germs waited on shared surfaces, which are fomites.",
   l: "no direct touch is needed for this route." },
 { num: "13", cat: "TOOLS", chip: "Pick the tool?",
   q: "Mr. Boudreau mopped up beside the fountain with plain floor soap. Kids who used the fountain got sick. What should he have used?",
   a: "<strong>Bleach cleaner.</strong> Plain soap only wipes germs around and does not destroy norovirus shells, and the same cloth carried virus to the next tap.",
   l: "bleach breaks the hard shell apart; trained adults handle it." },
 { num: "14", cat: "TOOLS", chip: "Pick the tool?",
   q: "A stomach bug is racing through the school. Coach only has alcohol hand sanitizer before snacks. Which cleaner beats a stomach bug, and why?",
   a: "<strong>Soap and running water for 20 seconds.</strong> Soap LIFTS germs off and water RINSES them away, so it works without killing. Alcohol must KILL germs, and norovirus has a hard protein shell with no fatty coat to dissolve.",
   l: "remove versus kill is the whole distinction." },
 { num: "15", cat: "TOOLS", chip: "Pick the tool?",
   q: "Flu season is coming and the clinic offers flu shots. Which weapon trains your body BEFORE you meet a germ, and how?",
   a: "<strong>The vaccine.</strong> It trains immune memory in advance: antibodies and community immunity that shields classmates who cannot be vaccinated.",
   l: "antibiotics never train and never work ahead of time." },
 { num: "16", cat: "TOOLS", chip: "Pick the tool?",
   q: "Zaid has a bacterial ear infection and needs a cure now. Which tool treats him, and why not the other one?",
   a: "<strong>An antibiotic.</strong> It kills bacteria AFTER you are sick. A vaccine trains ahead of time for a specific germ; it cannot cure an infection already running.",
   l: "before versus after is the timing distinction." },
 { num: "17", cat: "CASE", chip: "Case word?",
   q: "Jayden drank from the west wing fountain at 8:45 in the morning. By 10 that night he was throwing up. What is the gap called?",
   a: "<strong>The incubation period.</strong> The time between picking up a germ and feeling sick. Norovirus runs about 12 to 48 hours; Jayden's gap was about 13.",
   l: "symptoms appearing hours later is not the same as catching it later." },
 { num: "18", cat: "CASE", chip: "Case thinking?",
   q: "The Centennial count went 3, then 7, then 18, then 34, then 55, with bigger jumps every day. What does that prove?",
   a: "<strong>Person to person spread, and it is speeding up.</strong> Each sick person creates more sick people, so the curve climbs all week.",
   l: "one food or water source hits one group at once and fades, like the cake in station 4." },
 { num: "S1", cat: "CASE", chip: "Spare: case word?",
   q: "In an outbreak report, doctors give the FIRST recorded sick person a special two-word nickname. What is it?",
   a: "<strong>Patient zero.</strong> Also accepted: index case.",
   l: "the doctor word plus the number before one." },
 { num: "S2", cat: "TOOLS", chip: "Spare: pick the rule?",
   q: "Taya felt better Tuesday morning after two rough days of stomach flu. The rule still says she waits 48 hours after her LAST symptom. Why?",
   a: "<strong>Shedding.</strong> Recovering people stay contagious for up to 48 hours after symptoms stop, which is exactly why the stay-home rule is 48 hours.",
   l: "feeling better is not the same as stopping the spread." },
];
// ==============================================================

const CATCLASS = { WORDS: "", GERMS: " cat-germs", TOOLS: " cat-tools", CASE: " cat-case" };

const slidesEl = document.getElementById("slides");
const totalSlides = STATIONS.length + 2;   // cover + stations + closer
let currentSlide = 1;

function buildCover() {
    const d = document.createElement("div");
    d.className = "slide";
    d.dataset.slide = 1;
    d.innerHTML =
        '<div class="cover-num">HL8 &middot; Unit 2 &middot; Communicable Disease &middot; Case 55 closed</div>' +
        '<div class="cover-title">Germs &amp; Outbreaks:<br><em>The Reveal</em></div>' +
        '<div class="cover-sub">You walked 18 scenarios around the room. Now we call them, station by station. Say your pair\u2019s answer out loud before the reveal comes up.</div>' +
        '<div class="howto">' +
          '<div class="howto-card"><div class="h-key">Arrow keys</div><div class="h-body">Move between stations</div></div>' +
          '<div class="howto-card"><div class="h-key">Space or click</div><div class="h-body">Reveal the answer and the listen-for</div></div>' +
          '<div class="howto-card"><div class="h-key">18 + 2 spares</div><div class="h-body">S1 and S2 run whenever you call them</div></div>' +
        '</div>';
    return d;
}

function buildStation(st, idx) {
    const d = document.createElement("div");
    d.className = "slide";
    d.dataset.slide = idx + 2;
    d.innerHTML =
        '<div class="eyebrow-row">' +
          '<span class="eyebrow-num">STATION ' + st.num + '</span>' +
          '<span class="eyebrow-cat' + (CATCLASS[st.cat] || "") + '">' + st.chip + '</span>' +
        '</div>' +
        '<div class="q-text">' + st.q + '</div>' +
        '<div class="answer-zone">' +
          '<div class="reveal-hint">SPACE or click to reveal</div>' +
          '<div class="answer-panel">' +
            '<div class="answer-label">Answer</div>' +
            '<div class="answer-text">' + st.a + '</div>' +
            '<div class="listen-line"><span class="ll-label">LISTEN FOR</span>' + st.l + '</div>' +
          '</div>' +
        '</div>';
    return d;
}

function buildCloser() {
    const d = document.createElement("div");
    d.className = "slide";
    d.dataset.slide = totalSlides;
    d.innerHTML =
        '<div class="eyebrow-row"><span class="eyebrow-num">WRAP</span><span class="eyebrow-cat cat-prevent">What the unit test will ask</span></div>' +
        '<div class="q-text" style="font-size:44px;">Three moves. Practise them out loud.</div>' +
        '<div class="moves-list">' +
          '<div class="rule-card"><div class="r-num">MOVE 1 &middot; CLASSIFY</div><div class="r-name">Name the germ and the gate</div><div class="r-why">Virus or bacteria, which entry gate it used (mouth, nose, eyes, cut), and which travel route carried it.</div></div>' +
          '<div class="rule-card"><div class="r-num">MOVE 2 &middot; CHOOSE THE WEAPON</div><div class="r-name">Pick the tool and defend it</div><div class="r-why">Soap removes, sanitizer kills but fails on hard shells, bleach breaks shells on surfaces, vaccines train before, antibiotics cure bacteria after.</div></div>' +
          '<div class="rule-card"><div class="r-num">MOVE 3 &middot; THINK LIKE THE DETECTIVE</div><div class="r-name">Read evidence, rule out, defend</div><div class="r-why">Symptom percentages, recovery times, the daily curve: rule out suspects, defend the culprit, propose the rule that breaks the chain.</div></div>' +
        '</div>' +
        '<div class="next-up">Everything the test checks lives on <u>Study Sheet 1</u> and the <u>Unit Review Study Sheet</u>. Re-read both the night before.</div>';
    return d;
}

slidesEl.appendChild(buildCover());
STATIONS.forEach((st, i) => slidesEl.appendChild(buildStation(st, i)));
slidesEl.appendChild(buildCloser());

const slides = Array.from(document.querySelectorAll(".slide"));
const countDisplay = document.getElementById("counter");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

function render() {
    slides.forEach(s => s.classList.toggle("active", parseInt(s.dataset.slide, 10) === currentSlide));
    countDisplay.textContent = currentSlide + " / " + totalSlides;
    prevBtn.disabled = currentSlide === 1;
    nextBtn.disabled = currentSlide === totalSlides;
    nextBtn.textContent = currentSlide === totalSlides ? "End" : "Next \u2192";
}

function revealOrAdvance() {
    const cur = slides[currentSlide - 1];
    if (!cur.classList.contains("revealed") && cur.querySelector(".answer-panel")) {
        cur.classList.add("revealed");
        return;
    }
    go(1);
}

function go(dir) {
    const n = Math.min(Math.max(currentSlide + dir, 1), totalSlides);
    if (n !== currentSlide) { currentSlide = n; render(); }
}

prevBtn.addEventListener("click", (e) => { e.stopPropagation(); go(-1); });
nextBtn.addEventListener("click", (e) => { e.stopPropagation(); revealOrAdvance(); });
document.getElementById("canvas").addEventListener("click", revealOrAdvance);

window.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === "PageDown") { e.preventDefault(); go(1); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowUp" || e.key === "PageUp") { e.preventDefault(); go(-1); }
    else if (e.code === "Space") { e.preventDefault(); revealOrAdvance(); }
    else if (e.key === "Home") { currentSlide = 1; render(); }
    else if (e.key === "End") { currentSlide = totalSlides; render(); }
});

// Fit 1536x864 canvas to any screen
function fitCanvas() {
    const s = Math.min(document.getElementById("stage").clientWidth / 1536,
                       document.getElementById("stage").clientHeight / 864);
    document.getElementById("canvas").style.transform = "scale(" + s + ")";
}
fitCanvas();
window.addEventListener("resize", fitCanvas);
render();
</script>
</body>
</html>
