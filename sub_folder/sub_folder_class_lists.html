    --border-dark: #475569;
    --bg-card: #ffffff;
    --brand-primary: #1e3a8a;
    --brand-accent: #0284c7;
    --highlight: #f8fafc;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--ink-dark);
    background-color: #f1f5f9;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* Non-printing control toolbar */
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 2px solid #e2e8f0;
    padding: 12px 24px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
  }

  .toolbar-title {
    font-weight: 800;
    font-size: 1.05rem;
    color: var(--brand-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toolbar-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
  }

  .btn {
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border-subtle);
    background: #ffffff;
    color: var(--ink-dark);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .btn:hover {
    background: #f8fafc;
    border-color: var(--border-dark);
  }

  .btn-primary {
    background: var(--brand-primary);
    color: #ffffff;
    border-color: var(--brand-primary);
  }

  .btn-primary:hover {
    background: #172554;
  }

  select.btn {
    padding-right: 28px;
    cursor: pointer;
  }

  /* Main container */
  .container {
    max-width: 960px;
    margin: 24px auto;
    padding: 0 16px;
  }

  /* A4 Page Layout */
  .a4-page {
    background: var(--bg-card);
    width: 100%;
    min-height: 297mm;
    margin-bottom: 28px;
    padding: 18mm 18mm 16mm 18mm;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    box-sizing: border-box;
  }

  /* Page Header */
  .page-header {
    border-bottom: 2px solid var(--ink-dark);
    padding-bottom: 12px;
    margin-bottom: 14px;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .school-dept {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-light);
  }

  .room-badge {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--brand-primary);
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    padding: 2px 8px;
    border-radius: 4px;
  }

  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
  }

  .class-name {
    font-size: 1.55rem;
    font-weight: 800;
    color: var(--ink-dark);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .class-subtext {
    font-size: 0.84rem;
    color: var(--ink-mid);
    font-weight: 500;
    margin-top: 2px;
  }

  .roster-count {
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--brand-primary);
    white-space: nowrap;
  }

  /* Sub metadata blanks */
  .sub-meta-bar {
    display: grid;
    grid-template-columns: 1.4fr 1.6fr 1fr;
    gap: 14px;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--border-subtle);
    font-size: 0.78rem;
    color: var(--ink-mid);
  }

  .meta-field {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .meta-label {
    font-weight: 700;
    color: var(--ink-light);
    text-transform: uppercase;
    font-size: 0.7rem;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .meta-line {
    flex: 1;
    border-bottom: 1px solid var(--border-dark);
    height: 14px;
  }

  /* Meeting times banner */
  .schedule-strip {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-left: 4px solid var(--brand-accent);
    padding: 6px 10px;
    margin-bottom: 12px;
    border-radius: 4px;
    font-size: 0.74rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .schedule-tag {
    font-weight: 700;
    color: var(--brand-primary);
    text-transform: uppercase;
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .schedule-desc {
    color: var(--ink-mid);
    font-family: 'Roboto Mono', monospace;
    font-size: 0.72rem;
  }

  /* Roster Table */
  .roster-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 12px;
    font-size: 0.82rem;
  }

  .roster-table th {
    background: #f1f5f9;
    color: var(--ink-dark);
    font-weight: 700;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 6px 8px;
    border-top: 1px solid var(--border-dark);
    border-bottom: 2px solid var(--border-dark);
    text-align: left;
  }

  .roster-table th.center, .roster-table td.center {
    text-align: center;
  }

  .roster-table td {
    padding: 4.8px 8px;
    border-bottom: 1px solid #e2e8f0;
    color: var(--ink-dark);
    vertical-align: middle;
  }

  .roster-table tr:nth-child(even) td {
    background: #fbfcfe;
  }

  .num-col {
    width: 28px;
    font-family: 'Roboto Mono', monospace;
    font-size: 0.74rem;
    color: var(--ink-light);
    font-weight: 600;
  }

  .name-col {
    font-weight: 600;
    color: var(--ink-dark);
    font-size: 0.84rem;
  }

  .att-col {
    width: 32px;
    border-left: 1px dashed var(--border-subtle);
  }

  .att-box {
    width: 14px;
    height: 14px;
    border: 1px solid #94a3b8;
    border-radius: 3px;
    margin: 0 auto;
  }

  .notes-col {
    width: 220px;
    border-left: 1px solid #cbd5e1;
    font-size: 0.72rem;
    color: var(--ink-light);
  }

  /* Page Footer & Sub Instructions */
  .page-footer {
    border-top: 1.5px solid var(--border-subtle);
    padding-top: 10px;
    margin-top: auto;
  }

  .instructions-box {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 8px 12px;
    display: grid;
    grid-template-columns: 1.4fr 1.6fr;
    gap: 14px;
    font-size: 0.72rem;
  }

  .inst-title {
    font-weight: 700;
    color: var(--brand-primary);
    margin-bottom: 2px;
    text-transform: uppercase;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
  }

  .inst-body {
    color: var(--ink-mid);
    line-height: 1.35;
  }

  .sub-note-lines {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .sub-note-line {
    border-bottom: 1px dashed #94a3b8;
    height: 12px;
  }

  .doc-meta {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 0.65rem;
    color: var(--ink-light);
  }

  /* Print Styles - True A4 Portrait */
  @media print {
    body {
      background: #ffffff !important;
      color: #000000 !important;
    }

    .toolbar {
      display: none !important;
    }

    .container {
      max-width: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .a4-page {
      margin: 0 !important;
      padding: 10mm 12mm 8mm 12mm !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      min-height: 0 !important;
      height: auto !important;
      page-break-after: always !important;
      break-after: page !important;
      page-break-inside: avoid !important;
      break-inside: avoid !important;
    }

    .a4-page:last-child {
      page-break-after: auto !important;
      break-after: auto !important;
    }

    .roster-table td {
      padding: 3.8px 6px !important;
      font-size: 0.78rem !important;
    }

    .roster-table th {
      padding: 5px 6px !important;
      font-size: 0.68rem !important;
    }

    .schedule-strip {
      padding: 4px 8px !important;
      margin-bottom: 8px !important;
    }

    .class-name {
      font-size: 1.35rem !important;
    }

    .instructions-box {
      padding: 6px 10px !important;
    }
  }

  @page {
    size: A4 portrait;
    margin: 8mm 6mm;
  }
</style>
</head>
