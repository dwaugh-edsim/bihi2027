<style>
    :root {
        --text-main:#0f172a; --text-muted:#475569; --bg:#e2e8f0;
        --accent:#2563eb; --amber:#b45309; --red:#b91c1c; --green:#15803d;
        --line:#cbd5e1;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text-main); background:var(--bg); line-height:1.45; }

    .top-toolbar { position:sticky; top:0; z-index:50; background:#0f172a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .tb-title { font-family:'Roboto Slab',serif; font-weight:800; font-size:1rem; }
    .tb-btn { background:#1e293b; color:#fff; border:1px solid #334155; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:.82rem; font-weight:600; }
    .tb-btn:hover { background:#334155; }
    .tb-count { font-family:'JetBrains Mono',monospace; font-size:.8rem; color:#94a3b8; margin-left:auto; }

    .progress-container { height:4px; background:#1e293b; }
    .progress-bar-wrap { height:100%; }
    .progress-bar-fill { height:100%; background:var(--accent); width:0; transition:width .18s ease; }

    .stage { max-width:1180px; margin:26px auto 30px auto; padding:0 20px; }

    .slide.active { display:block; }

    .slide-num { font-family:'JetBrains Mono',monospace; font-size:.82rem; font-weight:800; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase; margin-bottom:20px; }

    .claim { font-family:'Roboto Slab',serif; font-size:2.5rem; font-weight:800; line-height:1.24; }
    .claim-src { font-size:.9rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin-top:18px; }
    .claim-src::before { content: "Source: "; font-weight: 700; color: #64748b; }

    .prompt { margin-top:40px; border:2px dashed var(--line); border-radius:10px; padding:20px 24px; background:#f8fafc; }
    .prompt-h { font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .vote-chips { display:flex; gap:14px; flex-wrap:wrap; }
    .vote-chip { font-family:'JetBrains Mono',monospace; font-weight:800; font-size:1.05rem; padding:10px 26px; border:2px solid var(--text-main); border-radius:8px; background:#fff; }

    .verdict-head { display:flex; align-items:center; gap:22px; margin-bottom:28px; flex-wrap:wrap; }

    .why-label { font-size:.74rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }

    .nav-btn:hover:not(:disabled) { background:#f1f5f9; border-color:var(--text-main); }
    .nav-btn:disabled { opacity:.4; cursor:default; }

    @media print {
        @page { size:landscape; margin:10mm; }

        .top-toolbar, .progress-container, .nav-foot, .no-print { display:none !important; }

        .slide:last-child { page-break-after:auto; break-after:auto; }

<body>

<div class="top-toolbar no-print">
  <div class="tb-title">Nobody Told Me — Reveal</div>
  <button class="tb-btn" onclick="window.print()">Print all 40</button>
  <button class="tb-btn" onclick="jump(0)">Start</button>
  <div class="tb-count"><span id="cur">1</span> / <span id="tot">40</span> &nbsp;·&nbsp; arrow keys</div>
</div>
<div class="progress-container no-print"><div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar"></div></div></div>

<script>
// [claim, attribution, verdict, why]
// Student-facing only. Teacher scripts and notes live in the facilitation guide.
const DECK = [

["Clear or whitish fluid in underwear is normally just the body washing itself clean.","overheard in a change room · argued about for days","TRUE",
 "<strong>True — the body's self-cleaning system at work.</strong> The vagina continuously washes itself out, the same way your eyes wash themselves with tears. Discharge changes in texture and amount across the month, and that is completely normal biology. The only thing to check is <strong>a change from your normal</strong>: a strong foul smell, grey or greenish colour, clumpy cottage-cheese texture, itching or burning — <span class=\"hl\">that list is what a clinic visit is for</span>. The everyday fluid is just the system keeping itself healthy."],

["If you have a foreskin, you should just wash the outside like normal skin and leave it alone.","shower routine · nobody ever gave instructions","DEPENDS",
 "<strong>Depends on whether it rolls back easily yet.</strong><br><br>1. <strong>If it does NOT retract easily yet:</strong> Leave it alone. The foreskin is attached at birth and separates gradually on its own schedule (often taking until mid-teens). Forcing it causes micro-tears and scar tissue.<br><br>2. <strong>Once it DOES slide back easily:</strong> You <strong>must</strong> gently roll it back in the shower, rinse underneath with warm water, and <strong>always slide it forward again</strong>.<br><br>Skin cells and natural oils collect under the hood (<strong>smegma</strong>). If you don't rinse it, it turns pasty, smells bad, and creates <span class=\"hl\">the single most mortifying moment of your life</span> if someone gets close to you. A five-second warm water rinse in the shower is all it takes — no harsh scented body wash that burns, just rinse it clean.<br><br><em>Axe Body Spray:</em> appeal to potential romantic partners is inversely proportional to amount sprayed. Use with caution. Wanting to smell good is understandable &mdash; but spray doesn&rsquo;t substitute for a shower. Actual water does the work.<br><br><em>Bonus fact for the room:</em> People with vulvas have a clitoral hood that can collect smegma too — exact same tissue blueprint, exact same fix: gentle warm water rinse between the folds."],

["The parts of female anatomy you can see from the outside are the vagina.","every movie, show, and casual conversation ever","FALSE",
 "You <strong>cannot see the vagina from the outside</strong>. Everything visible on the outside — the outer and inner lips, the clitoris, the openings — is 100% the <strong>vulva</strong>. The vagina is strictly the internal muscular canal leading to the cervix.<br><br>Using &ldquo;vagina&rdquo; for the whole area is like pointing at your nose, lips, and cheeks and calling them &ldquo;my throat.&rdquo; English got lazy, and calling the outside by the inside name is why people end up trying to wash parts that clean themselves. Outside parts get washed; <strong>inside parts clean themselves</strong>."],

["Sudden, severe pain in a testicle is something you tough out and see if it settles.","a tough-it-out household","FALSE",
 "A testicle can twist and cut off its own blood supply — <strong>testicular torsion</strong>. Sudden, severe pain, often with swelling or feeling sick. <span class=\"hl\">It is a clock: hours, not days.</span> Quick surgery fixes it; toughing it out is how people lose a testicle. Sudden severe pain means the emergency department, now — no version of embarrassment beats that math."],

["A person can pee with a tampon in because urine exits from a completely separate opening.","science class · half the room didn't believe it","TRUE",
 "<strong>True — three completely separate openings.</strong> Females have the urethra (where urine exits, at the front), the vagina (where menstrual blood exits and tampons go, in the middle), and the anus (at the back). Urine does not touch a tampon, and a tampon does not block the bladder. You never need to take it out to pee. A massive number of guys (and plenty of girls) assume there is only one exit for everything — <span class=\"hl\">the plumbing is completely separate</span>."],

["Period pain bad enough to make you miss school is just something you push through.","half the comments under a cramps video","FALSE",
 "Cramps are common. <strong>Pain that stops you attending school or doing your normal day — especially when pain meds and a heat pack don't touch it — is a reason to get checked, not a thing to push through.</strong> Treatable causes exist, and &ldquo;just live with it&rdquo; is how people lose years to them. Pain that rewrites your week gets described to a doctor."],

["Small bumps around the head of the penis mean you caught an infection.","a 2 a.m. search · scary image results","DEPENDS",
 "<strong>Depends which bumps.</strong> Tiny shiny dots around the rim (pearly papules) and small yellowish dots (Fordyce spots) are <strong>normal anatomy</strong> — common, not an infection, nothing to treat. Worth a clinic visit: anything <em>new</em>, painful, open, oozing, or arriving with flu-like symptoms. <span class=\"hl\">The clinic has seen every version of this question and will not be shocked.</span>"],

["As long as it isn't leaking, a tampon is fine to leave in all day.","a life-hack Instagram account","FALSE",
 "A tampon has a clock on it: <strong>4 to 8 hours, then out</strong> — leaking is not the signal, the clock is. Left longer, the risk of <strong>toxic shock syndrome</strong> climbs: rare, but serious — sudden fever, rash, dizziness. Sleeping more than 8 hours? <span class=\"hl\">Pad that night.</span>"],

["It's completely normal for one testicle to hang lower than the other.","someone who checked in a mirror and panicked","TRUE",
 "<strong>True — and almost always the left one sits lower.</strong> Pairs in the body are not matched; hands, feet, nothing is symmetrical. What matters is <strong>change</strong>: a new lump, a swelling that stays, a heavy ache that does not leave — those get checked."],

["Soaking through a pad or tampon every hour for several hours is still a normal period.","a group chat · 2 a.m.","FALSE",
 "<strong>Soaking through a pad or tampon every hour for 2+ hours in a row is a flag, not a feature.</strong> Same for a period lasting more than about 8 days, or clots bigger than a loonie. These can point to things like low iron or clotting problems — <span class=\"hl\">treatable things</span> — and they are worth saying out loud to a doctor instead of absorbing quietly."],

["If one breast is bigger than the other, that's worth getting checked.","asked once · quietly","DEPENDS",
 "<strong>Depends on the story.</strong> Some size difference is <strong>completely normal</strong> — most people have it, and sides grow at different speeds. Worth checking: a <em>new</em> lump that stays, a growing difference, a change in shape or skin, or discharge. <strong>Normal range is huge; change is the thing to watch.</strong>"],

["Wet dreams are a normal part of puberty and mean nothing is wrong.","a kid who heard it from another kid","TRUE",
 "<strong>True — normal plumbing, zero shame.</strong> During sleep, blood flow naturally increases to the pelvic area and the body can release fluid or experience an orgasm during dreams. Two things nobody mentions:<br><br>1. <strong>People with vulvas get them too:</strong> Nocturnal orgasms and increased lubrication during sleep happen across all bodies during REM sleep — it is not just a guy thing.<br><br>2. <strong>Zero is completely normal:</strong> Movies make it sound like a mandatory puberty milestone. A huge percentage of people — guys and girls — <strong>never have a single wet dream in their entire lives</strong>. Having them often, having them once, or having them zero times are all 100% healthy. <span class=\"hl\">It is an automatic sleep reflex, not a report card.</span>"],

["A period that skips a month or shows up at odd times means something's wrong.","someone's mom said one thing · the internet said another","DEPENDS",
 "<strong>Depends how new this is.</strong> In the first couple of years, cycles anywhere from 21 to 45 days apart — and skips — can be completely normal. Worth checking: no period by 16, a sudden stop of 3+ months, very heavy or painful periods, or pregnancy is possible. <span class=\"hl\">New system = wobbly. Settled system that changed = look into it.</span>"],

["Vulvas come in a huge range of shapes, sizes and colours — every one of them is normal.","a comment section · argued about for hours","TRUE",
 "<strong>True — like fingerprints or faces.</strong> No two on Earth are identical. Colour, size, symmetry, inner lips (labia minora) extending longer or hanging past the outer lips, ruffled edges, darker pigmentation — every single variation is standard human biology.<br><br><em>The porn illusion:</em> Why do so many people stress about this? Commercial adult media almost exclusively selects and edits for a hyper-narrow, &ldquo;tucked-in&rdquo; look that represents only a tiny fraction of real bodies. It has caused millions of girls to look in a mirror and mistakenly believe their completely healthy anatomy is a defect.<br><br><em>The reality for the room:</em> Real human bodies do not look like plastic toys. Having inner lips that extend past the outer lips is just as common as having them tucked in. <span class=\"hl\">Variation is not a flaw — it is the universal human design.</span> Nobody is grading symmetry."],

["If the foreskin gets stuck behind the head and starts to swell, it's safe to wait a couple of days.","someone too embarrassed to ask a real adult","FALSE",
 "A foreskin that slides back but <strong>gets stuck behind the head and swells</strong> (paraphimosis) is genuinely time-sensitive: <span class=\"hl\">same-day care, urgently</span>. It does not settle on its own, and waiting makes the swelling worse. It is a quick fix for a doctor — and a bad weekend if ignored."],

["Someone having a period can just hold the flow in until they get to a bathroom, like peeing.","a guy who was very confused during science class","FALSE",
 "Peeing is controlled by voluntary sphincter muscles you can consciously clench and hold. The uterus and vaginal canal have <strong>zero voluntary valves</strong>. Menstrual fluid leaves the uterus through muscle contractions and gravity. Nobody can &ldquo;hold it in&rdquo; — when it flows, it flows. If someone leaks onto clothes, it is not &ldquo;being careless&rdquo; — <span class=\"hl\">it is anatomy that cannot be steered with willpower</span>."],

["The clitoris and the penis are built from the exact same biological tissue blueprint.","embryology facts · sounds made up at first","TRUE",
 "<strong>True — they are anatomical twins.</strong> Before birth, all bodies start with the same genital tissue blueprint. The clitoris and the penis develop from the exact same parts: the head (glans), the hood/foreskin, and internal erectile tissue. The clitoris is the <strong>only human organ dedicated solely to sensory pleasure</strong> — what shows outside is just the tip, with extensive internal erectile wings that wrap around the vaginal canal."],

["During puberty, erections can show up at random times for no reason at all.","everyone in grade 9 · quietly worried","TRUE",
 "<strong>True — blood-flow reflex, no agenda.</strong> In puberty, the nervous system fires at everything: friction from jeans, a full bladder pushing on nerves, body temperature, or nothing at all. An erection in class does <strong>not</strong> mean someone was thinking about sex or looking at anyone.<br><br><em>The mental pop-ups:</em> Surging hormones in a developing brain also trigger <strong>random, intrusive sexual thoughts</strong> out of nowhere — for all genders. A thought popping into your head is just a pop-up ad from a puberty brain. It doesn't mean you planned it, and it does not define who you are.<br><br><em>The rule for being a human in 2026:</em> If someone walks past, your eyes might flick over for half a second — millions of years of evolution fired an optical reflex before you even realized it. But <span class=\"hl\">the glance is biology; the stare is a choice.</span> Being a respectful, non-creepy person means overriding the impulse: you don't stare, you don't gawk, and you don't make anyone uncomfortable. <strong>Character is what you do in second two.</strong>"],

["Every female body has a solid skin seal over the vagina that breaks and bleeds the first time they have sex.","playground folklore · passed around for generations","FALSE",
 "The hymen is not a solid &ldquo;freshness seal&rdquo; — if it were, menstrual blood could never leave the body! It is a stretchy collar or fringe of tissue around the opening. It stretches naturally, can wear from sports or tampon use, or be barely present. Bleeding during first intercourse is usually caused by <strong>nervousness, lack of arousal, and lack of lubrication causing friction tears</strong> — <span class=\"hl\">not a broken lock</span>."],

["An adult erect penis has to be at least 6 inches long to be considered normal size.","locker room bragging · internet comments","FALSE",
 "<strong>False — by a long shot.</strong> The healthy biological range for adult erect size is a wide bell curve from <strong>about 4 to 6 inches (10 to 15 cm)</strong>, with the middle sitting around 5.1 to 5.5 inches. Fewer than 15% of people on Earth are over 6 inches.<br><br><em>The Bell Curve:</em> Normal is a wide spectrum, not a pass/fail test. Half of humanity sits below the statistical midpoint, and every point along that curve is completely healthy, functional, and standard.<br><br><em>Why does culture lie about this?</em><br>1. <strong>Porn is fantasy casting:</strong> It hires the top 0.5% statistical outliers and shoots with wide-angle lenses. Comparing real bodies to adult media is like assuming the average person is 6'9\" because you watched the NBA.<br>2. <strong>Locker room inflation:</strong> Nobody brags about reality; people add two inches online and in hallways.<br><br><em>Real intimacy in 2026 (for all partners):</em> In real-world relationships — regardless of who you love or what kind of sex people have — great intimacy comes from <strong>communication, patience, touch, and checking in with your partner</strong>, not an arbitrary measurement. Every body type along the entire curve works great when partners take their time, communicate, and pay attention to each other.<br><br>Culture created an impossible numbers game that makes real people worry for no reason, when actual bodies across the whole spectrum are built to connect just fine."]

];
const CLS = {"FALSE":"v-no","TRUE":"v-yes","DEPENDS":"v-dep"};

const stage = document.getElementById('stage');
let slides = [];

DECK.forEach(function(d, i) {
  var claim = d[0], attrib = d[1], verdict = d[2], why = d[3];
  var n = String(i + 1).padStart(2, '0');

  var s1 = document.createElement('div');
  s1.className = 'slide';
  s1.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="claim">&ldquo;' + claim + '&rdquo;</div>' +
    '<div class="claim-src">' + attrib + '</div>' +
    '<div class="prompt"><div class="prompt-h">Vote with your partner — one tick</div>' +
    '<div class="vote-chips"><span class="vote-chip">TRUE</span><span class="vote-chip">FALSE</span><span class="vote-chip">IT DEPENDS</span></div></div>';
  stage.appendChild(s1);
  slides.push(s1);

  var s2 = document.createElement('div');
  s2.className = 'slide';
  s2.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="verdict-head"><div class="verdict-badge ' + CLS[verdict] + '">' + verdict + '</div>' +
    '<div class="verdict-claim">&ldquo;' + claim + '&rdquo;</div></div>' +
    '<div class="rule"></div>' +
    '<div class="why">' + why + '</div>';
  stage.appendChild(s2);
  slides.push(s2);
});

document.getElementById('tot').textContent = slides.length;
let cur = -1;

function show(i) {
  if (i < 0 || i >= slides.length) return;
  if (cur >= 0) slides[cur].classList.remove('active');
  cur = i;
  slides[cur].classList.add('active');
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('bar').style.width = ((cur + 1) / slides.length * 100) + '%';
  document.getElementById('prev').disabled = (cur === 0);
  document.getElementById('next').disabled = (cur === slides.length - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function step(d) { show(cur + d); }
function jump(i) { show(i); }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
});

show(0);
</script>
