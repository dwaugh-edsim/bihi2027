<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL9 O2-A: Nobody Told Me: Reveal Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Slab:wght@700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --text-main:#0f172a; --text-muted:#475569; --bg:#e2e8f0;
        --accent:#2563eb; --amber:#b45309; --red:#b91c1c; --green:#15803d;
        --line:#cbd5e1;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text-main); background:var(--bg); line-height:1.45; }

    .top-toolbar { position:sticky; top:0; z-index:50; background:#0f172a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .tb-title { font-family:'Roboto Slab',serif; font-weight:800; font-size:1rem; }
    .tb-btn { background:#1e293b; color:#fff; border:1px solid #334155; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:.82rem; font-weight:600; }
    .tb-btn:hover { background:#334155; }
    .tb-count { font-family:'JetBrains Mono',monospace; font-size:.8rem; color:#94a3b8; margin-left:auto; }

    .progress-container { height:4px; background:#1e293b; }
    .progress-bar-wrap { height:100%; }
    .progress-bar-fill { height:100%; background:var(--accent); width:0; transition:width .18s ease; }

    .stage { max-width:1280px; margin:26px auto 30px auto; padding:0 20px; }
    .slide { background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 22px rgba(15,23,42,.10); padding:56px 56px 48px 56px; display:none; }
    .slide.active { display:block; }

    .slide-num { font-family:'JetBrains Mono',monospace; font-size:.82rem; font-weight:800; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase; margin-bottom:20px; }

    .claim { font-family:'Roboto Slab',serif; font-size:2.9rem; font-weight:800; line-height:1.22; }
    .claim-src { font-size:.9rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin-top:18px; }
    .claim-src::before { content: "Source: "; font-weight: 700; color: #64748b; }

    .prompt { margin-top:40px; border:2px dashed var(--line); border-radius:10px; padding:20px 24px; background:#f8fafc; }
    .prompt-h { font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .vote-chips { display:flex; gap:14px; flex-wrap:wrap; }
    .vote-chip { font-family:'JetBrains Mono',monospace; font-weight:800; font-size:1.3rem; padding:12px 30px; border:2px solid var(--text-main); border-radius:8px; background:#fff; }

    .verdict-head { display:flex; align-items:center; gap:22px; margin-bottom:28px; flex-wrap:wrap; }
    .verdict-badge { font-family:'Roboto Slab',serif; font-size:2.5rem; font-weight:900; padding:10px 30px; border-radius:10px; color:#fff; }
    .v-no { background:var(--red); }
    .v-yes { background:var(--green); }
    .v-dep { background:var(--amber); }
    .verdict-claim { font-family:'Roboto Slab',serif; font-size:1.6rem; font-weight:700; line-height:1.32; flex:1; min-width:300px; }

    .why-label { font-size:.74rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .why-list { font-size:1.72rem; line-height:1.5; }
    .why-list li { list-style:none; margin-bottom:1.05rem; padding-left:2.1rem; position:relative; }
    .why-list li::before { content:"▸"; position:absolute; left:0; color:var(--accent); font-weight:900; }
    .why-list li:last-child { margin-bottom:0; }
    .hl { background:#fef3c7; padding:0 4px; border-radius:3px; font-weight:700; }
    .rule { height:1px; background:var(--line); margin-top:26px; }

    .nav-foot { max-width:1280px; margin:0 auto 40px auto; padding:0 20px; display:flex; justify-content:space-between; gap:14px; }
    .nav-btn { background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:11px 22px; cursor:pointer; font-weight:700; font-size:.9rem; color:var(--text-main); }
    .nav-btn:hover:not(:disabled) { background:#f1f5f9; border-color:var(--text-main); }
    .nav-btn:disabled { opacity:.4; cursor:default; }

    @media print {
        @page { size:landscape; margin:10mm; }
        body { background:#fff; }
        .top-toolbar, .progress-container, .nav-foot, .no-print { display:none !important; }
        .stage { margin:0; padding:0; max-width:100%; }
        .slide { display:block !important; box-shadow:none; border:1px solid #cbd5e1; border-radius:0; padding:13mm; page-break-after:always; break-after:page; margin:0 0 6mm 0; }
        .slide:last-child { page-break-after:auto; break-after:auto; }
        .claim { font-size:2.15rem; }
        .why-list { font-size:1.12rem; }
        .why-list li { margin-bottom:.45rem; padding-left:1.4rem; }
    }
</style>
</head>
<body>

<div class="top-toolbar no-print">
  <div class="tb-title">Nobody Told Me: Reveal</div>
  <button class="tb-btn" onclick="window.print()">Print all 40</button>
  <button class="tb-btn" onclick="jump(0)">Start</button>
  <div class="tb-count"><span id="cur">1</span> / <span id="tot">40</span> &nbsp;·&nbsp; arrow keys</div>
</div>
<div class="progress-container no-print"><div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar"></div></div></div>

<div class="stage" id="stage"></div>

<div class="nav-foot no-print">
  <button class="nav-btn" id="prev" onclick="step(-1)">&larr; Previous</button>
  <button class="nav-btn" id="next" onclick="step(1)">Next &rarr;</button>
</div>
<script>
// [claim, attribution, verdict, why-bullets]
// Student-facing only. Teacher scripts and notes live in the facilitation guide.
const DECK = [

["Clear or whitish fluid in underwear is normally just the body washing itself clean.", "overheard in a change room · argued about for days", "TRUE", ["The vagina washes itself out continuously, the same way eyes wash themselves with tears.", "Discharge changes texture and amount across the month. That is normal biology.", "The only thing to check is <strong>a change from your normal</strong>: strong foul smell, grey or greenish colour, clumpy texture, itching or burning.", "<span class=\"hl\">That list is what a clinic visit is for.</span> The everyday fluid is just the system keeping itself healthy."]],

["If you have a foreskin, you should just wash the outside like normal skin and leave it alone.", "shower routine · nobody ever gave instructions", "DEPENDS", ["<strong>Depends on one thing: does it roll back easily yet?</strong>", "<strong>Not yet:</strong> leave it alone. It separates on its own schedule, often until the mid-teens. Forcing it causes micro-tears and scar tissue.", "<strong>Slides easily:</strong> gently roll it back in the shower, rinse under it with warm water, and always slide it forward again.", "Skin cells and oils collect under the hood (smegma). Unrinsed, it turns pasty and smells.", "<span class=\"hl\">A five-second warm water rinse is all it takes.</span> No burning body wash needed.", "<strong>The Axe rule:</strong> appeal drops as the spray count rises. Spray does not substitute for a shower. Actual water does the work.", "Bonus: vulvas have a clitoral hood that collects smegma too. Same blueprint, same rinse."]],

["The parts of female anatomy you can see from the outside are the vagina.", "every casual conversation ever", "FALSE", ["You <strong>cannot see the vagina from the outside</strong>.", "Everything visible (outer lips, inner lips, clitoris, openings) is 100% the <strong>vulva</strong>.", "The vagina is the internal muscular canal. That is the inside part.", "Calling it all &ldquo;vagina&rdquo; is like pointing at your nose, lips and cheeks and saying &ldquo;my throat.&rdquo;", "Outside parts get washed. <span class=\"hl\">Inside parts clean themselves.</span>"]],

["Sudden, severe pain in a testicle is something you tough out and see if it settles.", "a tough-it-out household", "FALSE", ["A testicle can twist and cut off its own blood supply. That is <strong>testicular torsion</strong>.", "Sudden, severe pain, often with swelling or feeling sick.", "<span class=\"hl\">It is a clock: hours, not days.</span>", "Quick surgery fixes it. Toughing it out is how people lose one.", "Sudden severe pain means the emergency department, now."]],

["A person can pee with a tampon in because urine exits from a completely separate opening.", "science class · half the room didn't believe it", "TRUE", ["<strong>True: three completely separate openings.</strong>", "Urethra at the front (urine). Vagina in the middle (period blood, tampons). Anus at the back.", "Urine does not touch the tampon. The tampon does not block the bladder. You never take it out to pee.", "<span class=\"hl\">The plumbing is completely separate.</span>"]],

["Period pain bad enough to make you miss school is just something you push through.", "half the comments under a cramps video", "FALSE", ["Cramps are common. Pain that stops your normal day is not &ldquo;just part of it.&rdquo;", "<strong>Pain that stops school, especially when meds and a heat pack don't touch it, gets checked.</strong>", "Treatable causes exist. &ldquo;Just live with it&rdquo; is how people lose years to them.", "Pain that rewrites your week gets described to a doctor."]],

["Small bumps around the head of the penis mean you caught an infection.", "a 2 a.m. search · scary image results", "DEPENDS", ["<strong>Depends which bumps.</strong>", "Pearly papules (tiny shiny dots on the rim) and Fordyce spots (small yellowish dots) are <strong>normal anatomy</strong>. Common, not an infection, nothing to treat.", "Worth a clinic visit: anything <em>new</em>, painful, open, oozing, or arriving with flu-like symptoms.", "<span class=\"hl\">The clinic has heard every version of this question and will not be shocked.</span>"]],

["As long as it isn't leaking, a tampon is fine to leave in all day.", "a life-hack Instagram account", "FALSE", ["A tampon has a clock on it: <strong>4 to 8 hours, then out</strong>.", "Leaking is not the signal. The clock is the signal.", "Left longer, toxic shock risk climbs: rare, but serious. Sudden fever, rash, dizziness.", "Sleeping more than 8 hours? <span class=\"hl\">Pad that night.</span>"]],

["It's completely normal for one testicle to hang lower than the other.", "someone who checked in a mirror and panicked", "TRUE", ["<strong>True, and almost always the left one sits lower.</strong>", "Pairs in the body are not matched. Hands, feet, nothing is symmetrical.", "What matters is <strong>change</strong>: a new lump, a swelling that stays, a heavy ache that does not leave. Those get checked."]],

["Soaking through a pad or tampon every hour for several hours is still a normal period.", "a group chat · 2 a.m.", "FALSE", ["<strong>Soaking through hourly for 2+ hours in a row is a flag, not a feature.</strong>", "Also flags: a period lasting more than about 8 days, or clots bigger than a loonie.", "These can point to low iron or clotting problems: <span class=\"hl\">treatable things</span>.", "Worth saying out loud to a doctor instead of absorbing quietly."]],

["If one breast is bigger than the other, that's worth getting checked.", "asked once · quietly", "FALSE", ["<strong>FALSE, with an asterisk.</strong>", "One bigger than the other is <strong>just anatomy</strong>. Most people have it; sides grow at different speeds. Nobody gets checked for ordinary asymmetry.", "<span class=\"hl\">The asterisk:</span> the real flags are different things entirely. A <em>new</em> lump that stays. A growing difference. A change in shape or skin. Discharge.", "<strong>A lump is not the same thing as asymmetry, and a lump absolutely gets flagged.</strong>", "Normal range is huge. Change is the thing to watch."]],

["Wet dreams are a normal part of puberty and mean nothing is wrong.", "a kid who heard it from another kid", "TRUE", ["<strong>True: normal plumbing, zero shame.</strong> It happens automatically during sleep.", "<strong>People with vulvas get them too.</strong> Nocturnal orgasms and sleep lubrication happen across all bodies in REM sleep. Not just a guy thing.", "<strong>Zero is completely normal.</strong> A huge percentage of people never have a single one in their lives.", "Often, once, or never: all 100% healthy.", "<span class=\"hl\">It is an automatic sleep reflex, not a report card.</span>"]],

["A period that skips a month or shows up at odd times means something's wrong.", "someone's mom said one thing · the internet said another", "DEPENDS", ["<strong>Depends how new this is.</strong>", "First couple of years: cycles anywhere from 21 to 45 days apart, and skips, can be completely normal.", "Worth checking: no period by 16, a sudden stop of 3+ months, very heavy or painful periods, or pregnancy is possible.", "<span class=\"hl\">New system = wobbly. Settled system that changed = look into it.</span>"]],

["Vulvas come in a huge range of shapes, sizes and colours, and every one of them is normal.", "a comment section · argued about for hours", "TRUE", ["<strong>True, like fingerprints or faces.</strong> No two on Earth are identical.", "Colour, size, symmetry, ruffled edges, darker pigmentation, inner lips longer or shorter: all standard human biology.", "<strong>The porn illusion:</strong> adult media selects and edits for one hyper-narrow &ldquo;tucked-in&rdquo; look that represents a tiny fraction of real bodies.", "Millions of girls have been taught their healthy anatomy is a defect. It is not."]],

["If the foreskin gets stuck behind the head and starts to swell, it's safe to wait a couple of days.", "someone too embarrassed to ask a real adult", "FALSE", ["Foreskin slides back, then <strong>gets stuck behind the head and swells</strong>. That is paraphimosis.", "<span class=\"hl\">Same-day care, urgently.</span>", "It does not settle on its own. Waiting makes the swelling worse.", "A quick fix for a doctor. A bad weekend if ignored."]],

["Someone having a period can just hold the flow in until they get to a bathroom, like peeing.", "a guy who was very confused during science class", "FALSE", ["Peeing uses voluntary muscles you can consciously clench and hold.", "The uterus has <strong>zero voluntary valves</strong>. Fluid leaves through contractions and gravity.", "Nobody can hold it in. When it flows, it flows.", "Leaking onto clothes is not carelessness. <span class=\"hl\">It is anatomy that cannot be steered with willpower.</span>"]],

["The clitoris and the penis are built from the exact same biological tissue blueprint.", "embryology facts · sounds made up at first", "TRUE", ["<strong>True: they are anatomical twins.</strong>", "Before birth, all bodies start from the same genital tissue blueprint: head (glans), hood/foreskin, internal erectile tissue.", "The clitoris is the <strong>only human organ dedicated solely to sensory pleasure</strong>.", "What shows outside is just the tip. Internal erectile wings wrap around the vaginal canal."]],

["During puberty, erections can show up at random times for no reason at all.", "everyone in grade 9 · quietly worried", "TRUE", ["<strong>True: a blood-flow reflex with no agenda.</strong>", "Triggers in puberty: friction from jeans, a full bladder, body temperature, or nothing at all.", "An erection in class does <strong>not</strong> mean someone was thinking about sex or looking at anyone.", "Random intrusive thoughts happen too, all genders. A pop-up ad from a puberty brain: you did not plan it, and it does not define you.", "<span class=\"hl\">The glance is biology; the stare is a choice.</span> Don't stare, don't gawk, don't make anyone uncomfortable.", "<strong>Character is what you do in second two.</strong>"]],

["Every female body has a solid skin seal over the vagina that breaks and bleeds the first time they have sex.", "playground folklore · passed around for generations", "FALSE", ["The hymen is not a solid &ldquo;freshness seal.&rdquo; If it were, menstrual blood could never leave the body.", "It is a stretchy collar of tissue around the opening. It stretches naturally, wears from sports or tampons, or is barely present.", "First-time bleeding usually comes from nervousness, low arousal, and friction.", "<span class=\"hl\">Not a broken lock.</span>"]],

["An adult erect penis has to be at least 6 inches long to be considered normal size.", "locker room bragging · internet comments", "FALSE", ["<strong>False, by a long shot.</strong>", "The healthy range is a wide bell curve: about 4 to 6 inches (10 to 15 cm), midpoint around 5.1 to 5.5. Fewer than 15% are over 6 inches.", "<strong>Porn is fantasy casting:</strong> it hires the top 0.5% and shoots wide-angle. Judging real bodies by it is like assuming everyone is 6'9\" because you watched the NBA.", "<strong>Locker rooms add two inches.</strong> Nobody brags about reality.", "Real intimacy runs on <strong>communication, patience, touch, and checking in with your partner</strong>, not a measurement.", "<span class=\"hl\">Every body on the whole curve works fine. Culture built an impossible numbers game.</span>"]]

];
const CLS = {"FALSE":"v-no","TRUE":"v-yes","DEPENDS":"v-dep"};

const stage = document.getElementById('stage');
let slides = [];

DECK.forEach(function(d, i) {
  var claim = d[0], attrib = d[1], verdict = d[2], why = d[3];
  var n = String(i + 1).padStart(2, '0');

  var s1 = document.createElement('div');
  s1.className = 'slide';
  s1.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="claim">&ldquo;' + claim + '&rdquo;</div>' +
    '<div class="claim-src">' + attrib + '</div>' +
    '<div class="prompt"><div class="prompt-h">Vote with your partner: one tick</div>' +
    '<div class="vote-chips"><span class="vote-chip">TRUE</span><span class="vote-chip">FALSE</span><span class="vote-chip">IT DEPENDS</span></div></div>';
  stage.appendChild(s1);
  slides.push(s1);

  var s2 = document.createElement('div');
  s2.className = 'slide';
  s2.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="verdict-head"><div class="verdict-badge ' + CLS[verdict] + '">' + verdict + '</div>' +
    '<div class="verdict-claim">&ldquo;' + claim + '&rdquo;</div></div>' +
    '<div class="rule"></div>' +
    '<ul class="why-list">' + why.map(function(b) { return '<li>' + b + '</li>'; }).join('') + '</ul>';
  stage.appendChild(s2);
  slides.push(s2);
});

document.getElementById('tot').textContent = slides.length;
let cur = -1;

function show(i) {
  if (i < 0 || i >= slides.length) return;
  if (cur >= 0) slides[cur].classList.remove('active');
  cur = i;
  slides[cur].classList.add('active');
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('bar').style.width = ((cur + 1) / slides.length * 100) + '%';
  document.getElementById('prev').disabled = (cur === 0);
  document.getElementById('next').disabled = (cur === slides.length - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function step(d) { show(cur + d); }
function jump(i) { show(i); }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
});

show(0);
</script>

</body>
</html>
