<script>
  // ================= ASSIGNMENT CONFIG =================
  const ASSIGNMENT = {
    taskName: 'HL9 Operation Addictive by Design (Class 2)',
    course: 'HL9',
    title: 'Operation: Addictive by Design — The Dark UX Challenge',
    kicker: 'HL9 · UNIT 1 · JUNCTION · CLASS 2',
    badge: 'HL9 • CLASS 2 • 30 MARKS',
    classList: ['902-HL', '901-HL', '903-HL'],
    introHtml:
      '<p><b>Your role:</b> Behavioural Design Consultant. <b>Your mission:</b> take a boring app and make it ' +
      'irresistible — then ethically dissect exactly how you did it.</p>' +
      '<p><b>Marking:</b> Application of Engagement Tactics <b>/12</b> · Creativity &amp; Design Execution <b>/10</b> · ' +
      'Critical Reflection <b>/8</b>. Step 4 (the reflection) is mandatory.</p>' +
      '<div class="r8-brief"><h3>📖 THE BRIEFING — The 4 Addiction Engines &amp; Counter-Measures</h3>' +
      '<p>Software companies don\'t keep you engaged by accident. They bolt four specific behavioural engines into the interface:</p>' +
      '<h3>1 · 🎰 Variable Rewards (The Slot Machine Effect)</h3><p>Unpredictable payoffs keep the brain guessing and pulling. 9 boring clips, 1 gold hit. Dopamine dumps in anticipation of the surprise.</p>' +
      '<h3>2 · ♾️ Friction Killers (Destroying Stopping Cues)</h3><p>Infinite scroll, autoplay, zero effort. Removes the natural pause signal so your prefrontal cortex never gets a chance to stop.</p>' +
      '<h3>3 · 👥 Social Validation &amp; FOMO</h3><p>Streaks, read receipts, likes, friend rank alerts: turns human relationships into metric scores and triggers the fear of missing out.</p>' +
      '<h3>4 · 🔴 Dark Patterns &amp; Strategic Notifications</h3><p>Red badges (emergency danger colors in nature), phantom notifications, artificial countdown timers, and guilt-trip copy.</p>' +
      '<h3>5 · 🛡️ Reclaiming Control (Wellness Mode)</h3><p>Grayscale, hidden folders, batched notifications, hard stop timers — putting friction and human agency back.</p>' +
      '<div class="matrix-box"><b>📋 Requirement matrix:</b> Your overhauled app must bolt on at least one feature from <b>each</b> of the 4 engines below (Sections 2A, 2B, 2C, and 2D).</div></div>',
    sections: [
      { num: 1, title: 'Choose Your "Boring" App Victim', hint: 'The harder the app is to make addictive, the better the design.', fields: [
        { id: 's1_base', type: 'select', label: 'Which boring app are you rebuilding?', options: [
          'Puddle Watch — tracks rain puddles in Dartmouth',
          'FlashCard Hero — digital index cards for French vocabulary',
          'Chore Tracker — check off dishwasher and laundry',
          'Water Reminder — alerts you when to drink a glass',
          'Dentist Brush Timer — plain 2-minute countdown',
          'Locker Combo Diary — stores hallway locker combos & notes',
          'Bus Schedule Checker — static Halifax Transit timetable',
          'Basic Calculator — plain math equations with no frills',
          'My Own Invention — described below' ] },
        { id: 's1_name', type: 'text', label: 'Your app\'s official name (keep it, or rebrand it):' },
        { id: 's1_baseline', type: 'textarea', label: 'What does the app do RIGHT NOW (before your dark makeover)?', rows: 3 },
      ] },
      { num: '2A', title: 'Addiction Engine 1 — Reward System 🎰', hint: 'Variable rewards & dopamine.', fields: [
        { type: 'static', html:
          '<div class="r8-guide engine-1">' +
          '<div class="guide-title">🎰 Slide Deck Guide: The Slot Machine Effect (Variable Rewards)</div>' +
          '<p><b>The Core Mechanic:</b> You swipe down or pull to refresh. Will you get a boring post or a viral video? Because you don\'t know, your brain dumps <b>dopamine</b> in anticipation of the surprise.</p>' +
          '<p><b>The Science:</b> 9 boring clips, 1 gold hit. Your brain gambles on the next swipe — the same unpredictable schedule casinos use for slot machines. Unpredictability keeps the thumb pulling.</p>' +
          '<span class="glossary-hdr">💡 What each reward trick means:</span>' +
          '<div class="glossary-grid">' +
            '<div class="glossary-item"><b>🎰 Variable Rewards (Slot Machine)</b>Unpredictable payoffs: sometimes nothing, sometimes a jackpot, keeping the user pulling "just one more time".</div>' +
            '<div class="glossary-item"><b>📦 Mystery Drop</b>Random surprise gifts, items, or perks awarded to users at unannounced, unpredictable times.</div>' +
            '<div class="glossary-item"><b>🎁 Loot Box</b>A virtual chest or crate opened without knowing what is inside until celebratory animations reveal it.</div>' +
            '<div class="glossary-item"><b>🎲 Random Points</b>Completing an action awards an unpredictable score (e.g. 5 to 500 points) instead of a fixed, expected amount.</div>' +
            '<div class="glossary-item"><b>🔓 Surprise Unlock</b>Reaching hidden milestones or secret thresholds suddenly unlocks an unexpected badge, feature, or skin.</div>' +
            '<div class="glossary-item"><b>🎡 Daily Bonus Roulette</b>A prize wheel spun once every 24 hours — giving variable daily gifts to force users to open the app every day.</div>' +
          '</div></div>'
        },
        { id: 's2a_tricks', type: 'checks', label: 'Tricks used:', options: ['Variable Rewards (Slot Machine)','Mystery Drop','Loot Box','Random Points','Surprise Unlock','Daily Bonus Roulette'] },
        { id: 's2a_feature', type: 'text', label: 'Feature name:' },
        { id: 's2a_design', type: 'textarea', label: 'How does it work on screen? (What does the user see, tap, and feel?)', rows: 3 },
      ] },
      { num: '2B', title: 'Addiction Engine 2 — Friction Reduction ♾️', hint: 'Eliminate every stopping cue.', fields: [
        { type: 'static', html:
          '<div class="r8-guide engine-2">' +
          '<div class="guide-title">♾️ Slide Deck Guide: Eliminating Stopping Cues (Friction Killers)</div>' +
          '<p><b>The Core Mechanic:</b> Books have chapter ends; TV shows had commercials. Apps use <em>infinite scroll</em> and <em>autoplay</em> so your prefrontal cortex never gets a signal to stop.</p>' +
          '<p><b>The Science:</b> Invented by Aza Raskin in 2006 (who later called it <em>"behavioural cocaine"</em>). When scrolling is the zero-effort default, stopping requires active willpower from your <b>prefrontal cortex</b> — which is still developing in teenagers. One lazy thumb flick, zero friction.</p>' +
          '<span class="glossary-hdr">💡 What each friction-reduction trick means:</span>' +
          '<div class="glossary-grid">' +
            '<div class="glossary-item"><b>📜 Infinite Scroll</b>Content loads seamlessly before reaching the bottom — completely deleting page numbers and natural break points.</div>' +
            '<div class="glossary-item"><b>▶️ Autoplay Next</b>The next video or action automatically starts in 3–5 seconds unless the user actively moves to cancel it.</div>' +
            '<div class="glossary-item"><b>⚡ Auto-Advancing Tasks</b>Completing one task instantly checks it off and pushes the next challenge onto the screen without asking.</div>' +
            '<div class="glossary-item"><b>🚀 Instant Loading</b>Zero lag, skeleton screens, and cached feeds so the user never experiences a moment of waiting or reflection.</div>' +
            '<div class="glossary-item"><b>👆 One-Tap Repeat</b>Re-doing an action (scrolling, re-rolling, buying, sharing) takes only 1 tap with zero confirmation dialogs.</div>' +
            '<div class="glossary-item"><b>🚫 No Natural End Point</b>Removing chapters, finished states, or "You\'re all caught up" messages so the app experience is technically infinite.</div>' +
          '</div></div>'
        },
        { id: 's2b_tricks', type: 'checks', label: 'Tricks used:', options: ['Infinite Scroll','Autoplay Next','Auto-Advancing Tasks','Instant Loading','One-Tap Repeat','No Natural End Point'] },
        { id: 's2b_feature', type: 'text', label: 'Feature name:' },
        { id: 's2b_design', type: 'textarea', label: 'How does it work on screen?', rows: 3 },
      ] },
      { num: '2C', title: 'Addiction Engine 3 — Social Pressure 👥', hint: 'FOMO is the engine.', fields: [
        { type: 'static', html:
          '<div class="r8-guide engine-3">' +
          '<div class="guide-title">👥 Slide Deck Guide: Social Validation &amp; FOMO (Monetizing Friendship)</div>' +
          '<p><b>The Core Mechanic:</b> Snapchat Streaks, Read Receipts, and Likes turn human relationships into numbers. Breaking a streak feels like failing a friend, dragging you back daily out of social obligation.</p>' +
          '<p><b>The Science:</b> Humans are hardwired by evolution to care about social standing. Likes, shares, and views act as social currency — triggering a quick validation boost or a micro-burst of anxiety and FOMO if a post underperforms.</p>' +
          '<span class="glossary-hdr">💡 What each social pressure trick means:</span>' +
          '<div class="glossary-grid">' +
            '<div class="glossary-item"><b>🔥 Streaks</b>Consecutive daily usage counters that reset to zero if missed, exploiting loss aversion and friendship guilt.</div>' +
            '<div class="glossary-item"><b>🏆 Public Leaderboard</b>Visible scoreboards ranking users against classmates or friends to fuel status competition.</div>' +
            '<div class="glossary-item"><b>👍 Likes / Upvotes</b>Quantified social approval metrics displayed publicly as proof of popularity and social acceptance.</div>' +
            '<div class="glossary-item"><b>👀 Read Receipts</b>Showing timestamps when a friend opened a message, creating intense psychological pressure to reply immediately.</div>' +
            '<div class="glossary-item"><b>👥 Friend Comparison</b>Alerts showing when peers pass you or do better (e.g., <em>"Alex just passed your score!"</em>).</div>' +
            '<div class="glossary-item"><b>⚠️ Rank Loss Alerts</b>Urgent warnings alerting users that their status or streak is about to drop (e.g., <em>"You\'re about to lose Diamond Tier!"</em>).</div>' +
          '</div></div>'
        },
        { id: 's2c_tricks', type: 'checks', label: 'Tricks used:', options: ['Streaks','Public Leaderboard','Likes / Upvotes','Read Receipts','Friend Comparison','Rank Loss Alerts'] },
        { id: 's2c_feature', type: 'text', label: 'Feature name:' },
        { id: 's2c_design', type: 'textarea', label: 'How does it work on screen?', rows: 3 },
      ] },
      { num: '2D', title: 'Addiction Engine 4 — Visual & Notification Hacks 🔴', hint: 'The attention hijacks.', fields: [
        { type: 'static', html:
          '<div class="r8-guide engine-4">' +
          '<div class="guide-title">🔴 Slide Deck Guide: Dark Patterns &amp; Strategic Notifications (Visual Urgency)</div>' +
          '<p><b>The Core Mechanic:</b> Red notification badges mimic emergency danger signals in nature. Phantom alerts buzz your pocket when you haven\'t opened the app in 12 hours (<em>"Check out what [Friend] posted 3 days ago"</em>).</p>' +
          '<p><b>The Science:</b> Sneaky user-interface tricks designed to rush, manipulate, or guilt-trip you into opening and staying. Loss-aversion alerts (<em>"You\'re about to lose your spot!"</em>), artificial countdown timers, and bright flashing animations.</p>' +
          '<span class="glossary-hdr">💡 What each visual / notification hack means:</span>' +
          '<div class="glossary-grid">' +
            '<div class="glossary-item"><b>🔴 Red Notification Badges</b>Bright red circular bubbles that trigger evolutionary emergency alarms in the brain, demanding to be cleared.</div>' +
            '<div class="glossary-item"><b>👻 Phantom Notifications</b>Push alerts sent with false urgency purely because you haven\'t opened the app today (<em>"See what happened 3 days ago!"</em>).</div>' +
            '<div class="glossary-item"><b>⏰ Loss-Aversion Alert</b>Notifications framing inactivity as a loss (e.g., <em>"Your daily bonus expires in 12 minutes — don\'t lose it!"</em>).</div>' +
            '<div class="glossary-item"><b>✨ Flashing Animations</b>Particle bursts, confetti explosions, and screen shakes that overstimulate sensory receptors and create false hype.</div>' +
            '<div class="glossary-item"><b>⏳ Urgency Countdown</b>Ticking countdown timers that force rushed, impulsive choices before the prefrontal cortex can critically think.</div>' +
            '<div class="glossary-item"><b>🥺 Guilt-Trip Messaging</b>Copy designed to make users feel guilty for closing or ignoring the app (e.g., crying mascots, <em>"Did we do something wrong?"</em>).</div>' +
          '</div></div>'
        },
        { id: 's2d_tricks', type: 'checks', label: 'Tricks used:', options: ['Red Notification Badges','Phantom Notifications','Loss-Aversion Alert','Flashing Animations','Urgency Countdown','Guilt-Trip Messaging'] },
        { id: 's2d_feature', type: 'text', label: 'Feature name:' },
        { id: 's2d_design', type: 'textarea', label: 'How does it work on screen?', rows: 3 },
      ] },
      { num: 3, title: 'The Investor Pitch', hint: 'Sell it like you mean it.', fields: [
        { id: 's3_format', type: 'select', label: 'Pitch format:', options: ['Option A — Visual Pitch Deck (3–5 slides)','Option B — App Walkthrough Video (~2 min)','Option C — Interactive Wireframe'] },
        { id: 's3_link', type: 'text', label: 'Share link (Google Slides / Canva / Figma / Drive video):' },
        { id: 's3_pitch', type: 'textarea', label: 'Your 60-second elevator pitch to the investors:', rows: 4 },
        { id: 's3_weapon', type: 'text', label: 'Your secret weapon — the ONE feature that makes your app unstoppable:' },
