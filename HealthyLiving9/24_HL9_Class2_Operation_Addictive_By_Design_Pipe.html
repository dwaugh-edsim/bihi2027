<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HL9 · Operation: Addictive by Design</title>
<meta name="description" content="HL9 Room 8 — Operation: Addictive by Design. Take a boring app and reverse-engineer dark UX and dopamine loops.">

<!-- Inline SVG Favicon (prevents 404 console errors on GitHub Pages) -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">

<!-- Modern Typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&family=Open+Sans+Condensed:wght@700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --text-main: #0f172a;
    --text-muted: #475569;
    --brand-primary: #7c3aed;
    --brand-hover: #6d28d9;
    --accent-blue: #2563eb;
    --bg-page: #f8fafc;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --border-accent: #ddd6fe;
  }

  body {
    font-family: 'Source Sans Pro', system-ui, -apple-system, sans-serif;
    background: var(--bg-page);
    color: var(--text-main);
    margin: 0;
    padding: 0;
    line-height: 1.55;
  }

  #r8 {
    max-width: 960px;
    margin: 0 auto;
    padding: 24px 20px 80px 20px;
  }

  /* Kicker & Typography */
  .r8-kicker {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--brand-primary);
    margin-bottom: 4px;
  }
  h1 {
    font-family: 'Open Sans Condensed', sans-serif;
    font-size: 1.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #1e293b;
    margin: 0 0 6px 0;
    line-height: 1.2;
  }
  .r8-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 700;
    background: #1e293b;
    color: #ffffff;
    display: inline-block;
    padding: 3px 10px;
    border-radius: 4px;
    margin-bottom: 12px;
  }
  .r8-who {
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 10px;
    margin: 12px 0 16px 0;
    color: var(--text-muted);
    font-size: 0.94rem;
  }
  .r8-who b { color: var(--text-main); }

  .r8-intro {
    background: #faf5ff;
    border: 1px solid var(--border-accent);
    border-left: 4px solid var(--brand-primary);
    border-radius: 6px;
    padding: 14px 18px;
    margin: 14px 0 24px 0;
    font-size: 0.96rem;
  }
  .r8-intro p { margin: 0 0 8px 0; }
  .r8-intro p:last-child { margin-bottom: 0; }

  /* Sections */
  h2 {
    font-family: 'Open Sans Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    font-size: 1.35rem;
    letter-spacing: 0.04em;
    color: #1e293b;
    border-bottom: solid 1px var(--border-color);
    padding-bottom: 6px;
    margin: 34px 0 10px 0;
  }
  .r8-num {
    font-family: 'Open Sans Condensed', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    background: var(--brand-primary);
    color: #ffffff;
    padding: 2px 9px;
    border-radius: 4px;
    margin-right: 8px;
  }
  .r8-hint { color: #64748b; font-size: 0.88rem; margin: 0 0 8px 0; }
  .r8-label {
    display: block;
    font-family: 'Open Sans Condensed', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: #1e293b;
    margin: 16px 0 5px 0;
  }
  .r8-label .r8-hint { font-family: 'Source Sans Pro', sans-serif; font-weight: 400; font-size: 0.85rem; color: #64748b; }

  /* Form Controls */
  textarea, input[type=text], input[type=number], select {
    font-family: 'Source Sans Pro', sans-serif;
    font-size: 0.95rem;
    width: 100%;
    padding: 9px 12px;
    border: solid 1px #cbd5e1;
    border-radius: 5px;
    background: #ffffff;
    color: var(--text-main);
    box-sizing: border-box;
    transition: border-color .2s, box-shadow .2s;
  }
  input[type=number] { max-width: 240px; }
  textarea { resize: vertical; line-height: 1.5; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--brand-primary);
    box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.18);
    outline: none;
    background: #ffffff;
  }

  /* Chips & Radios */
  .r8-checks, .r8-radios { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
  .r8-chip {
    border: 1px solid #cbd5e1;
    border-radius: 999px;
    padding: 5px 14px;
    font-size: 0.88rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #ffffff;
    transition: all .15s ease;
  }
  .r8-chip input { margin: 0; }
  .r8-chip:hover { background: #f5f3ff; border-color: var(--border-accent); }
  .r8-chip:has(input:checked) { background: #1e293b; color: #ffffff; border-color: #1e293b; }

  /* Restore banner */
  .r8-restored { display: none; margin: 12px 0; padding: 9px 12px; border: 1px solid #bbf7d0; background: #f0fdf4;
                 border-radius: 6px; font-size: .88rem; }

  /* Bottom Actions Bar */
  .r8-bar {
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border-color);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  button {
    font-family: 'Open Sans Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 0.96rem;
    padding: 9px 22px;
    border-radius: 5px;
    border: none;
    background: var(--brand-primary);
    color: #ffffff;
    cursor: pointer;
    transition: background-color .2s;
  }
  button:hover { background-color: var(--brand-hover); }
  button.mini { padding: 4px 10px; font-size: 0.8rem; background: var(--accent-blue); }
  button.mini:hover { background: #1d4ed8; }

  /* Status line */
  .r8-status { color: #475569; font-weight: 600; }
  .r8-status.ok   { color: #15803d; }
  .r8-status.bad  { color: #b91c1c; }
  .r8-status.warn { color: #b45309; }

  /* Static content wrapper */
  .r8-static { margin: 6px 0; }

  /* Gate (sign-in) box */
  .r8-gate {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-top: 4px solid var(--brand-primary);
    border-radius: 8px;
    padding: 32px 28px;
    margin-top: 40px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
  }
  .r8-gate h1 { font-size: 1.7rem; margin-bottom: 8px; }
  .r8-gate .r8-sub { color: var(--text-muted); font-size: 1.05rem; margin-bottom: 20px; }

  /* Briefing card */
  .r8-brief {
    border: 1px solid var(--border-accent);
    border-left: 4px solid var(--brand-primary);
    border-radius: 8px;
    padding: 12px 16px;
    margin: 12px 0;
    font-size: .92rem;
    background: #faf5ff;
  }
  .r8-brief h3 { margin: 10px 0 2px; font-size: .98rem; color: #4c1d95; }
  .r8-brief h3:first-child { margin-top: 0; }
  .r8-brief p { margin: 0 0 6px; color: #334155; }
</style>
</head>
