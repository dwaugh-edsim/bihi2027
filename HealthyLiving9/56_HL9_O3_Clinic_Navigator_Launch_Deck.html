<style>

    .top-toolbar { position:sticky; top:0; z-index:50; background:#0f172a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }

    .pill-row { display:flex; gap:14px; flex-wrap:wrap; margin-top:36px; }
    .word-card { flex:1; min-width:220px; border:2px solid var(--line); border-radius:10px; padding:22px 24px; }
    .word-card .w { font-family:'Roboto Slab',serif; font-size:1.9rem; font-weight:900; }
    .word-card .d { font-size:1.15rem; color:var(--text-muted); margin-top:8px; font-weight:600; }

    .step-row:last-child { border-bottom:none; }

    .step-v { font-family:'Roboto Slab',serif; font-size:1.8rem; font-weight:800; }
    .step-d { font-size:1.05rem; color:var(--text-muted); font-weight:600; margin-left:auto; text-align:right; max-width:520px; }

    .nav-foot { max-width:1280px; margin:0 auto 40px auto; padding:0 20px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .nav-btn { background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:11px 22px; cursor:pointer; font-weight:700; font-size:.9rem; color:var(--text-main); }
    .nav-btn:hover:not(:disabled) { background:#f1f5f9; border-color:var(--text-main); }
    .nav-btn:disabled { opacity:.4; cursor:default; }
    .nav-outcome { font-size:.82rem; color:var(--text-muted); font-weight:600; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); padding:6px 14px; border-radius:6px; }
    .nav-outcome-tag { font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:800; background:#f1f5f9; color:var(--accent); border:1px solid #bfdbfe; padding:2px 6px; border-radius:3px; }

    .course-pill { font-family:'JetBrains Mono',monospace; font-size:.85rem; font-weight:800; background:#eff6ff; color:var(--accent); border:1.5px solid #bfdbfe; padding:4px 12px; border-radius:6px; letter-spacing:.08em; text-transform:uppercase; display:inline-block; margin-bottom:26px; }

    .flow-card { border:2px solid var(--line); border-radius:10px; padding:18px 20px; }
    .flow-card .k { font-family:'JetBrains Mono',monospace; font-size:.7rem; font-weight:800; color:var(--accent); letter-spacing:.08em; text-transform:uppercase; }
    .flow-card .t { font-family:'Roboto Slab',serif; font-size:1.35rem; font-weight:800; margin:6px 0 6px 0; }
    .flow-card .d { font-size:.95rem; color:var(--text-muted); font-weight:600; }
    .flow-artifact { margin-top:22px; border:2px dashed var(--amber); border-radius:10px; padding:14px 18px; font-size:1rem; font-weight:700; background:#fffbeb; }

    @media print { .top-toolbar,.nav-foot,.progress-container { display:none; } .slide { display:block !important; page-break-after:always; box-shadow:none; min-height:auto; } }

<script>
var DECK = [
  // 1 TITLE
  '<div class="slide"><div class="course-pill">HL9 &middot; O3 Health Literacy</div>' +
  '<div class="big">Clinic<br>Navigator</div>' +
  '<div class="big-sub">Know where to go. Know what it costs. Know what stays private.</div>' +
  '<div class="outcome-box"><div class="outcome-tag">Outcome 3 &middot; Health Literacy / Navigating the System</div>' +
  '<div class="outcome-text">&ldquo;Learners will investigate ways to access health resources that support health and well-being.&rdquo;</div></div></div>',

  // 2 INDICATORS
  '<div class="slide"><div class="slide-num">Slide 2 &middot; What you will be able to do</div>' +
  '<div class="big" style="font-size:2.6rem;">By the end of this unit, you can&hellip;</div>' +
  '<div class="steps">' +
  '<div class="step-row"><div class="step-k">01</div><div class="step-v">Read a label</div><div class="step-d">Medicine, food, supplement ads, and app privacy policies - what they really say.</div></div>' +
  '<div class="step-row"><div class="step-k">02</div><div class="step-v">Pick the right door</div><div class="step-d">811, walk-in, pharmacist, school counsellor, Youth Health Centre, ER - which one, when, and why.</div></div>' +
  '<div class="step-row"><div class="step-k">03</div><div class="step-v">Walk through the door</div><div class="step-d">What happens at a first visit, what it costs, what is confidential in Nova Scotia.</div></div>' +
  '<div class="step-row"><div class="step-k">04</div><div class="step-v">Build the map</div><div class="step-d">Your NS Resource Map: 6+ real resources, checked for reliability - due Class 13 (6%).</div></div>' +
  '</div></div>',

  // 3 ROADMAP
  '<div class="slide"><div class="slide-num">Slide 3 &middot; The road (Classes 9-13)</div>' +
  '<div class="steps">' +
  '<div class="step-row"><div class="step-k">C9</div><div class="step-v">Can You Read the Label?</div><div class="step-d">Label Reader station cards + response sheet.</div></div>' +
  '<div class="step-row"><div class="step-k">C10</div><div class="step-v">Where Do I Go?</div><div class="step-d">Scenario sorter: match 8 situations to the right service + justify. Confidentiality limits.</div></div>' +
  '<div class="step-row"><div class="step-k">C11</div><div class="step-v">Through the Door</div><div class="step-d">Intake-form walkthrough. Start your NS Resource Map draft.</div></div>' +
  '<div class="step-row"><div class="step-k">C12</div><div class="step-v">Work + Check-ins</div><div class="step-d">Project work session with teacher conferences.</div></div>' +
  '<div class="step-row"><div class="step-k">C13</div><div class="step-v">Peer Review + Due</div><div class="step-d">Glow / grow / question swap. <b>Summative 3 - 6%.</b></div></div>' +
  '</div></div>',

  // CLASS 9 FLOW
  '<div class="slide" data-min="20"><div class="slide-num">Class 9 &middot; What you will DO today</div>' +
  '<div class="big" style="font-size:2.4rem;">Label Reader: judge 8 real-world labels</div>' +
  '<div class="flow-grid">' +
  '<div class="flow-card"><div class="k">0-5 min &middot; Do now</div><div class="t">One label, 4 questions</div><div class="d">Read Exhibit 1 cold. Who made it? What does it say? What&rsquo;s missing? What do you do with it?</div></div>' +
  '<div class="flow-card"><div class="k">5-15 min &middot; Mini-lesson</div><div class="t">The 4-question check</div><div class="d">Slides 9 &amp; 13: health literacy = find / understand / use. Red flags: no author, &ldquo;doctors hate this&rdquo;, discount codes, no Health Canada product number (NPN or DIN).</div></div>' +
  '<div class="flow-card"><div class="k">15-35 min &middot; Activity (timer)</div><div class="t">Station rotation in pairs</div><div class="d">8 exhibit cards posted around the room (file 57). ~2 min per card. Record on the response sheet (file 58): what it says &middot; red flags &middot; verdict R / M / C.</div></div>' +
  '<div class="flow-card"><div class="k">35-50 min &middot; Exit ticket</div><div class="t">Finish + hand in</div><div class="d">One sentence: what makes a source reliable + one red flag. Collected (formative).</div></div>' +
  '</div>' +
  '<div class="flow-artifact">&#9998; ARTIFACT THAT LEAVES THE ROOM: completed Label Reader Response Sheet (file 58) - formative.</div></div>',
  // CLASS 10 FLOW
  '<div class="slide" data-min="25"><div class="slide-num">Class 10 &middot; What you will DO today</div>' +
  '<div class="big" style="font-size:2.4rem;">Where Do I Go? Sort 8 situations to the right service</div>' +
  '<div class="flow-grid">' +
  '<div class="flow-card"><div class="k">0-5 min &middot; Do now</div><div class="t">The service map</div><div class="d">Slide 10: 811 &middot; walk-in &middot; pharmacist &middot; school counsellor &middot; Youth Health Centre &middot; 911/ER &middot; 988/KHP &middot; 211. Which would you call at 1 a.m.?</div></div>' +
  '<div class="flow-card"><div class="k">5-10 min &middot; Demo</div><div class="t">One card, together</div><div class="d">Teacher sorts Scenario 2 aloud: red flags &rarr; 911/ER beats everything.</div></div>' +
  '<div class="flow-card"><div class="k">10-35 min &middot; Activity (timer)</div><div class="t">Pairs sort all 8 cards</div><div class="d">Cards posted (file 59). Sorter sheet side A (file 60): service + one-line reason using a fact from the card. More than one answer can be defensible - the reason is marked.</div></div>' +
  '<div class="flow-card"><div class="k">35-50 min &middot; Confidentiality</div><div class="t">Side B, then debrief</div><div class="d">Mature minor, safety limits, &ldquo;is this confidential?&rdquo; script. Debrief with key. Early finishers: Clinic Navigator sim (file 62).</div></div>' +
  '</div>' +
  '<div class="flow-artifact">&#9998; ARTIFACT: Sorter Sheet (file 60) - formative. Sim score stays on screen.</div></div>',
  // CLASS 11 FLOW
  '<div class="slide" data-min="20"><div class="slide-num">Class 11 &middot; What you will DO today</div>' +
  '<div class="big" style="font-size:2.4rem;">Through the Door: first visit + start your map</div>' +
  '<div class="flow-grid">' +
  '<div class="flow-card"><div class="k">0-8 min &middot; Do now</div><div class="t">The ER wait reality</div><div class="d">Exhibit 66: Dartmouth General 3h15m-5h45m vs Valley Regional (Kentville) 15m-2h15m. Stable problem? The drive can win. Emergencies? Nearest ER. Discuss the scenario on the sheet.</div></div>' +
  '<div class="flow-card"><div class="k">8-20 min &middot; Walkthrough</div><div class="t">A first visit, step by step</div><div class="d">File 61 side A: 7 steps + the sample intake form. Costs &amp; &ldquo;isn&rsquo;t it free?&rdquo; (MSI = your health card; it covers medically necessary care. Dental, drugs, and forms often cost extra). Advocacy scripts.</div></div>' +
  '<div class="flow-card"><div class="k">20-40 min &middot; Activity (timer)</div><div class="t">Clinic Navigator sim</div><div class="d">File 62 on Chromebooks, solo or pairs: 8 cases, pick the door + defend it. Score /16 on screen. US trip case at the end (Boston ear infection).</div></div>' +
  '<div class="flow-card"><div class="k">40-50 min &middot; Start the map</div><div class="t">2 rows minimum</div><div class="d">Open the project (file 63), draft rows 1-2 of your NS Resource Map. Links page (65) is your starting point.</div></div>' +
  '</div>' +
  '<div class="flow-artifact">&#9998; ARTIFACT: map draft rows 1-2 (file 63) + sim score. Extension reads: 67 (US), 68 (debate).</div></div>',
  // CLASS 12 FLOW
  '<div class="slide" data-min="40"><div class="slide-num">Class 12 &middot; What you will DO today</div>' +
  '<div class="big" style="font-size:2.4rem;">Work session: build your NS Resource Map</div>' +
  '<div class="flow-grid">' +
  '<div class="flow-card"><div class="k">0-5 min &middot; Do now</div><div class="t">Rubric up</div><div class="d">File 63: coverage, accurate access details, reliability check, confidentiality notes, First-3-Steps card.</div></div>' +
  '<div class="flow-card"><div class="k">5-45 min &middot; Activity (timer)</div><div class="t">Draft + teacher conferences</div><div class="d">Fill the 6-field table. Every phone number/link gets opened and verified live (file 65). Teacher conferences with the self-checklist.</div></div>' +
  '<div class="flow-card"><div class="k">45-50 min &middot; Extension</div><div class="t">Read + note</div><div class="d">Exhibit 67 (US costs/travel insurance) or 68 (public vs private debate brief) - one claim + one question each.</div></div>' +
  '<div class="flow-card"><div class="k">50-55 min &middot; Exit</div><div class="t">One question</div><div class="d">Write one question you still have about getting care in NS - anonymous box or to teacher.</div></div>' +
  '</div>' +
  '<div class="flow-artifact">&#9998; ARTIFACT: draft map + conference notes (checked against checklist).</div></div>',
  // CLASS 13 FLOW
  '<div class="slide" data-min="20"><div class="slide-num">Class 13 &middot; What you will DO today</div>' +
  '<div class="big" style="font-size:2.4rem;">Peer review, revise, submit (Summative 3 &middot; 6%)</div>' +
  '<div class="flow-grid">' +
  '<div class="flow-card"><div class="k">0-5 min &middot; Model</div><div class="t">Glow / grow / question</div><div class="d">Teacher models one of each on a sample map. Specific &gt; nice.</div></div>' +
  '<div class="flow-card"><div class="k">5-25 min &middot; Activity (timer)</div><div class="t">Swap + review</div><div class="d">File 64: swap drafts with a partner, check the 5 criteria, write one glow, one grow, one question.</div></div>' +
  '<div class="flow-card"><div class="k">25-40 min &middot; Revise</div><div class="t">Fix what the feedback found</div><div class="d">Re-verify any link the reviewer flagged. Complete the self-checklist on file 63.</div></div>' +
  '<div class="flow-card"><div class="k">40-55 min &middot; Submit + wrap</div><div class="t">Hand in</div><div class="d">Submit the map in Google Classroom (or print). Wrap: what&rsquo;s next - communication skills + the spring unit.</div></div>' +
  '</div>' +
  '<div class="flow-artifact">&#9998; ARTIFACT: final NS Resource Map (file 63) - Summative 3, 6%.</div></div>',
  // 4 HEALTH LITERACY
  '<div class="slide"><div class="slide-num">Slide 4 &middot; Health literacy = 3 skills</div>' +
  '<div class="pill-row">' +
  '<div class="word-card wc-blue"><div class="w">FIND</div><div class="d">Locate accurate information and real services.</div><div class="x">Where do I even start?</div></div>' +
  '<div class="word-card wc-amber"><div class="w">UNDERSTAND</div><div class="d">Judge whether what you found is reliable or a sales pitch.</div><div class="x">Is this source trustworthy?</div></div>' +
  '<div class="word-card wc-green"><div class="w">USE</div><div class="d">Actually get care: book, call, ask, advocate for yourself.</div><div class="x">What do I do next?</div></div>' +
  '</div>' +
  '<div class="body-lg"><p>Health literacy is not about memorizing facts. It is about knowing <b>where the reliable doors are</b> - and being able to walk through one.</p></div></div>',

  // 5 SERVICE MAP
  '<div class="slide"><div class="slide-num">Slide 5 &middot; The service map (Nova Scotia)</div>' +
  '<div class="tech-grid">' +
  '<div class="tech-card"><div class="n">24/7 &middot; FREE</div><div class="t">811</div><div class="x">Call 811. A registered nurse answers. Health advice any hour. TTY 7-1-1.</div></div>' +
  '<div class="tech-card"><div class="n">IN PERSON</div><div class="t">Walk-in / Youth Health Centre</div><div class="x">Walk-in clinics (find via yourhealthns.ca) and school Youth Health Centres - confidential for youth.</div></div>' +
  '<div class="tech-card"><div class="n">NO APPOINTMENT</div><div class="t">Pharmacist</div><div class="x">NS pharmacists can assess and prescribe for common conditions (UTI, cold sores, pink eye&hellip;).</div></div>' +
  '<div class="tech-card"><div class="n">SCHOOL</div><div class="t">Counsellor</div><div class="x">School counsellors are a first door for mental health and school stress - with confidentiality limits.</div></div>' +
  '<div class="tech-card"><div class="n">EMERGENCY</div><div class="t">911 / ER</div><div class="x">Severe or life-threatening: chest pain, trouble breathing, severe bleeding, head injury, overdose. Not sure it's an emergency? Check <b>ER wait times online first</b> (yourhealthns.ca) and call 811.</div></div>' +
  '<div class="tech-card"><div class="n">ANYTIME &middot; TEXT</div><div class="t">988 / KHP / 211</div><div class="x">988 call/text (crisis) &middot; Kids Help Phone 1-800-668-6868 or text CONNECT to 686868 &middot; 211 dial/text (community supports).</div></div>' +
  '</div></div>',

  // 5b ER WAITS REALITY
  '<div class="slide"><div class="slide-num">Slide 5b &middot; ER waits: the drive can be worth it</div>' +
  '<div class="body-lg"><p>Predicted ER waits, NS snapshot 2026-11-24: <b>Dartmouth General 3h 15m-5h 45m</b> &middot; <b>QEII Halifax Infirmary 3h-5h 15m</b> - normal for Halifax/Dartmouth. Within about an hour: <b>Valley Regional (Kentville) 15m-2h 15m</b> &middot; <b>St. Mary&rsquo;s (Sherbrooke) 15m-30m</b>.</p>' +
  '<p>Same province, same night. For a <b>stable</b> problem, the shorter total wait can win. Emergencies still go to the <b>nearest</b> ER / 911. Check live first: yourhealthns.ca &rarr; ED wait times, and the <b>hours</b> column - &ldquo;limited hours&rdquo; means it may be closed.</p></div>' +
  '<div class="outcome-box"><div class="outcome-tag">Full table</div><div class="outcome-text">Printable exhibit: <b>66_HL9_O3_ER_Wait_Times_Reality_Check.html</b> - full provincial snapshot + class discussion scenario.</div></div></div>',

  // 6 CONFIDENTIALITY
  '<div class="slide"><div class="slide-num">Slide 6 &middot; What stays private?</div>' +
  '<div class="body-lg">' +
  '<p><b>In Nova Scotia, youth can consent to their own health care</b> when a provider agrees they understand the decision (the &ldquo;mature minor&rdquo; principle). Youth Health Centres and 811 are confidential.</p>' +
  '<p><b>Limits exist:</b> if you are at risk of serious harm, or someone is hurting you, professionals may need to share information to keep you safe. School counsellors keep things private within those same safety limits.</p>' +
  '<p><b>Ask out loud:</b> &ldquo;Is this confidential? What are the limits?&rdquo; A good provider will answer directly.</p>' +
  '</div></div>',

  // 7 LABEL CHECK
  '<div class="slide"><div class="slide-num">Slide 7 &middot; The 4-question label check</div>' +
  '<div class="steps">' +
  '<div class="step-row"><div class="step-k">Q1</div><div class="step-v">Who made this?</div><div class="step-d">Government (.ca), CPS, IWK, registered pharmacist - or an influencer selling something?</div></div>' +
  '<div class="step-row"><div class="step-k">Q2</div><div class="step-v">What does it actually say?</div><div class="step-d">Dose, serving size, active ingredient, NPN/DIN. Read the numbers, not the slogan.</div></div>' +
  '<div class="step-row"><div class="step-k">Q3</div><div class="step-v">What is missing?</div><div class="step-d">No sources, no date, &ldquo;cures&rdquo;, &ldquo;doctors hate this&rdquo;, 300% claims = red flags.</div></div>' +
  '<div class="step-row"><div class="step-k">Q4</div><div class="step-v">What do I do with it?</div><div class="step-d">Verify with 811, a pharmacist, or a .ca health source before acting on it.</div></div>' +
  '</div></div>',

  // 8 PROJECT
  '<div class="slide"><div class="slide-num">Slide 8 &middot; Summative 3: your NS Resource Map</div>' +
  '<div class="body-lg">' +
  '<p>Build a <b>resource map a Grade 9 student in Dartmouth could actually use</b>: at least <b>6 real Nova Scotia resources</b> covering phone/text lines, online confidential info, in-person care, pharmacist services, community supports, and mental-health-specific help.</p>' +
  '<p>For each resource: what it is for, how to reach it, hours, cost, what is confidential, and <b>your reliability check</b> (who runs it, when it was updated).</p>' +
  '<p><b>Due Class 13 &middot; 6%.</b> Full brief, organizer, rubric, and checklist: the project page linked on the course hub.</p>' +
  '</div></div>',

  // 9b US BORDER
  '<div class="slide"><div class="slide-num">Slide 9b &middot; Crossing the border: the US system</div>' +
  '<div class="body-lg"><p><b>Your NS health card is meaningless in the US.</b> Provincial plans cover little or none of medical costs abroad and never pay up front (travel.gc.ca). <b>Buy travel medical insurance before you go.</b></p>' +
  '<p>US plans: <b>HMO</b> (cheaper, in-network only, referrals needed) vs <b>PPO</b> (more choice, coinsurance). ER care without insurance: roughly <b>$1,500-$3,000+</b> per visit; ambulance <b>$1,000+</b>; a hospital day <b>$2,000-$5,000+</b>. EMTALA means an ER must stabilize you anyway - then bills you.</p>' +
  '<p>The trade-off: insured Americans often get specialists/surgery <b>faster</b> than Canadians on our lists - but ~26M Americans are uninsured, medical debt is a leading cause of US bankruptcy, and US ERs have waits too.</p></div>' +
  '<div class="outcome-box"><div class="outcome-tag">Exhibit</div><div class="outcome-text">Printable: <b>67_HL9_O3_US_Border_Health_Care_Exhibit.html</b> - costs, insurance checklist, scenarios.</div></div></div>',

  // 9c PUBLIC VS PRIVATE DEBATE
  '<div class="slide"><div class="slide-num">Slide 9c &middot; The Canadian debate: public vs private pay</div>' +
  '<div class="body-lg"><p>The Canada Health Act (1984) says medically necessary doctor/hospital care is <b>universal and free at the point of care</b> - no extra-billing. But dental, drugs, physio, and paid virtual care are <b>already private-pay</b>.</p>' +
  '<p>Debate question: <b>should Canadians be able to buy faster private care?</b> For: choice, speed, capacity, keeps care in Canada. Against: access by wallet not need, siphons staff from public lists, US-style debt (slide 15). Courts: Chaoulli (SCC 2005, QC) opened the door; Cambie (BC 2022) kept the ban.</p></div>' +
  '<div class="outcome-box"><div class="outcome-tag">Debate brief</div><div class="outcome-text">Printable pros/cons + worksheet: <b>68_HL9_O3_Public_vs_Private_Debate_Brief.html</b>. Rule: public facts and fictional examples only - no personal health stories.</div></div></div>',

  // 17 WORD BANK
  '<div class="slide"><div class="slide-num">Slide 17 &middot; Word bank</div>' +
  '<div class="wb-grid">' +
  '<div class="step-row"><div class="step-k">HL</div><div class="step-v" style="font-size:1.3rem;">Health literacy</div><div class="step-d">Finding, understanding, and using health information and services.</div></div>' +
  '<div class="step-row"><div class="step-k">YHC</div><div class="step-v" style="font-size:1.3rem;">Youth Health Centre</div><div class="step-d">Confidential school- or community-based health clinic for youth.</div></div>' +
  '<div class="step-row"><div class="step-k">MM</div><div class="step-v" style="font-size:1.3rem;">Mature minor</div><div class="step-d">A youth judged able to consent to their own health care in NS.</div></div>' +
  '<div class="step-row"><div class="step-k">NPN</div><div class="step-v" style="font-size:1.3rem;">Natural product number</div><div class="step-d">Health Canada ID on natural health products (NPN) and medicines (DIN) - its presence means it was reviewed.</div></div>' +
  '<div class="step-row"><div class="step-k">MSI</div><div class="step-v" style="font-size:1.3rem;">Nova Scotia MSI</div><div class="step-d">Provincial health insurance; medically necessary doctor/hospital care is covered with a health card.</div></div>' +
  '<div class="step-row"><div class="step-k">Triage</div><div class="step-v" style="font-size:1.3rem;">Triage</div><div class="step-d">Deciding how urgent something is and which service matches it.</div></div>' +
  '<div class="step-row"><div class="step-k">GP</div><div class="step-v" style="font-size:1.3rem;">GP / family doctor</div><div class="step-d">General practitioner - your own doctor. No GP? Join the Need a Family Practice Registry (call 811 or needafamilypractice.nshealth.ca).</div></div>' +
  '<div class="step-row"><div class="step-k">Ref</div><div class="step-v" style="font-size:1.3rem;">Referral</div><div class="step-d">When one provider sends you to a specialist. Ask about the wait - waittimes.novascotia.ca lists specialist waits.</div></div>' +
  '<div class="step-row"><div class="step-k">HMO</div><div class="step-v" style="font-size:1.3rem;">HMO vs PPO</div><div class="step-d">US plan types: HMO = cheaper, in-network only, referral needed. PPO = more choice, higher cost. (healthcare.gov)</div></div>' +
  '<div class="step-row"><div class="step-k">TMI</div><div class="step-v" style="font-size:1.3rem;">Travel medical insurance</div><div class="step-d">Insurance that pays for medical care outside Canada. Check limit ($1M+), evacuation/repatriation, pre-existing conditions, and who pays up front (usually you, then claim).</div></div>' +
  '<div class="step-row"><div class="step-k">CHA</div><div class="step-v" style="font-size:1.3rem;">Two-tier / CHA</div><div class="step-d">Canada Health Act: universal, no extra-billing for medically necessary care. &ldquo;Two-tier&rdquo; = access decided by ability to pay, not need.</div></div>' +
  '</div></div>'
];

var deck = document.getElementById('deck');
DECK.forEach(function(html, i) {
  var d = document.createElement('div');
  d.innerHTML = html;
  var s = d.firstElementChild;
  s.classList.add('slide');
  if (i === 0) s.classList.add('active');
  deck.appendChild(s);
});
var slides = deck.querySelectorAll('.slide');
var idx = 0;
var count = document.getElementById('count');
var prog = document.getElementById('prog');
var timerInt = null;
function stopTimer() { if (timerInt) { clearInterval(timerInt); timerInt = null; } var tc = document.getElementById('timerChip'); tc.classList.remove('on'); tc.textContent=''; }
function startTimer(min) {
  stopTimer();
  var tc = document.getElementById('timerChip');
  tc.classList.add('on');
  var end = Date.now() + min * 60000;
  function tick() {
    var left = Math.max(0, end - Date.now());
    var m = Math.floor(left / 60000), sec = Math.floor((left % 60000) / 1000);
    tc.textContent = 'ACTIVITY ' + m + ':' + (sec < 10 ? '0' : '') + sec;
    if (left <= 0) stopTimer();
  }
  tick();
  timerInt = setInterval(tick, 1000);
}
function show(n) {
  idx = Math.max(0, Math.min(slides.length - 1, n));
  var sl = slides[idx];
  if (sl && sl.dataset.min) startTimer(parseInt(sl.dataset.min, 10)); else stopTimer();
  slides.forEach(function(s, i) { s.classList.toggle('active', i === idx); });
  count.textContent = (idx + 1) + ' / ' + slides.length;
  prog.style.width = ((idx + 1) / slides.length * 100) + '%';
  document.getElementById('prev').disabled = idx === 0;
  document.getElementById('next').disabled = idx === slides.length - 1;
}
document.getElementById('prev').onclick = function() { show(idx - 1); };
document.getElementById('next').onclick = function() { show(idx + 1); };
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ') show(idx + 1);
  if (e.key === 'ArrowLeft') show(idx - 1);
});
show(0);
</script>
