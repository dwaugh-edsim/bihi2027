  }

  #r8 {
    max-width: 960px;
    margin: 20px auto;
    background: #ffffff;
    border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.07), 0 1px 4px rgba(0, 0, 0, 0.04);
    border-bottom: 3px solid #cbd5e1;
    padding: 30px 36px 40px 36px;
  }

  .r8-top-bar {
    position: sticky;
    top: 8px;
    z-index: 1000;
    background: #0f172a;
    color: #ffffff;
    border-bottom: 3px solid var(--accent-blue);
    padding: 10px 16px;
    border-radius: 6px;
    margin: -16px -20px 22px -20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    font-size: 0.9rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);

    color: #38bdf8;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-weight: 700;
  }
  .r8-top-bar button.mini-top {
    font-size: 0.8rem;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: 700;
    text-transform: uppercase;
    font-family: 'Open Sans Condensed', sans-serif;
    letter-spacing: 0.05em;
  }

  .r8-top-bar button.mini-signout:hover { background: #475569; }

  /* Typography */
  .r8-kicker {
    font-family: 'Open Sans Condensed', sans-serif;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--accent-blue);
    font-size: 0.95rem;
    margin-bottom: 4px;

    font-family: 'Source Sans Pro', sans-serif;

    font-size: 2.05rem;
    line-height: 1.2;
    color: #0f172a;
    margin: 0 0 10px 0;

  .r8-badge {
    display: inline-block;

    color: var(--brand-primary);
    border: 1px solid var(--border-accent);
    padding: 4px 12px;

    border-radius: 0 6px 6px 0;

    font-size: 1.45rem;

    margin: 14px 0 5px 0;
    font-size: 0.92rem;
    color: #1e293b;
  }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--border-color);
    border-radius: 5px;
    font-family: inherit;
    font-size: 0.94rem;
    color: #0f172a;
    background: #ffffff;

    outline: none;
    border-color: var(--accent-blue);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);

    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    background: var(--tag-bg);
    color: var(--tag-text);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    font-weight: 700;
    margin-bottom: 8px;

    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
    margin-bottom: 8px;

    border: 1px solid var(--border-accent);
    border-left: 4px solid var(--accent-blue);
    border-radius: 8px;

    margin: 14px 0 20px 0;

    background: #f0fdf4;
    line-height: 1.5;

  .r8-brief h3:first-child { margin-top: 0; }
  .r8-brief p { margin: 0 0 6px; color: #334155; }

            "hint": "Amara works the family diner till 11 PM on weeknights. Her sleep window is squeezed by real economic duty.",
            "fields": [
                  {
                        "type": "static",
                        "html": "<div class=\"station-badge-tag\">STATION 10 &bull; Family Restaurant Closer & Non-Discretionary Labor</div>"
                  },
                  {
                        "id": "s10_hrs",
                        "type": "text",
                        "label": "Hours / Night (from case file):",
                        "placeholder": "e.g. 6.0 hrs"
                  },
                  {
                        "id": "s10_debt",
                        "type": "text",
                        "label": "Weekly Sleep Debt Calculation:",
                        "placeholder": "e.g. -14.5 hrs"
                  },
                  {
                        "id": "s10_risk",
                        "type": "select",
                        "label": "Clinical Triage Risk Level:",
                        "options": [
                              "CRITICAL (RED)",
                              "MODERATE (AMBER)",
                              "STABLE (GREEN)"
                        ]
                  },
                  {
                        "id": "s10_order",
                        "type": "text",
                        "label": "First Fix / Clinical Prescription:",
                        "placeholder": "The #1 high-leverage intervention..."
                  },
                  {
                        "id": "s10_notes",
                        "type": "textarea",
                        "label": "Case Evidence & Physiological Rationale:",
                        "placeholder": "What evidence from the case file supports your diagnosis?",
                        "rows": 3
                  }
            ]
      }

    ]
  };

  // ================= SERVER ENDPOINTS & INITIALIZATION =================
  const IDENTITY_URL = 'https://script.google.com/a/macros/gnspes.ca/s/AKfycbxzrLHgG2_vq8lh3VFB7SfPvbqXnn1atuz5S61oGlLul_l_jmlhrRc7Nwww__k9f5L0Rw/exec';
  const BACKEND_URL  = 'https://script.google.com/macros/s/AKfycbz73P9FG2HLIJMl9NY9iex9y1TIm1E8cRglvgrsNVAtrrtUJGXgtP3hwKanl_aWJHuMcw/exec';

  Room8.init({ identityUrl: IDENTITY_URL, backendUrl: BACKEND_URL });

  // Mount with bidirectional adapters for both standard fields and legacy nested stations{}
  R8Assignment.mount({
    mount: document.getElementById('r8'),
    pipe: Room8,
    assignment: ASSIGNMENT,
    custom: {
      collect: function(answers) {
        answers.stations = {};
        for (var i = 1; i <= 10; i++) {
          answers.stations[i] = {
            hrs: answers['s' + i + '_hrs'] || '',
            debt: answers['s' + i + '_debt'] || '',
            risk: answers['s' + i + '_risk'] || '',
            order: answers['s' + i + '_order'] || '',
            notes: answers['s' + i + '_notes'] || ''
          };
        }
        if (answers.metaPartner) answers.partner = answers.metaPartner;
        if (answers.metaDate) answers.date = answers.metaDate;
      },
      populate: function(answers) {
        if (!answers) return;
        // Support nested legacy stations format
        if (answers.stations && typeof answers.stations === 'object') {
          for (var i = 1; i <= 10; i++) {
            var stn = answers.stations[i] || answers.stations[String(i)];
            if (stn && typeof stn === 'object') {
              var fHrs = document.getElementById('r8f_s' + i + '_hrs');
              if (fHrs && !fHrs.value && stn.hrs) fHrs.value = stn.hrs;
              var fDebt = document.getElementById('r8f_s' + i + '_debt');
              if (fDebt && !fDebt.value && stn.debt) fDebt.value = stn.debt;
              var fRisk = document.getElementById('r8f_s' + i + '_risk');
              if (fRisk && !fRisk.value && stn.risk) fRisk.value = stn.risk;
              var fOrder = document.getElementById('r8f_s' + i + '_order');
              if (fOrder && !fOrder.value && stn.order) fOrder.value = stn.order;
              var fNotes = document.getElementById('r8f_s' + i + '_notes');
              if (fNotes && !fNotes.value && stn.notes) fNotes.value = stn.notes;
            }
          }
        }
        if (answers.partner) {
          var pEl = document.getElementById('r8f_metaPartner');
          if (pEl && !pEl.value) pEl.value = answers.partner;
        }
        if (answers.date) {
          var dEl = document.getElementById('r8f_metaDate');
          if (dEl && !dEl.value) dEl.value = answers.date;
        }
      }
    }
  });
</script>
