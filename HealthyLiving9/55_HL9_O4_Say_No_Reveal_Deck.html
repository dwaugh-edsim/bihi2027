<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL9 O4: How to Say No - Reveal Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Roboto+Slab:wght@700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --text-main:#0f172a; --text-muted:#475569; --bg:#e2e8f0;
        --accent:#2563eb; --amber:#b45309; --red:#b91c1c; --green:#15803d;
        --line:#cbd5e1;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text-main); background:var(--bg); line-height:1.45; }

    .top-toolbar { position:sticky; top:0; z-index:50; background:#0f172a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .tb-title { font-family:'Roboto Slab',serif; font-weight:800; font-size:1rem; }
    .tb-count { font-family:'JetBrains Mono',monospace; font-size:.8rem; color:#94a3b8; margin-left:auto; }
    .progress-container { height:4px; background:#1e293b; }
    .progress-bar-fill { height:100%; background:var(--accent); width:0; transition:width .18s ease; }

    .stage { max-width:1280px; margin:26px auto 30px auto; padding:0 20px; }
    .slide { background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 22px rgba(15,23,42,.10); padding:56px 60px; display:none; min-height:640px; }
    .slide.active { display:block; }

    .slide-num { font-family:'JetBrains Mono',monospace; font-size:.82rem; font-weight:800; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase; margin-bottom:16px; }
    .scene-title { font-family:'Roboto Slab',serif; font-size:2.4rem; font-weight:900; margin-bottom:26px; }
    .scene-sit { font-size:1.05rem; color:var(--text-muted); font-weight:600; margin:-20px 0 26px 0; }
    .scene-sit::before { content:"The pressure: "; color:#64748b; }

    .ver-row { display:grid; grid-template-columns:1fr; gap:14px; }
    .ver-card { border:2px solid var(--line); border-radius:10px; padding:16px 22px; display:flex; align-items:center; gap:22px; }
    .ver-badge { font-family:'Roboto Slab',serif; font-size:1.05rem; font-weight:900; color:#fff; padding:8px 16px; border-radius:8px; min-width:150px; text-align:center; letter-spacing:.03em; }
    .vb-pass { background:var(--amber); }
    .vb-agg  { background:var(--red); }
    .vb-assert { background:var(--green); }
    .ver-script { font-family:'Roboto Slab',serif; font-size:1.55rem; font-weight:700; font-style:italic; flex:1; }
    .ver-move { font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:800; color:var(--text-muted); text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }

    .why-strip { margin-top:26px; border-top:1.5px solid var(--line); padding-top:16px; font-size:1.5rem; font-weight:600; }
    .why-strip span { color:var(--green); font-weight:900; margin-right:10px; }

    .big { font-family:'Roboto Slab',serif; font-size:4.2rem; font-weight:900; line-height:1.15; }
    .big-sub { font-size:1.25rem; color:var(--text-muted); font-weight:600; margin-top:14px; }
    .course-pill { font-family:'JetBrains Mono',monospace; font-size:.85rem; font-weight:800; background:#eff6ff; color:var(--accent); border:1.5px solid #bfdbfe; padding:4px 12px; border-radius:6px; letter-spacing:.08em; text-transform:uppercase; display:inline-block; margin-bottom:26px; }

    .nav-foot { max-width:1280px; margin:0 auto 40px auto; padding:0 20px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .nav-btn { background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:11px 22px; cursor:pointer; font-weight:700; font-size:.9rem; color:var(--text-main); }
    .nav-btn:hover:not(:disabled) { background:#f1f5f9; border-color:var(--text-main); }
    .nav-btn:disabled { opacity:.4; cursor:default; }
    .nav-outcome { font-size:.82rem; color:var(--text-muted); font-weight:600; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); padding:6px 14px; border-radius:6px; }
    .nav-outcome-tag { font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:800; background:#f1f5f9; color:var(--accent); border:1px solid #bfdbfe; padding:2px 6px; border-radius:3px; }

    @media print { .top-toolbar,.nav-foot,.progress-container { display:none; } .slide { display:block !important; page-break-after:always; box-shadow:none; min-height:auto; } }
</style>
</head>
<body>

<div class="top-toolbar">
    <div class="tb-title">HL9 &middot; How to Say No &middot; Reveal</div>
    <div class="tb-count" id="count"></div>
</div>
<div class="progress-container"><div class="progress-bar-fill" id="prog"></div></div>

<div class="stage" id="deck"></div>

<div class="nav-foot">
    <button class="nav-btn" id="prev">&larr; Back</button>
    <div class="nav-outcome"><span class="nav-outcome-tag">O4</span> Use assertiveness, negotiation, and refusal skills</div>
    <button class="nav-btn" id="next">Next &rarr;</button>
</div>

<script>
var SLIDES = [
  '<div class="slide"><div class="course-pill">HL9 &middot; O4 Reveal</div>' +
  '<div class="big">Three ways<br>each one lands.</div>' +
  '<div class="big-sub">Sheets are already in. Listen, don&rsquo;t copy.</div></div>',

  // 1 PARTY CUP
  '<div class="slide"><div class="slide-num">Card 1</div><div class="scene-title">The Party Cup</div>' +
  '<div class="scene-sit">&ldquo;Come on, everyone&rsquo;s drinking. Don&rsquo;t be soft.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;Okay&hellip; just one sip.&rdquo;</div><div class="ver-move">the sip becomes the night</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;Get that away from me, you&rsquo;re pathetic.&rdquo;</div><div class="ver-move">starts a fight</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;No thanks. I&rsquo;m good with pop tonight.&rdquo;</div><div class="ver-move">move 1: direct no</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>A clear no, zero insults, easy exit for both of you.</div></div>',

  // 2 RIDE HOME
  '<div class="slide"><div class="slide-num">Card 2</div><div class="scene-title">The Ride Home</div>' +
  '<div class="scene-sit">&ldquo;Get in. I&rsquo;m fine to drive.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;Um&hellip; okay, but drive slow.&rdquo;</div><div class="ver-move">you are still in the car</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;Are you insane?! Not in your junker!&rdquo;</div><div class="ver-move">insult + you still need a ride</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;I&rsquo;m not getting in. I&rsquo;m calling home.&rdquo;</div><div class="ver-move">move 1 + move 3</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>Firm, then a real plan. Smashed rule: the driver is not fine.</div></div>',

  // 3 VAPE
  '<div class="slide"><div class="slide-num">Card 3</div><div class="scene-title">The Vape Hit</div>' +
  '<div class="scene-sit">&ldquo;One hit. Nobody will ever know.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;Maybe later&hellip;&rdquo;</div><div class="ver-move">they never stop asking</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;That thing is disgusting, put it away.&rdquo;</div><div class="ver-move">attacks them, not the ask</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;Nah. It wrecks my breathing.&rdquo;</div><div class="ver-move">move 2: reasoned no</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>A reason ends the ask. If they push: repeat the same line.</div></div>',

  // 4 PHOTO
  '<div class="slide"><div class="slide-num">Card 4</div><div class="scene-title">The Photo</div>' +
  '<div class="scene-sit">&ldquo;If you actually liked me, you&rsquo;d send it.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;Maybe later&hellip;&rdquo;</div><div class="ver-move">later = yes in their head</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;You&rsquo;re such a creep, lose my number.&rdquo;</div><div class="ver-move">burns everything</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;I don&rsquo;t send that. If it&rsquo;s a dealbreaker, this stops here.&rdquo;</div><div class="ver-move">move 1 + boundary</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>If they keep pushing, that&rsquo;s coercion: screenshot, report, tell an adult.</div></div>',

  // 5 ANSWERS
  '<div class="slide"><div class="slide-num">Card 5</div><div class="scene-title">The Answers Ask</div>' +
  '<div class="scene-sit">&ldquo;Send me your answers. I&rsquo;ll owe you one.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;Fine, here you go.&rdquo;</div><div class="ver-move">next test, same ask</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;Do your own homework for once.&rdquo;</div><div class="ver-move">friendship gone</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;Not sending answers. I can quiz you for 20 minutes.&rdquo;</div><div class="ver-move">move 6: swap the plan</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>Keeps the friend, keeps your work, offers something real.</div></div>',

  // 6 SKIP
  '<div class="slide"><div class="slide-num">Card 6</div><div class="scene-title">The Skip</div>' +
  '<div class="scene-sit">&ldquo;Skip with us. The sub won&rsquo;t even take attendance.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;Fine, but just one period.&rdquo;</div><div class="ver-move">attendance is attendance</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;No! Some of us want to pass!&rdquo;</div><div class="ver-move">moral lecture = enemy made</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;Can&rsquo;t. Save me a spot at lunch?&rdquo;</div><div class="ver-move">move 1 + move 6</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>No plus a plan that keeps the friends close, on your terms.</div></div>',

  // 7 PILE-ON
  '<div class="slide"><div class="slide-num">Card 7</div><div class="scene-title">The Pile-On</div>' +
  '<div class="scene-sit">&ldquo;Say something or you&rsquo;re the joke next.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;lol&rdquo;</div><div class="ver-move">you joined the pile</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;You guys are all losers. I&rsquo;m out.&rdquo;</div><div class="ver-move">torched everyone, target got nothing</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;Nah. Delete that. That&rsquo;s a real person.&rdquo;</div><div class="ver-move">move 1 + move 6</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>One voice breaks a pile-on. If it keeps up: screenshot, show an adult.</div></div>',

  // 8 ALIBI
  '<div class="slide"><div class="slide-num">Card 8</div><div class="scene-title">The Alibi</div>' +
  '<div class="scene-sit">&ldquo;Just tell my mom I&rsquo;m sleeping at your place.&rdquo;</div>' +
  '<div class="ver-row">' +
  '<div class="ver-card"><div class="ver-badge vb-pass">PASSIVE</div><div class="ver-script">&ldquo;Uh&hellip; fine, I guess.&rdquo;</div><div class="ver-move">the lie is yours now too</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-agg">AGGRESSIVE</div><div class="ver-script">&ldquo;I&rsquo;m not your lying servant. Tell her yourself.&rdquo;</div><div class="ver-move">friendship gone</div></div>' +
  '<div class="ver-card"><div class="ver-badge vb-assert">ASSERTIVE</div><div class="ver-script">&ldquo;I&rsquo;m not lying to your mom. Own the party.&rdquo;</div><div class="ver-move">move 1 + move 2</div></div>' +
  '</div>' +
  '<div class="why-strip"><span>&#10003;</span>A real ask stops at no. Covering a lie makes the lie yours.</div></div>',

  '<div class="slide"><div class="slide-num">Keep this</div>' +
  '<div class="big">Clear.<br>Respectful.<br>One move.</div>' +
  '<div class="big-sub">That&rsquo;s the whole unit. Lab packs next class.</div></div>'
];

var cur = 0;
function render() {
  document.getElementById('deck').innerHTML = SLIDES.join('');
}
function show(i) {
  var s = document.querySelectorAll('.slide');
  if (i < 0) i = 0;
  if (i >= s.length) i = s.length - 1;
  for (var k = 0; k < s.length; k++) s[k].classList.remove('active');
  s[i].classList.add('active');
  cur = i;
  document.getElementById('prog').style.width = ((i + 1) / s.length * 100) + '%';
  document.getElementById('count').textContent = (i + 1) + ' / ' + s.length;
  document.getElementById('prev').disabled = (i === 0);
  document.getElementById('next').disabled = (i === s.length - 1);
}
function step(d) { show(cur + d); }
document.getElementById('prev').onclick = function() { step(-1); };
document.getElementById('next').onclick = function() { step(1); };
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
});
render();
show(0);
</script>
</body>
</html>
