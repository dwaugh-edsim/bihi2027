<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL9 O2-A: The Fine Print: Reveal Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Slab:wght@700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --text-main:#0f172a; --text-muted:#475569; --bg:#e2e8f0;
        --accent:#2563eb; --amber:#b45309; --red:#b91c1c; --green:#15803d;
        --line:#cbd5e1;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text-main); background:var(--bg); line-height:1.45; }

    .top-toolbar { position:sticky; top:0; z-index:50; background:#0f172a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .tb-title { font-family:'Roboto Slab',serif; font-weight:800; font-size:1rem; }
    .tb-btn { background:#1e293b; color:#fff; border:1px solid #334155; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:.82rem; font-weight:600; }
    .tb-btn:hover { background:#334155; }
    .tb-count { font-family:'JetBrains Mono',monospace; font-size:.8rem; color:#94a3b8; margin-left:auto; }

    .progress-container { height:4px; background:#1e293b; }
    .progress-bar-wrap { height:100%; }
    .progress-bar-fill { height:100%; background:var(--accent); width:0; transition:width .18s ease; }

    .stage { max-width:1280px; margin:26px auto 30px auto; padding:0 20px; }
    .slide { background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 22px rgba(15,23,42,.10); padding:56px 56px 48px 56px; display:none; }
    .slide.active { display:block; }

    .slide-num { font-family:'JetBrains Mono',monospace; font-size:.82rem; font-weight:800; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase; margin-bottom:20px; }

    .claim { font-family:'Roboto Slab',serif; font-size:2.9rem; font-weight:800; line-height:1.22; }
    .claim-src { font-size:.9rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin-top:18px; }
    .claim-src::before { content: "Source: "; font-weight: 700; color: #64748b; }

    .prompt { margin-top:40px; border:2px dashed var(--line); border-radius:10px; padding:20px 24px; background:#f8fafc; }
    .prompt-h { font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .vote-chips { display:flex; gap:14px; flex-wrap:wrap; }
    .vote-chip { font-family:'JetBrains Mono',monospace; font-weight:800; font-size:1.3rem; padding:12px 30px; border:2px solid var(--text-main); border-radius:8px; background:#fff; }

    .verdict-head { display:flex; align-items:center; gap:22px; margin-bottom:28px; flex-wrap:wrap; }
    .verdict-badge { font-family:'Roboto Slab',serif; font-size:2.5rem; font-weight:900; padding:10px 30px; border-radius:10px; color:#fff; }
    .v-no { background:var(--red); }
    .v-yes { background:var(--green); }
    .v-dep { background:var(--amber); }
    .verdict-claim { font-family:'Roboto Slab',serif; font-size:1.6rem; font-weight:700; line-height:1.32; flex:1; min-width:300px; }

    .why-label { font-size:.74rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .why-list { font-size:1.72rem; line-height:1.5; }
    .why-list li { list-style:none; margin-bottom:1.05rem; padding-left:2.1rem; position:relative; }
    .why-list li::before { content:"▸"; position:absolute; left:0; color:var(--accent); font-weight:900; }
    .why-list li:last-child { margin-bottom:0; }
    .hl { background:#fef3c7; padding:0 4px; border-radius:3px; font-weight:700; }
    .rule { height:1px; background:var(--line); margin-top:26px; }

    .nav-foot { max-width:1280px; margin:0 auto 40px auto; padding:0 20px; display:flex; justify-content:space-between; gap:14px; }
    .nav-foot { max-width:1280px; margin:0 auto 40px auto; padding:0 20px; display:flex; justify-content:space-between; align-items:center; gap:14px; }
    .nav-btn { background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:11px 22px; cursor:pointer; font-weight:700; font-size:.9rem; color:var(--text-main); }
    .nav-btn:hover:not(:disabled) { background:#f1f5f9; border-color:var(--text-main); }
    .nav-btn:disabled { opacity:.4; cursor:default; }
    .nav-outcome { font-size:.82rem; color:var(--text-muted); font-weight:600; display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); padding:6px 14px; border-radius:6px; }
    .nav-outcome-tag { font-family:'JetBrains Mono',monospace; font-size:.72rem; font-weight:800; background:#f1f5f9; color:var(--accent); border:1px solid #bfdbfe; padding:2px 6px; border-radius:3px; }

    /* Title / Instruction Slide */
    .title-slide { padding:44px 50px 32px 50px; }
    .title-tag-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .course-pill { font-family:'JetBrains Mono',monospace; font-size:.85rem; font-weight:800; background:#eff6ff; color:var(--accent); border:1.5px solid #bfdbfe; padding:4px 12px; border-radius:6px; letter-spacing:.08em; text-transform:uppercase; }
    .room-stamp { font-family:'JetBrains Mono',monospace; font-size:.85rem; font-weight:700; color:var(--text-muted); }

    .title-head-main { font-family:'Roboto Slab',serif; font-size:2.85rem; font-weight:900; line-height:1.15; color:var(--text-main); margin-bottom:6px; }
    .title-head-sub { font-size:1.15rem; color:var(--text-muted); font-weight:600; margin-bottom:22px; }

    .inst-box { background:#f8fafc; border:2px solid var(--line); border-left:6px solid var(--accent); border-radius:10px; padding:18px 22px; margin-bottom:22px; }
    .inst-box-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; border-bottom:1px solid var(--line); padding-bottom:8px; }
    .inst-box-title { font-family:'Roboto Slab',serif; font-size:1.05rem; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--text-main); }
    .inst-box-badge { font-family:'JetBrains Mono',monospace; font-size:.78rem; font-weight:800; background:#e2e8f0; color:#334155; padding:2px 8px; border-radius:4px; }

    .inst-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:14px; }
    .inst-step-card { background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:14px 12px; display:flex; flex-direction:column; }
    .inst-step-badge { font-family:'JetBrains Mono',monospace; font-size:.78rem; font-weight:800; color:var(--accent); margin-bottom:4px; }
    .inst-step-title { font-family:'Roboto Slab',serif; font-size:1rem; font-weight:800; color:var(--text-main); margin-bottom:6px; }
    .inst-step-body { font-size:.84rem; color:var(--text-muted); line-height:1.42; flex:1; }
    .inst-vote-chips { display:flex; gap:4px; margin-top:8px; flex-wrap:wrap; }
    .inst-vote-chip { font-family:'JetBrains Mono',monospace; font-size:.68rem; font-weight:800; padding:2px 6px; border:1px solid var(--line); border-radius:3px; background:#f8fafc; }

    /* Bottom Outcome Banner */
    .screen-outcome-strip {
        background:#0f172a;
        color:#fff;
        border-radius:8px;
        padding:14px 20px;
        display:flex;
        align-items:center;
        gap:16px;
    }
    .outcome-pill {
        background:var(--amber);
        color:#fff;
        font-family:'JetBrains Mono',monospace;
        font-size:.82rem;
        font-weight:800;
        padding:4px 10px;
        border-radius:4px;
        letter-spacing:.05em;
        white-space:nowrap;
    }
    .outcome-content { flex:1; font-size:1rem; line-height:1.35; color:#f8fafc; }
    .outcome-content strong { color:#38bdf8; font-weight:700; }
    .outcome-content .outcome-sub { display:block; font-size:.82rem; color:#94a3b8; font-weight:500; margin-top:2px; }

    @media print {
        @page { size:landscape; margin:10mm; }
        body { background:#fff; }
        .top-toolbar, .progress-container, .nav-foot, .no-print { display:none !important; }
        .stage { margin:0; padding:0; max-width:100%; }
        .slide { display:block !important; box-shadow:none; border:1px solid #cbd5e1; border-radius:0; padding:13mm; page-break-after:always; break-after:page; margin:0 0 6mm 0; }
        .slide:last-child { page-break-after:auto; break-after:auto; }
        .claim { font-size:2.15rem; }
        .why-list { font-size:1.12rem; }
        .why-list li { margin-bottom:.45rem; padding-left:1.4rem; }
        .screen-outcome-strip { background:#fff !important; color:#000 !important; border:1.5px solid #000 !important; }
        .outcome-pill { background:#000 !important; color:#fff !important; }
        .outcome-content { color:#000 !important; }
        .outcome-content strong { color:#000 !important; }
    }
</style>
</head>
<body>

<div class="top-toolbar no-print">
  <div class="tb-title">The Fine Print: Reveal Deck</div>
  <button class="tb-btn" onclick="window.print()">Print all</button>
  <button class="tb-btn" onclick="jump(0)">Start</button>
  <div class="tb-count"><span id="cur">1</span> / <span id="tot">41</span> &nbsp;·&nbsp; arrow keys</div>
</div>
<div class="progress-container no-print"><div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar"></div></div></div>

<div class="stage" id="stage"></div>

<div class="nav-foot no-print">
  <button class="nav-btn" id="prev" onclick="step(-1)">&larr; Previous</button>
  <div class="nav-outcome">
    <span class="nav-outcome-tag">OUTCOME HL9 &bull; CO2</span>
    <span>Learners will analyse ways to care for one's own sexual and reproductive health.</span>
  </div>
  <button class="nav-btn" id="next" onclick="step(1)">Next &rarr;</button>
</div>
<script>
// [claim, attribution, verdict, why-bullets]
// Student-facing only. Teacher scripts and notes live in the facilitation guide.
const DECK = [

["Most people with chlamydia never notice a single symptom.", "a 2 a.m. search · the numbers surprised everyone", "TRUE", ["<strong>Up to 7 in 10 women, and about half of men, show nothing at all.</strong> The body does not announce it.", "It is the most commonly reported STI in Canada, and the highest rates are ages 15 to 29.", "Untreated, it can quietly scar: PID, fertility damage. The harm is silent too.", "<span class=\"hl\">Feeling fine was never a test. The test is the test.</span>"]],

["A sore that heals on its own means the infection healed too.", "a story that ends “and then it just went away”", "FALSE", ["<strong>CLOCK: the great imitator.</strong> A painless sore shows up, heals by itself, and the infection (syphilis) stays.", "It can keep marching for years, quietly, before it reaches the heart or brain.", "It is curable with antibiotics, but only if someone actually looks for it. The test is a simple blood draw.", "<span class=\"hl\">A sore that vanishes is not an infection that left.</span>"]],

["A cold sore can spread herpes somewhere other than a mouth, even when it's healed.", "a locker room, explained confidently", "TRUE", ["Herpes sheds between sores. Healed does not mean harmless.", "Oral contact can move a cold sore strain somewhere new.", "<strong>Once it is in, it is in for life</strong>: manageable, and extremely common.", "<span class=\"hl\">“Just a cold sore” is a live infection.</span>"]],

["A razor that looks clean is safe to share with a housemate.", "the bathroom counter, shared", "DEPENDS", ["<strong>Condition: is it actually clean?</strong> Looks are not a test at that scale.", "Hepatitis B survives dried on a surface for about a week, and blood is invisible at that size.", "A nick is all it takes, and far more infectious than HIV by blood.", "<span class=\"hl\">Razors and toothbrushes are personal items. “Looks clean” is not clean.</span>"]],

["You're about to get intimate. You remember protection. Your partner pulls a condom from his wallet. You're good.", "the wallet, obviously", "FALSE", ["A wallet is the worst place a condom lives: body heat, friction and time all weaken latex.", "Expiry dates are printed on the wrapper for a reason. Check it.", "<span class=\"hl\">Grab a fresh one. The wallet is where condoms go to die.</span>"]],

["Most STI testing is a pee cup and a blood draw, not a swab “down there”.", "a movie scene everyone half-remembers", "TRUE", ["<strong>The most common checks are a pee cup and a blood draw.</strong> That is most of it.", "Throat or rectal swabs happen only where the exposure was.", "It is quick, free and confidential.", "<span class=\"hl\">The scary version in movies is not the real version.</span>"]],

["HIV, the virus that can develop into AIDS, can pass from one person to another through any body fluid.", "a documentary, probably", "DEPENDS", ["<strong>Condition: which fluid.</strong>", "Yes: blood, semen, vaginal fluids, rectal fluids, breast milk.", "No: saliva, sweat, tears. Those are not how it travels.", "<span class=\"hl\">The fluid list is short once you have actually seen it.</span>"]],

["You have to ask for an STI test by name; it does not come included with a routine check-up.", "a check-up form nobody reads carefully", "TRUE", ["STI testing is <strong>opt-in</strong>. No standard physical sweeps for it automatically.", "That is why it gets missed: people assume the doctor already checked.", "<span class=\"hl\">Knowing what to ask for is the skill.</span>"]],

["Testicular cancer mostly happens to older men, generally over 40.", "a doctor-show plotline", "FALSE", ["<strong>The average age at diagnosis is about 33.</strong> The 15 to 34 years are the hot zone.", "A monthly self-check takes under a minute. A warm shower is the moment: the skin is loose.", "A painless lump that stays, or a swelling that does not leave: clinic. Same rule as always, watch for change.", "<span class=\"hl\">Young men get this one. Check early, check easy.</span>"]],

["Chocolate gives you acne.", "every aunt at every dinner", "FALSE", ["Controlled trials comparing chocolate to placebo bars found no meaningful difference.", "Acne runs on <strong>hormones, genetics and skin bacteria</strong>.", "Overall high-sugar eating has more evidence against it than chocolate specifically. Scrubbing harder does not help either.", "<span class=\"hl\">Blame puberty, not the chocolate bar.</span>"]],

["Peeing after sex lowers your chance of catching an STI.", "a life-hack account, again", "DEPENDS", ["<strong>Condition: which infection.</strong>", "A pee after sex may help lower the chance of a UTI: a bladder infection. Uncomfortable, but not an STI and not catching.", "STIs live in cells and on skin from sexual contact. Pee never touches them.", "<span class=\"hl\">UTIs: maybe. STIs: no.</span>"]],

["Exercise can genuinely take the edge off period pain.", "the one thing your gym teacher got right", "TRUE", ["One of the few lifestyle levers with real evidence behind it.", "Movement, heat and time beat white-knuckling it.", "Callback from walk 2: pain that stops school still gets described to a doctor.", "<span class=\"hl\">Manage what you can, describe what you cannot.</span>"]],

["A vagina returns to its normal shape after sex, no matter how many partners a person has had.", "a hallway, whispered", "TRUE", ["Vaginal muscle is <strong>elastic</strong>. It returns.", "Snugness follows arousal, not a partner count.", "Childbirth stretches it, and muscle tone rebuilds after.", "<span class=\"hl\">The hallway version of anatomy is wrong.</span>"]],

["The ache sometimes called “blue balls”, the pressure that builds when arousal doesn't end in ejaculation, means real damage has been done.", "locker-room biology", "FALSE", ["It is temporary fluid pressure. The clinical name exists, and it is not an injury.", "It settles on its own within hours. Nothing bursts, nothing is damaged.", "A cold shower, or just time, does the job.", "<span class=\"hl\">Uncomfortable is not the same as damaged.</span>"]],

["Sex usually hurts the first time.", "every movie where someone grips the sheets", "FALSE", ["<strong>With time, arousal and lubrication, the body is built for it.</strong> It should not hurt.", "Discomfort can happen. Pain usually means too fast, too dry, or too nervous.", "Bleeding, when it happens, is the same story: friction and nerves, not a broken lock (the hymen card, walk 2).", "Pain that keeps happening gets described to a doctor. Same rule as period pain."]],

["Half of people have had sex by their 16th birthday.", "the number everyone rounds down", "FALSE", ["The verified ladder (Canadian data): before 15, about 9%. Ages 15 to 17, about 23%. By 18 to 19, about 58%.", "The halfway line crosses near 18 or 19, not 16.", "<span class=\"hl\">Far fewer people have done it than claim it.</span> And waiting is completely normal.", "There is no schedule. Early, late, or not yet: all of it is on the curve."]],

["American teens start sex younger than Dutch teens, which is why the US teen pregnancy rate is so much higher.", "an American TV show", "FALSE", ["Start ages are similar on both sides of the Atlantic. That is not the difference.", "Teen birth rate, per 1,000 girls 15 to 19: <strong>US about 13, Netherlands about 2</strong>. A 6 to 7 times gap.", "The gap runs on comprehensive sex education, easy contraception access, and normalised parent-teen conversation.", "<span class=\"hl\">Same teens. Different information. Different outcome.</span>"]],

["The Halifax Sexual Health Centre mainly just hands out condoms.", "what everyone assumes", "FALSE", ["They do pills, rings, patches, shots, IUDs, implants and emergency contraception.", "The pill is low-cost there, <strong>or free if you can't pay: tell the nurse, no questions asked</strong>. That is their actual program.", "Free condoms and supplies, and appointments covered by MSI.", "<span class=\"hl\">Low cost or free. That is the real policy.</span>"]],

["In Nova Scotia a 15-year-old can get birth control confidentially, without involving family.", "assumed by absolutely everyone", "TRUE", ["<strong>The mature-minor rule:</strong> once a provider judges that you understand the treatment, you consent yourself. The care stays confidential.", "Routes: the Sexual Health Centre, a school-based Youth Health Centre, or any pharmacy (the consult is free with MSI).", "One practical note: never bill a family insurance plan. The plan holder sees the claim.", "<span class=\"hl\">Confidential means confidential.</span>"]],

["A grade 10 student, 15, has a 20-year-old girlfriend at DAL. If anything sexual happens, she could get into legal trouble.", "a real hallway hypothetical", "DEPENDS", ["<strong>Condition: how far apart their birthdays actually are.</strong>", "The age of consent is 16. At 14 or 15 there is a close-in-age rule: a partner less than five years older is legal, and never in a position of trust or authority.", "“15 and 20” can be 4 years 1 month (inside the rule) or 5 years flat (outside). Birthdays decide, not grade labels.", "<span class=\"hl\">The law runs on birthdays. Count the days.</span>"]]

];
const CLS = {"FALSE":"v-no","TRUE":"v-yes","DEPENDS":"v-dep"};

const stage = document.getElementById('stage');
let slides = [];

// 0. Title Slide (Class instructions & Learning Outcome)
var s0 = document.createElement('div');
s0.className = 'slide title-slide';
s0.innerHTML =
  '<div class="title-tag-row">' +
    '<div class="course-pill">Healthy Living 9 &bull; Module O2-A</div>' +
    '<div class="room-stamp">Room 8 &bull; Mr. Waugh &bull; 20 Wall Statements</div>' +
  '</div>' +
  '<h1 class="title-head-main">The Fine Print: Reveal Deck</h1>' +
  '<div class="title-head-sub">Nobody Told Me 3/3 &bull; Fact-Checking Anatomy, Testing &amp; Reproductive Health</div>' +
  '<div class="inst-box">' +
    '<div class="inst-box-header">' +
      '<span class="inst-box-title">Do This Now &bull; Wall Walk Instructions</span>' +
      '<span class="inst-box-badge">RECORDING SHEET</span>' +
    '</div>' +
    '<div class="inst-grid">' +
      '<div class="inst-step-card">' +
        '<div class="inst-step-badge">STEP 1</div>' +
        '<div class="inst-step-title">Walk the Room</div>' +
        '<div class="inst-step-body">Grab a recording sheet and pencil. Move through Room 8 to find the <strong>20 posted statements</strong>.</div>' +
      '</div>' +
      '<div class="inst-step-card">' +
        '<div class="inst-step-badge">STEP 2</div>' +
        '<div class="inst-step-title">Record Verdicts</div>' +
        '<div class="inst-step-body">On your sheet, record your vote for each statement:' +
          '<div class="inst-vote-chips">' +
            '<span class="inst-vote-chip" style="color:var(--green)">TRUE</span>' +
            '<span class="inst-vote-chip" style="color:var(--red)">FALSE</span>' +
            '<span class="inst-vote-chip" style="color:var(--amber)">DEPENDS</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="inst-step-card">' +
        '<div class="inst-step-badge">STEP 3</div>' +
        '<div class="inst-step-title">Partner Check</div>' +
        '<div class="inst-step-body">Compare answers with a partner. Put a star (<strong>&starf;</strong>) beside any statements where you disagree.</div>' +
      '</div>' +
      '<div class="inst-step-card">' +
        '<div class="inst-step-badge">STEP 4</div>' +
        '<div class="inst-step-title">Class Reveal</div>' +
        '<div class="inst-step-body">Return to your desk when called. We will debrief each statement on this deck using medical evidence and verified facts.</div>' +
      '</div>' +
    '</div>' +
  '</div>' +
  '<div class="screen-outcome-strip">' +
    '<div class="outcome-pill">OUTCOME HL9 &bull; CO2</div>' +
    '<div class="outcome-content">' +
      '<strong>Learners will analyse ways to care for one\'s own sexual and reproductive health.</strong>' +
      '<span class="outcome-sub">Focus: Evaluating accurate health information, STI testing realities, and confidential healthcare access in Nova Scotia.</span>' +
    '</div>' +
  '</div>';
stage.appendChild(s0);
slides.push(s0);

DECK.forEach(function(d, i) {
  var claim = d[0], attrib = d[1], verdict = d[2], why = d[3];
  var n = String(i + 1).padStart(2, '0');

  var s1 = document.createElement('div');
  s1.className = 'slide';
  s1.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="claim">&ldquo;' + claim + '&rdquo;</div>' +
    '<div class="claim-src">' + attrib + '</div>' +
    '<div class="prompt"><div class="prompt-h">Vote with your partner: one tick</div>' +
    '<div class="vote-chips"><span class="vote-chip">TRUE</span><span class="vote-chip">FALSE</span><span class="vote-chip">IT DEPENDS</span></div></div>';
  stage.appendChild(s1);
  slides.push(s1);

  var s2 = document.createElement('div');
  s2.className = 'slide';
  s2.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="verdict-head"><div class="verdict-badge ' + CLS[verdict] + '">' + verdict + '</div>' +
    '<div class="verdict-claim">&ldquo;' + claim + '&rdquo;</div></div>' +
    '<div class="rule"></div>' +
    '<ul class="why-list">' + why.map(function(b) { return '<li>' + b + '</li>'; }).join('') + '</ul>';
  stage.appendChild(s2);
  slides.push(s2);
});

document.getElementById('tot').textContent = slides.length;
let cur = -1;

function show(i) {
  if (i < 0 || i >= slides.length) return;
  if (cur >= 0) slides[cur].classList.remove('active');
  cur = i;
  slides[cur].classList.add('active');
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('bar').style.width = ((cur + 1) / slides.length * 100) + '%';
  document.getElementById('prev').disabled = (cur === 0);
  document.getElementById('next').disabled = (cur === slides.length - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function step(d) { show(cur + d); }
function jump(i) { show(i); }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
});

show(0);
</script>

</body>
</html>
