<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL9 O2-A: Myth Trials — Reveal Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Roboto+Slab:wght@700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --text-main:#0f172a; --text-muted:#475569; --bg:#e2e8f0;
        --accent:#2563eb; --amber:#b45309; --red:#b91c1c; --green:#15803d;
        --line:#cbd5e1;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--text-main); background:var(--bg); line-height:1.45; }

    .top-toolbar { position:sticky; top:0; z-index:50; background:#0f172a; color:#fff; padding:10px 18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .tb-title { font-family:'Roboto Slab',serif; font-weight:800; font-size:1rem; }
    .tb-btn { background:#1e293b; color:#fff; border:1px solid #334155; padding:5px 12px; border-radius:4px; cursor:pointer; font-size:.82rem; font-weight:600; }
    .tb-btn:hover { background:#334155; }
    .tb-count { font-family:'JetBrains Mono',monospace; font-size:.8rem; color:#94a3b8; margin-left:auto; }

    .progress-container { height:4px; background:#1e293b; }
    .progress-bar-wrap { height:100%; }
    .progress-bar-fill { height:100%; background:var(--accent); width:0; transition:width .18s ease; }

    .stage { max-width:1180px; margin:26px auto 30px auto; padding:0 20px; }
    .slide { background:#fff; border:1px solid var(--line); border-radius:12px; box-shadow:0 6px 22px rgba(15,23,42,.10); padding:56px 56px 48px 56px; display:none; }
    .slide.active { display:block; }

    .slide-num { font-family:'JetBrains Mono',monospace; font-size:.82rem; font-weight:800; letter-spacing:.1em; color:var(--text-muted); text-transform:uppercase; margin-bottom:20px; }

    .claim { font-family:'Roboto Slab',serif; font-size:2.5rem; font-weight:800; line-height:1.24; }
    .claim-src { font-size:.9rem; color:var(--text-muted); font-family:'JetBrains Mono',monospace; margin-top:18px; }

    .prompt { margin-top:40px; border:2px dashed var(--line); border-radius:10px; padding:20px 24px; background:#f8fafc; }
    .prompt-h { font-size:.78rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .vote-chips { display:flex; gap:14px; flex-wrap:wrap; }
    .vote-chip { font-family:'JetBrains Mono',monospace; font-weight:800; font-size:1.05rem; padding:10px 26px; border:2px solid var(--text-main); border-radius:8px; background:#fff; }

    .verdict-head { display:flex; align-items:center; gap:22px; margin-bottom:28px; flex-wrap:wrap; }
    .verdict-badge { font-family:'Roboto Slab',serif; font-size:2.1rem; font-weight:900; padding:8px 26px; border-radius:10px; color:#fff; }
    .v-no { background:var(--red); }
    .v-yes { background:var(--green); }
    .v-dep { background:var(--amber); }
    .verdict-claim { font-family:'Roboto Slab',serif; font-size:1.28rem; font-weight:700; line-height:1.34; flex:1; min-width:300px; }

    .why-label { font-size:.74rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
    .why { font-size:1.18rem; line-height:1.66; }
    .hl { background:#fef3c7; padding:0 4px; border-radius:3px; font-weight:700; }
    .rule { height:1px; background:var(--line); margin-top:26px; }

    .nav-foot { max-width:1180px; margin:0 auto 40px auto; padding:0 20px; display:flex; justify-content:space-between; gap:14px; }
    .nav-btn { background:#fff; border:1.5px solid var(--line); border-radius:8px; padding:11px 22px; cursor:pointer; font-weight:700; font-size:.9rem; color:var(--text-main); }
    .nav-btn:hover:not(:disabled) { background:#f1f5f9; border-color:var(--text-main); }
    .nav-btn:disabled { opacity:.4; cursor:default; }

    @media print {
        @page { size:landscape; margin:10mm; }
        body { background:#fff; }
        .top-toolbar, .progress-container, .nav-foot, .no-print { display:none !important; }
        .stage { margin:0; padding:0; max-width:100%; }
        .slide { display:block !important; box-shadow:none; border:1px solid #cbd5e1; border-radius:0; padding:13mm; page-break-after:always; break-after:page; margin:0 0 6mm 0; }
        .slide:last-child { page-break-after:auto; break-after:auto; }
        .claim { font-size:2.15rem; }
    }
</style>
</head>
<body>

<div class="top-toolbar no-print">
  <div class="tb-title">Myth Trials — Reveal</div>
  <button class="tb-btn" onclick="window.print()">Print all 40</button>
  <button class="tb-btn" onclick="jump(0)">Start</button>
  <div class="tb-count"><span id="cur">1</span> / <span id="tot">40</span> &nbsp;·&nbsp; arrow keys</div>
</div>
<div class="progress-container no-print"><div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar"></div></div></div>

<div class="stage" id="stage"></div>

<div class="nav-foot no-print">
  <button class="nav-btn" id="prev" onclick="step(-1)">&larr; Previous</button>
  <button class="nav-btn" id="next" onclick="step(1)">Next &rarr;</button>
</div>

<script>
// [claim, attribution, verdict, why]
// Student-facing only. Teacher scripts and notes live in the facilitation guide.
const DECK = [

["You can usually tell if someone has an STI by looking at them.","in a group chat","NO",
 "You cannot tell by looking — it is not like chickenpox. Many STBBIs cause <strong>no symptoms at all</strong>, and some that do cause symptoms produce none you can see. <strong>Testing is the only way to know.</strong>"],

["It's nearly impossible to get pregnant during your period.","in a group chat","DEPENDS",
 "<span class=\"hl\">Possible, but less likely.</span> Sperm can survive up to five days, and ovulation can happen earlier than expected. Short cycles and long periods raise the odds. &ldquo;Nearly impossible&rdquo; is doing a lot of work in that sentence."],

["You can pick up an STI from a toilet seat.","overheard in the washroom","NO",
 "STIs are not passed that way. Transmission requires sexual contact — genital skin-to-skin or body-fluid exchange. A toilet seat does neither."],

["You can't get pregnant if they pull out before they finish.","in a video","NO",
 "<strong>Risk lives at penetration, not at ejaculation.</strong> Pre-ejaculate can contain live sperm, and semen on the vulva can cause pregnancy even with well-timed withdrawal. Withdrawal also gives <strong>zero</strong> protection against STIs — skin-to-skin contact and micro-tears happen regardless."],

["Condoms are 98% effective at preventing pregnancy.","a classmate","DEPENDS",
 "<strong>98% is perfect use</strong> — measured under controlled conditions. <strong>Typical real-world use is about 87%.</strong> Fit, timing, and expired condoms all matter. 98% of what, and under what conditions?"],

["If your partner freezes and doesn't say no, that's still consent.","read somewhere","NO",
 "Freezing is not agreeing. Consent has to be <strong>active and affirmative</strong>, and it can be withdrawn at any moment — for any reason, with no explanation. Silence, going along with it, and being unable to respond are all the <strong>absence</strong> of consent, not consent."],

["You can get an STI from oral sex.","on a forum","YES",
 "Oral sex prevents pregnancy but <strong>reduces without eliminating</strong> the risk of STIs — chlamydia, gonorrhea, herpes, and hepatitis B are all possible. Condoms and dental dams reduce it further."],

["Wearing two condoms at once gives you extra protection.","a tip in the comments","NO",
 "It gives you <strong>less</strong> protection. Friction between two layers makes them more likely to tear, slip, or bunch up. Condoms are tested and approved for single use — <strong>one correctly used condom beats two.</strong>"],

["The birth control pill protects you from STIs.","on a forum","NO",
 "The pill works against pregnancy and provides <strong>no protection against STIs at all</strong>. A condom together with another method is <strong>dual protection</strong> — they cover different risks."],

["Birth control makes you gain weight.","read somewhere","DEPENDS",
 "<strong>Which method?</strong> There is no strong link between the pill or patch and weight gain. <strong>The Depo injection is the exception</strong> — it is associated with real weight gain. It also depends on the person, and on what else is changing at the same time."],

["If you're under 16, you need your parents' permission to get tested for an STI in Nova Scotia.","read somewhere","NO",
 "That is <strong>false</strong>. In Nova Scotia you do <strong>not</strong> need a parent's permission, and there is <strong>no minimum age</strong>, to get tested for an STI, get birth control, or get a pregnancy test. You can go to a Youth Health Centre, a public health unit, or a family doctor — or call <strong>811</strong> — and arrange it yourself."],

["If you're both in a committed, monogamous relationship, there's no reason to get tested.","someone's older sibling","NO",
 "Testing is about <strong>what happened before you got together</strong>, not about how faithful you are now. People can carry an infection for years without knowing. And faithfulness only protects you if it is mutual — STIs do not stay on one side of a relationship."],

["If someone was tested a month ago and was clear, you don't need to worry.","someone's older sibling","DEPENDS",
 "A month is much better than a year, but it is still a snapshot. It tells you about the past — not about <strong>new exposures</strong> since then, and not about what your partner has done. Routine testing also does not cover everything: herpes and HPV are usually left out of standard panels."],

["There is a vaccine for some STIs.","in a podcast","YES",
 "<strong>HPV and hepatitis B</strong> both have vaccines. There are no vaccines for HIV, chlamydia, gonorrhea, or syphilis. And these vaccines are <strong>prevention, not treatment</strong> — they do not cure an infection someone already has."],

["Nova Scotia has the 3rd highest rate of sexual exploitation in Canada.","someone's older sibling","NO",
 "That number is not real. <strong>Nova Scotia has the highest provincial rate of human trafficking in Canada</strong> — about 4.5 per 100,000 people in 2024, roughly three times the national rate. Nobody had ever published a &ldquo;third&rdquo; figure — that is the point."],

["If the morning-after pill doesn't work within a few hours, it's not going to work at all.","in a podcast","DEPENDS",
 "It <strong>does</strong> still work later — but it works best <strong>within 24 hours</strong>, and it gets less effective the longer you wait. A copper IUD placed within 7 days is the most effective option. &ldquo;Sooner is better&rdquo; does not mean &ldquo;point of no return.&rdquo;"],

["Sexual assaults usually happen when a stranger attacks someone walking alone at night.","a classmate","NO",
 "This is the stranger-danger myth, and it is wrong. Statistics Canada found that <strong>about three in four</strong> people who were sexually assaulted were assaulted by <strong>someone they already knew</strong> — a friend, an acquaintance, a partner, or a family member. The stranger in the dark alley is the exception, not the rule. <strong>This is about awareness, not blame.</strong>"],

["Antibiotics can cure chlamydia and gonorrhea.","asked in class once","YES",
 "Both chlamydia and gonorrhea are bacterial, and <strong>both can be cured with antibiotics</strong>. Other STIs are viral — HIV and herpes can be managed and treated, but not cured. <strong>Some are curable, some are manageable.</strong>"],

["HIV usually results in death by AIDS.","an old health video","NO",
 "That was true before 1996, and it stopped being true. <strong>HIV is now a manageable long-term condition.</strong> With treatment taken as prescribed, people with HIV live about as long as anyone else — and someone on treatment with an undetectable viral load <strong>cannot pass HIV on through sex</strong>."],

["Someone who is drunk can't give consent.","a friend of a friend","NO",
 "Somebody who is drunk is <strong>not able to give consent</strong>. Consent has to be <strong>informed, sober, ongoing and freely given</strong>, and alcohol and drugs impair exactly the thinking it requires — including the ability to say yes <em>and</em> the ability to say no. If someone is drunk, there is no consent. Full stop."]

];

const CLS = {"NO":"v-no","YES":"v-yes","DEPENDS":"v-dep"};

const stage = document.getElementById('stage');
let slides = [];

DECK.forEach(function(d, i) {
  var claim = d[0], attrib = d[1], verdict = d[2], why = d[3];
  var n = String(i + 1).padStart(2, '0');

  var s1 = document.createElement('div');
  s1.className = 'slide';
  s1.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="claim">&ldquo;' + claim + '&rdquo;</div>' +
    '<div class="claim-src">' + attrib + '</div>' +
    '<div class="prompt"><div class="prompt-h">Vote with your partner — one tick</div>' +
    '<div class="vote-chips"><span class="vote-chip">YES</span><span class="vote-chip">NO</span><span class="vote-chip">DEPENDS</span></div></div>';
  stage.appendChild(s1);
  slides.push(s1);

  var s2 = document.createElement('div');
  s2.className = 'slide';
  s2.innerHTML =
    '<div class="slide-num">Statement ' + n + ' of 20</div>' +
    '<div class="verdict-head"><div class="verdict-badge ' + CLS[verdict] + '">' + verdict + '</div>' +
    '<div class="verdict-claim">&ldquo;' + claim + '&rdquo;</div></div>' +
    '<div class="rule"></div>' +
    '<div class="why">' + why + '</div>';
  stage.appendChild(s2);
  slides.push(s2);
});

document.getElementById('tot').textContent = slides.length;
let cur = -1;

function show(i) {
  if (i < 0 || i >= slides.length) return;
  if (cur >= 0) slides[cur].classList.remove('active');
  cur = i;
  slides[cur].classList.add('active');
  document.getElementById('cur').textContent = cur + 1;
  document.getElementById('bar').style.width = ((cur + 1) / slides.length * 100) + '%';
  document.getElementById('prev').disabled = (cur === 0);
  document.getElementById('next').disabled = (cur === slides.length - 1);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
function step(d) { show(cur + d); }
function jump(i) { show(i); }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(slides.length - 1); }
});

show(0);
</script>

</body>
</html>
