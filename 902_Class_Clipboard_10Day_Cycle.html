<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Clipboard: 902 Waugh • 10-Day Cycle (A4 Printable)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --border-black: #000000;
            --th-gray: #d4d4d8;
            --lunch-gray: #e4e4e7;
            --note-gray: #e4e4e7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #3f3f46;
            font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* SCREEN NAVIGATION TOOLBAR */
        .screen-nav {
            position: sticky;
            top: 10px;
            z-index: 1000;
            background: #18181b;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            max-width: 900px;
            width: 95%;
            justify-content: space-between;
        }

        .nav-title {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .day-select {
            background: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-print {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s;
        }

        .btn-print:hover {
            background: #1d4ed8;
        }

        /* A4 CLIPBOARD PAGE */
        .clipboard-page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            padding: 7mm 8mm 6mm 10mm;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* SIDE MARGIN VERTICAL TITLE (RUNS SAFELY CLEAR OF TOP CLIPBOARD CLAMP) */
        .side-margin-label {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 10mm;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 10;
        }

        .side-margin-text {
            transform: rotate(-90deg);
            white-space: nowrap;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #000000;
        }

        /* HEADER AREA (CLEARS THE METAL CLIPBOARD CLAMP) */
        .sheet-header {
            text-align: center;
            margin-top: 1mm;
            margin-bottom: 3px;
        }

        .meta-line {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.74rem;
            font-weight: 700;
            white-space: nowrap;
            padding-bottom: 2px;
        }

        .days-strip {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .day-tag {
            color: #000000;
            padding: 0 3px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .day-tag.current {
            border: 1.5px solid #000000;
            border-radius: 3px;
            padding: 1px 5px;
            background: #000000;
            color: #ffffff;
        }

        .cycle-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
        }

        .fill-line {
            display: inline-block;
            border-bottom: 1.5px dashed #000000;
            height: 14px;
            line-height: 14px;
            vertical-align: bottom;
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            color: #000000;
        }

        .fill-line.date {
            min-width: 95px;
            padding: 0 4px;
        }

        .fill-line.week {
            min-width: 45px;
            padding: 0 4px;
        }

        .date-input {
            background: #27272a;
            color: #ffffff;
            border: 1px solid #3f3f46;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: inherit;
            font-weight: 600;
            color-scheme: dark;
            cursor: pointer;
        }

        .nav-label {
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* MAIN GRID CONTAINER (2 COLUMNS: ROSTER ON LEFT, SCHEDULE ON RIGHT) */
        .grid-container {
            display: grid;
            grid-template-columns: 85mm 1fr;
            border: 1.5px solid var(--border-black);
            flex-grow: 1;
            margin-top: 2px;
        }

        /* LEFT ROSTER TABLE */
        .roster-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            height: 100%;
        }

        .roster-table th {
            background-color: var(--th-gray);
            border: 1px solid var(--border-black);
            font-weight: 800;
            text-align: center;
            padding: 2px 1px;
            font-size: 0.72rem;
            line-height: 1.15;
        }

        .roster-table th.col-num {
            width: 6.5mm;
            font-size: 0.78rem;
        }

        .roster-table th.col-name {
            font-size: 0.82rem;
            width: 27.5mm;
            text-align: left;
            padding-left: 4px;
        }

        .roster-table th.col-group-am,
        .roster-table th.col-group-pm {
            font-size: 0.68rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            background-color: #d4d4d8;
            height: 4.8mm;
        }

        .roster-table th.col-p {
            width: 7.2mm;
            background-color: #f1f5f9;
            height: 4.8mm;
            padding: 1px 0;
            vertical-align: middle;
        }

        .roster-table th.col-p .p-num {
            font-size: 0.63rem;
            font-weight: 800;
            color: #0f172a;
            line-height: 1;
        }

        .roster-table th.col-p .p-subj {
            font-size: 0.55rem;
            font-weight: 700;
            color: #334155;
            line-height: 1;
            margin-top: 1px;
        }

        .roster-table th.col-left {
            width: 15mm;
            font-size: 0.66rem;
            line-height: 1.1;
        }

        /* Stronger divider separating AM (P1, P2, P3) from PM (P4, P5) */
        .roster-table th.p-last-am,
        .roster-table td.p-last-am,
        .roster-table th.col-group-am {
            border-right: 2px solid var(--border-black) !important;
        }

        .roster-table td {
            border: 1px solid var(--border-black);
            padding: 0 4px;
            height: 7.7mm;
            vertical-align: middle;
            font-size: 0.72rem;
            font-weight: 500;
        }

        .roster-table td.col-num {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 0.68rem;
            color: #27272a;
            background-color: #f8fafc;
            padding: 0 1px;
        }

        .roster-table td.col-num.blank-num {
            color: #cbd5e1;
        }

        .roster-table td.col-name {
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 5px;
            font-size: 0.74rem;
            letter-spacing: -0.01em;
        }

        .roster-table td.col-p {
            width: 7.2mm;
            text-align: center;
            background-color: #ffffff;
            padding: 0;
        }

        .roster-table td.col-left {
            width: 15mm;
            background-color: #ffffff;
            padding: 0 2px;
            font-size: 0.65rem;
        }

        /* RIGHT SCHEDULE / EVALUATION PANEL */
        .eval-panel {
            border-left: 1.5px solid var(--border-black);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        /* EVAL HEADER */
        .eval-header {
            display: grid;
            grid-template-columns: 24mm 1fr 15mm;
            background-color: var(--th-gray);
            border-bottom: 1.5px solid var(--border-black);
            text-align: center;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: -0.01em;
            height: 9.6mm;
            align-items: center;
        }

        .eval-header .h-class { border-right: 1px solid var(--border-black); height: 100%; display: flex; align-items: center; justify-content: center; }
        .eval-header .h-notes { border-right: 1px solid var(--border-black); height: 100%; display: flex; align-items: center; justify-content: center; }
        .eval-header .h-points { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }

        /* PERIOD ROW BLOCK */
        .period-block {
            display: grid;
            grid-template-columns: 24mm 1fr 15mm;
            border-bottom: 1.5px solid var(--border-black);
            flex: 1 1 0;
            min-height: 0;
        }

        .period-name-cell {
            border-right: 1px solid var(--border-black);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.88rem;
            letter-spacing: -0.01em;
            text-align: center;
            padding: 2px;
            line-height: 1.15;
            background: #ffffff;
        }

        .period-name-cell .room-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.64rem;
            font-weight: 700;
            color: #3f3f46;
            margin-top: 2px;
            letter-spacing: 0.02em;
        }

        .period-notes-cell {
            border-right: 1px solid var(--border-black);
            padding: 2px 6px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            background: #ffffff;
        }

        .criteria-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.70rem;
            font-weight: 600;
            line-height: 1.15;
            letter-spacing: -0.005em;
        }

        .check-sq {
            width: 10px;
            height: 10px;
            border: 1.2px solid #000000;
            display: inline-block;
            flex-shrink: 0;
        }

        .period-points-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }

        /* LUNCH BANNER */
        .lunch-banner {
            background-color: var(--lunch-gray);
            border-bottom: 1.5px solid var(--border-black);
            text-align: center;
            font-weight: 800;
            font-size: 0.82rem;
            padding: 3px 0;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* ANNOUNCEMENTS & HOMEWORK BLOCK */
        .notes-header-banner {
            background-color: var(--note-gray);
            border-bottom: 1px solid var(--border-black);
            text-align: center;
            font-weight: 800;
            font-size: 0.80rem;
            padding: 3px 0;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .announcements-box {
            flex: 1.8 1 0;
            position: relative;
            background: #ffffff;
            border-bottom: 1px solid var(--border-black);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
        }

        .total-points-wrap {
            align-self: flex-end;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: auto;
        }

        .total-points-label {
            font-weight: 700;
            font-size: 0.78rem;
        }

        .total-points-box {
            width: 18mm;
            height: 8mm;
            border: 1.5px solid var(--border-black);
        }

        /* BOTTOM FILL ROWS (MATCHING ROSTER BOTTOM GRID) */
        .bottom-blank-row {
            height: 7.7mm;
            border-bottom: 1px solid var(--border-black);
            display: grid;
            grid-template-columns: 24mm 1fr 15mm;
        }
        .bottom-blank-row:last-child {
            border-bottom: none;
        }
        .bottom-blank-row .b-col1 { border-right: 1px solid var(--border-black); }
        .bottom-blank-row .b-col2 { border-right: 1px solid var(--border-black); }

        /* PRINT STYLES */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .screen-nav {
                display: none !important;
            }

            #pagesContainer {
                display: block !important;
            }

            .clipboard-page {
                width: 210mm !important;
                height: 296mm !important; /* 1mm under A4 so rounding never spills to page 2 */
                margin: 0 !important;
                padding: 7mm 8mm 5mm 10mm !important;
                box-shadow: none !important;
                page-break-after: always !important;
                page-break-inside: avoid !important;
                overflow: hidden !important;
            }

            .clipboard-page:last-of-type {
                page-break-after: auto !important;
            }

            .side-margin-label,
            .roster-table th,
            .eval-header,
            .lunch-banner,
            .notes-header-banner {
                print-color-adjust: exact !important;
                -webkit-print-color-adjust: exact !important;
            }
        }
    </style>
</head>

    <!-- SCREEN NAVIGATION CONTROLS -->

        <div class="nav-title">
            <span>📋 Class Clipboard: 902 Waugh</span>

        <div class="nav-controls">
            <label class="nav-label" for="dayFilter">Day:</label>
            <select id="dayFilter" class="day-select" onchange="filterDay(this.value)">

            <label class="nav-label" for="cycleStartDate">Cycle W1 Start:</label>

            <button class="btn-print" onclick="window.print()">🖨️ Print Selected</button>

        function getShortCode(name) {
            const clean = name.replace(/^[0-9]+-/, '').trim().toUpperCase();
            if (clean === 'FRENCH') return 'FR';
            return clean;
        }

        function renderPeriodHTML(p) {
            return `
                <div class="period-block">
                    <div class="period-name-cell">
                        <span>${p.name}</span>
                        ${p.room ? `<span class="room-tag">${p.room}</span>` : ''}
                    </div>
                    <div class="period-notes-cell">
                        <div class="criteria-row"><span class="check-sq"></span> Entering and getting settled (2 pts)</div>
                        <div class="criteria-row"><span class="check-sq"></span> Coming prepared to class (2 pts)</div>
                        <div class="criteria-row"><span class="check-sq"></span> Following School Rules (3 pts)</div>
                        <div class="criteria-row"><span class="check-sq"></span> On task learning (3 pts)</div>
                    </div>
                    <div class="period-points-cell"></div>
                </div>
            `;
        }

        function renderPage(dayData) {
            // Days of week row
            const daysArr = ["MON", "TUES", "WED", "THURS", "FRI"];
            const daysHTML = daysArr.map(d => {
                const isCurrent = (d === dayData.dayName);
                return `<span class="day-tag ${isCurrent ? 'current' : ''}">${d}</span>`;
            }).join('');

            // Roster rows HTML (Numbered 1..30)
            const rosterHTML = roster902.map((name, idx) => `
                <tr>
                    <td class="col-num ${name ? '' : 'blank-num'}">${idx + 1}</td>
                    <td class="col-name">${name}</td>
                    <td class="col-p p-am"></td>
                    <td class="col-p p-am"></td>
                    <td class="col-p p-am p-last-am"></td>
                    <td class="col-p p-pm"></td>
                    <td class="col-p p-pm"></td>
                    <td class="col-left"></td>
                </tr>
            `).join('');

            return `
                <div class="clipboard-page" id="page-day${dayData.dayNum}">
                    <!-- SIDE MARGIN VERTICAL TITLE (CLEAR OF CLIPBOARD CLAMP) -->
                    <div class="side-margin-label">
                        <span class="side-margin-text">CLASS CLIPBOARD: 902 WAUGH &bull; ${dayData.cycleDay.toUpperCase()} (${dayData.dayName})</span>
                    </div>

                    <!-- HEADER -->
                    <div class="sheet-header">
                        <div class="meta-line">
                            <span class="days-strip">${daysHTML}</span>
                            <span class="cycle-tag">[ ${dayData.cycleDay.toUpperCase()} &bull; ${dayData.weekNum.toUpperCase()} ]</span>
                            <span>DATE: <span class="fill-line date" id="date-day${dayData.dayNum}"></span>&nbsp;&nbsp;WEEK: <span class="fill-line week" id="week-day${dayData.dayNum}"></span></span>
                        </div>
                    </div>

                    <!-- MAIN GRID (LEFT: ROSTER, RIGHT: SCHEDULE & NOTES) -->
                    <div class="grid-container">
                        <!-- LEFT TABLE: STUDENTS -->
                        <div style="height: 100%;">
                            <table class="roster-table">
                                <thead>
                                    <tr>
                                        <th class="col-num" rowspan="2">#</th>
                                        <th class="col-name" rowspan="2">Name</th>
                                        <th class="col-group-am" colspan="3">AM Classes</th>
                                        <th class="col-group-pm" colspan="2">PM Classes</th>
                                        <th class="col-left" rowspan="2">Left<br>Class?</th>
                                    </tr>
                                    <tr>
                                        <th class="col-p p-am"><div class="p-num">P1</div><div class="p-subj">${getShortCode(dayData.periods[0].name)}</div></th>
                                        <th class="col-p p-am"><div class="p-num">P2</div><div class="p-subj">${getShortCode(dayData.periods[1].name)}</div></th>
                                        <th class="col-p p-am p-last-am"><div class="p-num">P3</div><div class="p-subj">${getShortCode(dayData.periods[2].name)}</div></th>
                                        <th class="col-p p-pm"><div class="p-num">P4</div><div class="p-subj">${getShortCode(dayData.periods[3].name)}</div></th>
                                        <th class="col-p p-pm"><div class="p-num">P5</div><div class="p-subj">${getShortCode(dayData.periods[4].name)}</div></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${rosterHTML}
                                </tbody>
                            </table>
                        </div>

                        <!-- RIGHT PANEL: EVALUATION BY PERIOD -->
                        <div class="eval-panel">
                            <!-- EVAL HEADER -->
                            <div class="eval-header">
                                <div class="h-class">Class</div>
                                <div class="h-notes">Notes</div>
                                <div class="h-points">Points</div>
                            </div>

                            <!-- PERIODS 1, 2, 3 -->
                            ${renderPeriodHTML(dayData.periods[0])}
                            ${renderPeriodHTML(dayData.periods[1])}
                            ${renderPeriodHTML(dayData.periods[2])}

                            <!-- LUNCH DIVIDER -->
                            <div class="lunch-banner">Lunch 12:05 &ndash; 1PM</div>

                            <!-- PERIODS 4, 5 -->
                            ${renderPeriodHTML(dayData.periods[3])}
                            ${renderPeriodHTML(dayData.periods[4])}

                            <!-- ANNOUNCEMENTS, NOTES, HOMEWORK -->
                            <div class="notes-header-banner">Announcements, Notes, Homework</div>
                            <div class="announcements-box">
                                <div class="total-points-wrap">
                                    <span class="total-points-label">Total Points for Today&rarr;</span>
                                    <div class="total-points-box"></div>
                                </div>
                            </div>

                            <!-- BOTTOM FILL TO PERFECTLY MATCH ROSTER BOTTOM (3-COLUMN GRID) -->
                            <div class="bottom-blank-row"><div class="b-col1"></div><div class="b-col2"></div><div></div></div>
                            <div class="bottom-blank-row"><div class="b-col1"></div><div class="b-col2"></div><div></div></div>
                            <div class="bottom-blank-row"><div class="b-col1"></div><div class="b-col2"></div><div></div></div>
                            <div class="bottom-blank-row"><div class="b-col1"></div><div class="b-col2"></div><div></div></div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render all 10 pages
        const container = document.getElementById('pagesContainer');
        container.innerHTML = cycleSchedule.map(d => renderPage(d)).join('');

        // Anchor: Week of Mon Sep 14, 2026 is Week 1 Monday
        const ANCHOR_DATE = new Date(2026, 8, 14); // Sep 14, 2026

        function getMondayOfWeek(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const mon = new Date(date.setDate(diff));
            mon.setHours(0, 0, 0, 0);
            return mon;
        }

        function getCycleW1Monday(d) {
            const mon = getMondayOfWeek(d);
            const diffWeeks = Math.round((mon - ANCHOR_DATE) / (7 * 24 * 60 * 60 * 1000));
            if (diffWeeks % 2 === 0) {
                return mon;
            } else {
                const prevMon = new Date(mon);
                prevMon.setDate(prevMon.getDate() - 7);
                return prevMon;
            }
        }

        function formatDisplayDate(d) {
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
        }

        function toInputDateValue(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function updateAllDates() {
            const isAuto = document.getElementById('autoDateCheck').checked;
            const cycleInput = document.getElementById('cycleStartDate');
            let w1Date;

            if (cycleInput && cycleInput.value) {
                const parts = cycleInput.value.split('-').map(Number);
                w1Date = new Date(parts[0], parts[1] - 1, parts[2]);
            } else {
                w1Date = getCycleW1Monday(new Date());
            }

            for (let i = 1; i <= 10; i++) {
                const dateEl = document.getElementById(`date-day${i}`);
                const weekEl = document.getElementById(`week-day${i}`);
                if (!dateEl || !weekEl) continue;

                if (!isAuto) {
                    dateEl.textContent = '';
                    weekEl.textContent = '';
                    continue;
                }

                // Days 1-5: offset 0..4 (Week 1 Mon-Fri)
                // Days 6-10: offset 7..11 (Week 2 Mon-Fri)
                const offset = (i <= 5) ? (i - 1) : (7 + i - 6);
                const dayDate = new Date(w1Date);
                dayDate.setDate(dayDate.getDate() + offset);

                dateEl.textContent = formatDisplayDate(dayDate);
                weekEl.textContent = (i <= 5) ? 'Week 1' : 'Week 2';
            }
        }

        // Initialize date picker with current cycle W1 Monday & populate dates
        const initialW1 = getCycleW1Monday(new Date());
        const cycleInput = document.getElementById('cycleStartDate');
        if (cycleInput) {
            cycleInput.value = toInputDateValue(initialW1);
        }
        updateAllDates();

        // Filter / Navigation function
        function filterDay(val) {
            const pages = document.querySelectorAll('.clipboard-page');
            if (val === 'all') {
                pages.forEach(p => p.style.display = 'flex');
            } else {
                pages.forEach(p => {
                    if (p.id === 'page-' + val) {
                        p.style.display = 'flex';
                    } else {
                        p.style.display = 'none';
                    }
                });
            }
        }
    </script>
</body>
</html>
