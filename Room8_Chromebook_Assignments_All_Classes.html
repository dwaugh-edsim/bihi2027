    <style>
        :root {
            --border-dark: #0f172a;
            --border-light: #cbd5e1;
            --th-bg: #1e293b;
            --th-text: #ffffff;
            --row-even: #f8fafc;
            --row-alt: #ffffff;
            --spare-bg: #fffbeb;
            --spare-text: #92400e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #475569;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #0f172a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        /* NAVIGATION TOOLBAR */
        .screen-toolbar {
            position: sticky;
            top: 12px;
            z-index: 1000;
            background: #0f172a;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            width: 95%;
            margin-bottom: 20px;
        }

        .toolbar-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .toolbar-title .badge {
            background: #0284c7;
            padding: 3px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.78rem;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .class-select {
            background: #1e293b;
            color: #ffffff;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-print {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.15s ease;
        }

        .btn-print:hover {
            background: #1d4ed8;
        }

        /* A4 PRINTABLE PAGE */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            padding: 9mm 11mm 8mm 11mm;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        /* PAGE HEADER */
        .page-header {
            border-bottom: 2px solid var(--border-dark);
            padding-bottom: 5px;
            margin-bottom: 6px;
        }

        .header-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .header-title-block h1 {
            font-family: 'Courier Prime', Courier, monospace;
            font-size: 1.32rem;
            font-weight: 700;
            color: #000000;
            letter-spacing: -0.01em;
            line-height: 1.1;
        }

        .header-title-block p {
            font-size: 0.74rem;
            color: #475569;
            font-weight: 600;
            margin-top: 2px;
        }

        .header-meta-box {
            text-align: right;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            line-height: 1.35;
        }

        .header-meta-box .cart-tag {
            background: #0f172a;
            color: #ffffff;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 2px;
        }

        /* RULES BANNER */
        .rules-bar {
            background: #f1f5f9;
            border: 1px solid var(--border-light);
            border-radius: 4px;
            padding: 3px 8px;
            font-size: 0.68rem;
            font-weight: 600;
            color: #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
        }

        /* ROSTER TABLE */
        .roster-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.72rem;
            border: 1.5px solid var(--border-dark);
            flex-grow: 1;
            margin-bottom: 6px;
        }

        .roster-table th {
            background: var(--th-bg);
            color: var(--th-text);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.72rem;
            padding: 4px 6px;
            border: 1px solid var(--border-dark);
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .roster-table th.th-num { width: 14mm; text-align: center; }
        .roster-table th.th-name { width: 68mm; text-align: left; }
        .roster-table th.th-notes { width: 50mm; text-align: left; }
        .roster-table th.th-audit { width: 56mm; text-align: center; }

        .roster-table td {
            border: 1px solid var(--border-light);
            padding: 0 6px;
            height: 7.35mm;
            vertical-align: middle;
            font-size: 0.73rem;
        }

        .roster-table tr:nth-child(even) td {
            background: var(--row-even);
        }

        .roster-table td.cell-num {
            text-align: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 0.75rem;
            border-right: 1.5px solid var(--border-dark);
        }

        .roster-table td.cell-name {
            font-weight: 600;
            border-right: 1px solid var(--border-light);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .roster-table td.cell-notes {
            color: #64748b;
            font-style: italic;
            border-right: 1px solid var(--border-light);
        }

        .roster-table td.cell-audit {
            text-align: center;
        }

        .audit-boxes {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .sq-box {
            width: 11px;
            height: 11px;
            border: 1.2px solid #64748b;
            display: inline-block;
            border-radius: 2px;
        }

        /* SPARE ROWS */
        .roster-table tr.spare-row td {
            background: var(--spare-bg) !important;
            color: var(--spare-text);
        }

        .roster-table tr.spare-row td.cell-name {
            font-style: italic;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        /* PAGE FOOTER */
        .page-footer {
            border-top: 1.5px solid var(--border-dark);
            padding-top: 5px;
            font-size: 0.7rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #334155;
            flex-shrink: 0;
        }

        .footer-sig-line {
            display: inline-block;
            border-bottom: 1.2px solid #000000;
            width: 120px;
            margin-left: 4px;
        }

        /* PRINT STYLES */
        @media print {
            body {
                background: #ffffff !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            .screen-toolbar {
                display: none !important;
            }

            .a4-page {
                width: 210mm !important;
                height: 297mm !important;
                padding: 9mm 11mm 8mm 11mm !important;
                margin: 0 !important;
                box-shadow: none !important;
                page-break-after: always;
                page-break-inside: avoid;
            }

            .a4-page:last-of-type {
                page-break-after: auto;
            }

            .roster-table th, .roster-table td, .rules-bar, .header-meta-box .cart-tag, .spare-row td {
                print-color-adjust: exact !important;
                -webkit-print-color-adjust: exact !important;
            }
        }
    </style>
</head>

                            </div>
                            <div>
                                Student Quartermaster: <span class="footer-sig-line"></span> &bull; Date: ____________
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        renderPages();

        function filterClass(val) {
            const pages = document.querySelectorAll('.a4-page');
            if (val === 'all') {
                pages.forEach(p => p.style.display = 'flex');
            } else {
                pages.forEach(p => {
                    p.style.display = (p.id === val) ? 'flex' : 'none';
                });
            }
        }
    </script>
</body>
</html>
