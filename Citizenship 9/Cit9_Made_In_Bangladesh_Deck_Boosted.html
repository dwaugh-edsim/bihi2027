<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Made in Bangladesh (AI Boosted)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #070b14; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; user-select: none; }
  #stage { position: relative; width: 100vw; height: 100vh; background: #070b14; }
  .b-slide {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.36s ease;
  }
  .b-slide.active { opacity: 1; pointer-events: auto; z-index: 1; }
  .b-slide img { max-width: 100vw; max-height: 100vh; width: auto; height: auto; object-fit: contain; display: block; }
  #hud {
    position: fixed; bottom: 14px; right: 16px; z-index: 10; display: flex; align-items: center; gap: 8px;
    background: rgba(15, 23, 42, 0.84); border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 999px; padding: 6px 12px; backdrop-filter: blur(8px); font-size: 13px;
    opacity: 0.35; transition: opacity 0.2s;
  }
  #hud:hover { opacity: 1; }
  .hbtn {
    background: rgba(30, 41, 59, 0.9); color: #f8fafc; border: 1px solid rgba(148, 163, 184, 0.3);
    border-radius: 999px; padding: 4px 10px; cursor: pointer; font-weight: 700; font-size: 12px; text-decoration: none;
  }
  .hbtn:hover { background: #1e293b; border-color: #2dd4bf; }
  #ctr { font-family: ui-monospace, monospace; font-weight: 700; min-width: 56px; text-align: center; color: #94a3b8; }
</style>
</head>
<body>
<div id="stage" onclick="step(1)"></div>
<div id="hud">
  <a class="hbtn" href="Cit9_Made_In_Bangladesh_Deck.html" title="Switch to Low-Cal HTML version">Low-Cal HTML</a>
  <button class="hbtn" type="button" onclick="step(-1)">&larr;</button>
  <span id="ctr">01 / 01</span>
  <button class="hbtn" type="button" onclick="step(1)">&rarr;</button>
  <button class="hbtn" type="button" onclick="toggleFS()">Full</button>
</div>
<script>
const SLIDES = ["Cit9_Made_In_Bangladesh_Deck_boosted/slide_01.jpg", "Cit9_Made_In_Bangladesh_Deck_boosted/slide_02.jpg", "Cit9_Made_In_Bangladesh_Deck_boosted/slide_03.jpg", "Cit9_Made_In_Bangladesh_Deck_boosted/slide_04.png"];
const stage = document.getElementById('stage');
const frames = SLIDES.map((src, i) => {
  const d = document.createElement('div');
  d.className = 'b-slide';
  const img = document.createElement('img');
  img.src = src; img.alt = 'Slide ' + (i + 1);
  d.appendChild(img); stage.appendChild(d);
  return d;
});
let idx = 0;
function show(n) {
  idx = Math.max(0, Math.min(SLIDES.length - 1, n));
  frames.forEach((f, i) => f.classList.toggle('active', i === idx));
  const pad = v => (v < 10 ? '0' : '') + v;
  document.getElementById('ctr').textContent = pad(idx + 1) + ' / ' + pad(SLIDES.length);
  if (history.replaceState) history.replaceState(null, null, '#' + (idx + 1));
}
function step(d) { show(idx + d); }
function toggleFS() {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen().catch(()=>{});
}
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Home') { e.preventDefault(); show(0); }
  else if (e.key === 'End') { e.preventDefault(); show(SLIDES.length - 1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFS(); }
});
const h = parseInt((location.hash || '').slice(1), 10);
show(!isNaN(h) && h >= 1 ? h - 1 : 0);
</script>
</body>
</html>
