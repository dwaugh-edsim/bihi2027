  const REGION_ORDER = ['Canada', 'United States', 'Latin America & Caribbean', 'Europe', 'Middle East & Africa', 'Asia', 'Oceania'];

  function cityById(id) {
    return CITY_DATA.find(function (city) { return city.id === id; }) || null;
  }

  function formatNumber(value) {
    return Number(value).toLocaleString('en-US', { maximumFractionDigits: 2 });
  }

  function cityOptionsHtml() {
    return REGION_ORDER.map(function (region) {
      const inRegion = CITY_DATA.filter(function (city) { return city.region === region; });
      if (!inRegion.length) return '';
      return '<optgroup label="' + region + '">' + inRegion.map(function (city) {
        return '<option value="' + city.id + '">' + city.name + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
  }

  function priceCellHtml(city, item) {
    const price = city.p[item.id];
    if (price === undefined || price === null) return '<span>—</span>';
    return '<span><b>$' + formatNumber(price) + '</b> <span class="snapshot-meta">CAD</span></span>';
  }

  function generateCitySnapshotHtml() {
    const options = cityOptionsHtml();
    const rows = PRICE_ITEMS.map(function (item) {
      return '<tr>' +
        '<td class="item-cell"><b>' + item.item + '</b><span class="snapshot-meta">' + item.unit + '</span></td>' +
        '<td id="price-a-' + item.id + '">' + priceCellHtml(cityById(DEFAULT_CITY_A), item) + '</td>' +
        '<td id="price-b-' + item.id + '">' + priceCellHtml(cityById(DEFAULT_CITY_B), item) + '</td>' +
        '<td class="snapshot-difference">' +
          '<button type="button" class="mini city-calc-btn" data-item-id="' + item.id + '"' +
            ' aria-label="Calculate the price difference for ' + item.item + '">Calculate %</button>' +
          '<output id="diff-' + item.id + '" aria-live="polite">Not calculated</output>' +
        '</td>' +
      '</tr>';
    }).join('');
    return '<div class="snapshot-selectors">' +
        '<label for="cityASelect">City A (starts as Halifax)<select id="cityASelect" aria-label="Choose City A">' + options + '</select>' +
          '<span id="cityAMeta" class="snapshot-meta"></span></label>' +
        '<label for="cityBSelect">City B (starts as Delhi)<select id="cityBSelect" aria-label="Choose City B">' + options + '</select>' +
          '<span id="cityBMeta" class="snapshot-meta"></span></label>' +
      '</div>' +
      '<p id="snapshotPairWarning" class="snapshot-warning" role="status"></p>' +
      '<div style="overflow-x:auto;">' +
        '<table class="matrix" id="citySnapshotTable">' +
          '<caption>Same item and unit in each city. Every price is in Canadian dollars (CAD), converted from the December 2022 Numbeo snapshot bundled into this page at 1 USD ≈ $1.36 CAD.</caption>' +
          '<thead><tr><th style="width:28%;">ITEM / UNIT</th>' +
            '<th id="cityAHeading" style="width:22%;">CITY A PRICE</th>' +
            '<th id="cityBHeading" style="width:22%;">CITY B PRICE</th>' +
            '<th style="width:28%;">DIFFERENCE</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>' +
      '<p class="snapshot-footnote">Both columns are already in USD, so the formula is simply: (City A price − City B price) ÷ City B price × 100. A positive result means City A costs more for that item. Click Calculate % to reveal each result.</p>' +
      '<details class="dataset-sources">' +
        '<summary>Sources, dates and comparison limits</summary>' +
        '<p>City prices: <a href="https://www.numbeo.com/cost-of-living/" target="_blank" rel="noopener">Numbeo cost-of-living database</a>, snapshot of <b>December 2022</b>, redistributed through the Kaggle dataset <a href="https://www.kaggle.com/datasets/mvieira101/global-cost-of-living" target="_blank" rel="noopener">Global Cost of Living</a> and licensed <a href="https://creativecommons.org/publicdomain/zero/1.0/" target="_blank" rel="noopener">CC0 1.0 Public Domain</a>. Items follow Numbeo\'s standard definitions (rent = 1-bedroom apartment in the city centre; utilities = electricity, heating, cooling, water and garbage for an 85 m² apartment). The source data is in US dollars; every city here was converted to Canadian dollars at the same approximate December 2022 rate (1 USD ≈ 1.36 CAD), so percentage comparisons are unaffected by the conversion.</p>' +
        '<p>Income: Numbeo\'s <i>Average Monthly Net Salary (After Tax)</i> for each city, from the same December 2022 snapshot.</p>' +
        '<p>Limitations: the data is crowd-sourced, so the number of price entries differs between cities; "city centre" means different things in different countries; city averages hide big neighbourhood differences; and December 2022 is several years old — Halifax rents, for example, have risen sharply since. Treat every comparison as a structured estimate, not a current fact. This page makes no requests to Numbeo or any other live service.</p>' +
      '</details>';
  }

  function generateAffordabilityHtml() {

      '<div style="overflow-x:auto;">' +
        '<table class="matrix" aria-label="Directional affordability comparison">' +
          '<thead><tr><th>MEASURE</th><th id="affordCityA">City A</th><th id="affordCityB">City B</th></tr></thead>' +
          '<tbody>' +
            '<tr><td>Hours at 2,000 work hours/year to afford one combo meal</td><td id="mealHoursA">—</td><td id="mealHoursB">—</td></tr>' +
            '<tr><td>City-centre 1-bedroom rent as a share of the average monthly net salary</td><td id="rentShareA">—</td><td id="rentShareB">—</td></tr>' +
          '</tbody>' +
        '</table>' +
      '</div>' +
      '<p class="snapshot-footnote">Salary is each city\'s average NET (after-tax) monthly salary in CAD, December 2022. It is an average across all jobs — not the salary of a specific career — which is exactly why price alone can be misleading.</p>';
  }

  // =======================================================================================
  const IDENTITY_URL = 'https://script.google.com/a/macros/gnspes.ca/s/AKfycbxzrLHgG2_vq8lh3VFB7SfPvbqXnn1atuz5S61oGlLul_l_jmlhrRc7Nwww__k9f5L0Rw/exec';
  const BACKEND_URL  = 'https://script.google.com/macros/s/AKfycbz73P9FG2HLIJMl9NY9iex9y1TIm1E8cRglvgrsNVAtrrtUJGXgtP3hwKanl_aWJHuMcw/exec';

  Room8.init({ identityUrl: IDENTITY_URL, backendUrl: BACKEND_URL });

  function updateAffordabilityCell(city, suffix) {
    const mealEl = document.getElementById('mealHours' + suffix);
    const rentEl = document.getElementById('rentShare' + suffix);
    const mealPrice = city.p.fastFood;
    const rentPrice = city.p.rent;
    const monthlySalary = city.salary;
    if (mealPrice === undefined || monthlySalary === undefined || rentPrice === undefined) {
      mealEl.textContent = '—';
      rentEl.textContent = '—';
      return;
    }
    const hourlyIncome = (monthlySalary * 12) / 2000;
    mealEl.textContent = formatNumber(mealPrice / hourlyIncome) + ' hours';
    rentEl.textContent = formatNumber((rentPrice / monthlySalary) * 100) + '%';
  }

  function renderCitySnapshot(clearDifferences) {
    const selectA = document.getElementById('cityASelect');
    const selectB = document.getElementById('cityBSelect');
    if (!selectA || !selectB) return;
    const cityA = cityById(selectA.value);
    const cityB = cityById(selectB.value);
    if (!cityA || !cityB) return;

    document.getElementById('cityAHeading').textContent = cityA.name;
    document.getElementById('cityBHeading').textContent = cityB.name;
    document.getElementById('cityAMeta').textContent = SNAPSHOT_NOTE;
    document.getElementById('cityBMeta').textContent = SNAPSHOT_NOTE;
    document.getElementById('affordCityA').textContent = cityA.name + ' · salary $' + formatNumber(cityA.salary) + ' CAD/mo';
    document.getElementById('affordCityB').textContent = cityB.name + ' · salary $' + formatNumber(cityB.salary) + ' CAD/mo';

    PRICE_ITEMS.forEach(function (item) {
      document.getElementById('price-a-' + item.id).innerHTML = priceCellHtml(cityA, item);
      document.getElementById('price-b-' + item.id).innerHTML = priceCellHtml(cityB, item);
      const output = document.getElementById('diff-' + item.id);
      if (clearDifferences) output.textContent = 'Not calculated';
      else if (cityA.id === cityB.id) output.textContent = 'Choose two different cities.';
    });

    updateAffordabilityCell(cityA, 'A');
    updateAffordabilityCell(cityB, 'B');
    const sameCity = cityA.id === cityB.id;
    const warning = document.getElementById('snapshotPairWarning');
    warning.textContent = sameCity ? 'Choose two different cities to calculate a comparison.' : '';
    warning.style.display = sameCity ? 'block' : 'none';
    document.querySelectorAll('.city-calc-btn').forEach(function (button) {
      button.disabled = sameCity;
    });
  }

  function calculateDifference(itemId) {
    const selectA = document.getElementById('cityASelect');
    const selectB = document.getElementById('cityBSelect');
    const cityA = cityById(selectA.value);
    const cityB = cityById(selectB.value);
    const item = PRICE_ITEMS.find(function (row) { return row.id === itemId; });
    if (!cityA || !cityB || !item || cityA.id === cityB.id) return;

    const priceA = cityA.p[item.id];
    const priceB = cityB.p[item.id];
    if (priceA === undefined || priceB === undefined || !priceB) return;
    const percent = ((priceA - priceB) / priceB) * 100;
    const amount = formatNumber(Math.abs(percent));
    const result = percent === 0
      ? 'Same price (0%)'
      : cityA.name + ' is ' + amount + '% ' + (percent > 0 ? 'higher' : 'lower');
    const output = document.getElementById('diff-' + item.id);
    output.textContent = result;
    output.title = result;
    if (window.Room8 && Room8.touch) Room8.touch();
  }

  function collectCityPriceData() {
    const cityA = document.getElementById('cityASelect').value;
    const cityB = document.getElementById('cityBSelect').value;
    const a = cityById(cityA) || cityById(DEFAULT_CITY_A);
    const b = cityById(cityB) || cityById(DEFAULT_CITY_B);
    if (!a || !b) return { version: DATA_VERSION, city_a: cityA, city_b: cityB, rows: [] };
    return {
      version: DATA_VERSION,
      city_a: cityA,
      city_b: cityB,
      rows: PRICE_ITEMS.map(function (item, index) {
        const priceA = a.p[item.id];
        const priceB = b.p[item.id];
        return {
          row: index + 1,
          item_id: item.id,
          item: item.item + ' (' + item.unit + ')',
          city_a_name: a.name,
          city_a_cad: priceA,
          city_b_name: b.name,
          city_b_cad: priceB,
          pct_difference: document.getElementById('diff-' + item.id).textContent
        };
      })
    };
  }

  function restoreCityPriceData(saved) {
    const selectA = document.getElementById('cityASelect');
    const selectB = document.getElementById('cityBSelect');
    if (saved.city_a && cityById(saved.city_a)) selectA.value = saved.city_a;
    if (saved.city_b && cityById(saved.city_b)) selectB.value = saved.city_b;
    renderCitySnapshot(true);
    if (saved.version !== DATA_VERSION) return; // older dataset layout: selections restored, results recalculated fresh
    (Array.isArray(saved.rows) ? saved.rows : []).forEach(function (row) {
      if (!row || !row.item_id || !row.pct_difference) return;
      const output = document.getElementById('diff-' + row.item_id);
      if (output) output.textContent = row.pct_difference;
    });
  }

  // Store the selected city pair and calculated comparisons as one custom answer.
  const _mount = R8Assignment.mount;
  R8Assignment.mount = function (opts) {
    opts.custom = {
      collect: function (answers) {
        answers.global_city_prices = collectCityPriceData();
      },
      populate: function (data) {
        if (data.global_city_prices && typeof data.global_city_prices === 'object') {
          restoreCityPriceData(data.global_city_prices);
        }
      }
    };
    return _mount(opts);
  };
  // =======================================================================================
  R8Assignment.mount({ mount: document.getElementById('r8'), pipe: Room8, assignment: ASSIGNMENT });
  const citySelectA = document.getElementById('cityASelect');
  const citySelectB = document.getElementById('cityBSelect');
  const snapshotTable = document.getElementById('citySnapshotTable');

  [citySelectA, citySelectB].forEach(function (select) {
    select.addEventListener('change', function () {
      renderCitySnapshot(true);
      if (window.Room8 && Room8.touch) Room8.touch();
    });
  });
  snapshotTable.addEventListener('click', function (event) {
    const button = event.target.closest('.city-calc-btn');
    if (button) calculateDifference(button.dataset.itemId);
  });

  // Set the default pair (Halifax vs New York) and render.
  citySelectA.value = DEFAULT_CITY_A;
  citySelectB.value = DEFAULT_CITY_B;
  renderCitySnapshot(true);
