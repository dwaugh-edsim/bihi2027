<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizenship 9 • Treaties & Donald Marshall Jr. : 10-Question Quick Quiz (LCD Projector)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&family=Roboto+Slab:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    :root {
        --bg-page: #0b1120;
        --bg-surface: #1e293b;
        --bg-card: #0f172a;
        --bg-card-hover: #1e293b;

        --border-card: #334155;
        --border-subtle: #1e293b;
        --border-highlight: #dc2626;

        --text-main: #f8fafc;
        --text-heading: #ffffff;
        --text-muted: #94a3b8;
        --text-dim: #64748b;

        --red-brand: #dc2626;
        --red-glow: rgba(220, 38, 38, 0.4);
        --blue-brand: #2563eb;
        --blue-light: #dbeafe;
        --emerald-brand: #059669;
        --amber-brand: #d97706;

        --font-heading: 'Roboto Slab', Georgia, serif;
        --font-body: 'Inter', system-ui, -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: var(--bg-page);
        color: var(--text-main);
        font-family: var(--font-body);
        user-select: none;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px 28px;
        transition: background-color 0.2s ease;
    }

    /* Black screen blackout mode (B key) */
    body.blackout {
        background-color: #000000 !important;
    }
    body.blackout * {
        visibility: hidden !important;
    }

    /* Top Progress Bar Segment Strip */
    .progress-strip {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 8px;
        width: 100%;
        margin-bottom: 10px;
    }

    .progress-seg {
        height: 7px;
        background: #1e293b;
        border-radius: 4px;
        border: 1px solid rgba(255,255,255,0.06);
        transition: all 0.25s ease;
    }

    .progress-seg.active {
        background: var(--red-brand);
        box-shadow: 0 0 10px var(--red-glow);
        border-color: #ef4444;
    }

    .progress-seg.completed {
        background: var(--blue-brand);
    }

    /* Header Bar */
    header {
        background: var(--bg-surface);
        border: 1px solid var(--border-card);
        border-radius: 12px;
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .badge-room {
        background: var(--red-brand);
        color: #ffffff;
        font-family: var(--font-heading);
        font-weight: 800;
        font-size: 0.85rem;
        padding: 4px 12px;
        border-radius: 6px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .badge-unit {
        background: rgba(37, 99, 235, 0.2);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.4);
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 0.82rem;
        padding: 4px 12px;
        border-radius: 6px;
    }

    .header-title {
        font-family: var(--font-heading);
        font-size: 1.2rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: 0.3px;
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .counter-badge {
        font-family: var(--font-mono);
        font-size: 1.1rem;
        font-weight: 800;
        background: #0f172a;
        color: #38bdf8;
        border: 1px solid #334155;
        padding: 6px 16px;
        border-radius: 8px;
        letter-spacing: 0.8px;
    }

    .control-btn {
        background: #0f172a;
        border: 1px solid var(--border-card);
        border-radius: 8px;
        padding: 7px 14px;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.88rem;
        color: #cbd5e1;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
    }

    .control-btn:hover {
        border-color: #38bdf8;
        color: #ffffff;
        background: #1e293b;
    }

    .control-btn.btn-active {
        background: var(--red-brand);
        color: #fff;
        border-color: #ef4444;
    }

    /* Main Slide Stage */
    main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px 0;
        position: relative;
    }

    .stage-card {
        background: var(--bg-surface);
        border: 2px solid var(--border-card);
        border-radius: 20px;
        width: 100%;
        max-width: 1420px;
        height: 100%;
        max-height: 740px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px 56px;
        box-shadow: 0 12px 36px rgba(0,0,0,0.4);
        position: relative;
        overflow: hidden;
    }

    /* Subtle top accent line */
    .stage-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--red-brand), var(--blue-brand));
    }

    .slide-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        animation: fadeInSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInSlide {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .slide-meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
    }

    .topic-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(220, 38, 38, 0.15);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.35);
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 0.95rem;
        padding: 6px 16px;
        border-radius: 8px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }

    .q-number-kicker {
        font-family: var(--font-mono);
        font-size: 1.35rem;
        font-weight: 800;
        color: #38bdf8;
        letter-spacing: 1px;
        text-transform: uppercase;
    }

    .q-text-container {
        margin-bottom: 22px;
    }

    .q-text {
        font-family: var(--font-heading);
        font-size: 2.15rem;
        font-weight: 800;
        color: var(--text-heading);
        line-height: 1.32;
        letter-spacing: -0.2px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    }

    /* Options 2x2 Grid */
    .options-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: auto;
    }

    .option-card {
        background: #0f172a;
        border: 2px solid #334155;
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 16px;
        transition: all 0.15s ease;
    }

    .option-letter {
        font-family: var(--font-mono);
        font-size: 1.3rem;
        font-weight: 800;
        width: 44px;
        height: 44px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1e293b;
        color: #38bdf8;
        border: 1px solid #475569;
        flex-shrink: 0;
    }

    .option-text {
        font-size: 1.25rem;
        font-weight: 600;
        color: #f1f5f9;
        line-height: 1.38;
    }

    /* Teacher Key Reveal (ONLY when toggled via key 'K') */
    body.show-key .option-card.correct {
        border-color: #10b981 !important;
        background: rgba(16, 185, 129, 0.15) !important;
        box-shadow: 0 0 16px rgba(16, 185, 129, 0.3) !important;
    }
    body.show-key .option-card.correct .option-letter {
        background: #059669 !important;
        color: #ffffff !important;
        border-color: #34d399 !important;
    }

    .q-directive-bar {
        margin-top: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
        color: #94a3b8;
        border-top: 1px solid rgba(255,255,255,0.08);
        padding-top: 12px;
    }

    .q-directive-bar b {
        color: #f8fafc;
    }

    /* Intro & Outro Special Slides */
    .intro-slide, .outro-slide {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        gap: 18px;
    }

    .hero-kicker {
        font-family: var(--font-mono);
        font-size: 1.2rem;
        font-weight: 800;
        color: #f87171;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .hero-title {
        font-family: var(--font-heading);
        font-size: 3.6rem;
        font-weight: 900;
        color: #ffffff;
        line-height: 1.18;
    }

    .hero-desc {
        font-size: 1.35rem;
        color: #cbd5e1;
        max-width: 920px;
        line-height: 1.5;
    }

    .hero-points {
        display: flex;
        gap: 20px;
        margin-top: 12px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .hero-point-tag {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 8px 18px;
        font-family: var(--font-mono);
        font-size: 0.95rem;
        font-weight: 700;
        color: #38bdf8;
    }

    .hero-action {
        margin-top: 20px;
        background: rgba(37, 99, 235, 0.2);
        border: 2px dashed #3b82f6;
        color: #93c5fd;
        padding: 14px 34px;
        border-radius: 12px;
        font-family: var(--font-mono);
        font-size: 1.35rem;
        font-weight: 800;
        animation: pulseBorder 1.8s infinite alternate;
        cursor: pointer;
    }

    @keyframes pulseBorder {
        from { transform: scale(1); box-shadow: 0 0 0 rgba(59, 130, 246, 0.2); }
        to { transform: scale(1.02); box-shadow: 0 0 20px rgba(59, 130, 246, 0.4); }
    }

    /* Footer Toolbar */
    footer {
        background: var(--bg-surface);
        border: 1px solid var(--border-card);
        border-radius: 10px;
        padding: 10px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.88rem;
        color: var(--text-muted);
    }

    .nav-hints {
        display: flex;
        align-items: center;
        gap: 16px;
    }

    kbd {
        background: #0f172a;
        border: 1px solid #334155;
        box-shadow: 0 2px 0 rgba(0,0,0,0.3);
        border-radius: 4px;
        padding: 3px 8px;
        font-family: var(--font-mono);
        font-size: 0.8rem;
        font-weight: 800;
        color: #38bdf8;
    }

    .hint-item {
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .warning-badge {
        font-weight: 700;
        color: #f87171;
        display: flex;
        align-items: center;
        gap: 6px;
    }
</style>
</head>
<body>

    <!-- Top Segmented Progress Bar -->
    <div class="progress-strip" id="progressStrip">
        <!-- 10 segments injected by JS -->
    </div>

    <!-- Header Section -->
    <header>
        <div class="header-left">
            <span class="badge-room">Room 8</span>
            <span class="badge-unit">Citizenship 9 • Unit 2</span>
            <span class="header-title">Treaties & Donald Marshall Jr. : 10-Question Quick Quiz</span>
        </div>
        <div class="header-right">
            <div class="counter-badge" id="slideIndicator">INTRO</div>
            <button class="control-btn" id="prevBtn" title="Previous Slide (Left Arrow / Page Up)">
                <span>&larr; Prev</span>
            </button>
            <button class="control-btn" id="nextBtn" title="Next Slide (Right Arrow / Space / Clicker)">
                <span>Next &rarr;</span>
            </button>
            <button class="control-btn" id="keyToggleBtn" title="Teacher Answer Key (Press 'K')">
                <span>🔑 Key</span>
            </button>
            <button class="control-btn" id="blackoutBtn" title="Blank Screen (Press 'B')">
                <span>◼ Blackout</span>
            </button>
            <button class="control-btn" id="fullscreenBtn" title="Toggle Fullscreen (Press 'F')">
                <span>⛶ Fullscreen</span>
            </button>
        </div>
    </header>

    <!-- Main Question Stage -->
    <main id="mainStage">
        <div class="stage-card" id="stageCard">
            <div class="slide-content" id="slideContent">
                <!-- Dynamically rendered slide content -->
            </div>
        </div>
    </main>

    <!-- Footer Controls & Remote Shortcuts -->
    <footer>
        <div class="nav-hints">
            <div class="hint-item"><kbd>Remote / Click</kbd> <span>Next Question</span></div>
            <div class="hint-item"><kbd>&rarr;</kbd> or <kbd>Space</kbd> <span>Advance</span></div>
            <div class="hint-item"><kbd>&larr;</kbd> <span>Back</span></div>
            <div class="hint-item"><kbd>1-0</kbd> <span>Jump Q1-Q10</span></div>
            <div class="hint-item"><kbd>B</kbd> <span>Blackout</span></div>
            <div class="hint-item"><kbd>F</kbd> <span>Fullscreen</span></div>
            <div class="hint-item"><kbd>K</kbd> <span>Teacher Key</span></div>
        </div>
        <div class="nav-hints">
            <span class="warning-badge">🔒 Strictly Student View &bull; Answers Never Revealed</span>
        </div>
    </footer>

<script>
// 10 Core Questions calibrated for Citizenship 9 Unit 2
const QUESTIONS = [
    {
        num: 1,
        topic: "Ancient Migration & Beringia",
        question: "What caused the Beringia land bridge to emerge during the last Ice Age?",
        options: [
            "Massive volcanic eruptions raised the ocean floor",
            "Continental ice sheets trapped ocean water, lowering sea levels roughly 100 metres",
            "Tectonic plates collided and temporarily pushed Siberia into Alaska",
            "Ancient hunters constructed artificial earthen causeways across the strait"
        ],
        correct: 1 // B
    },
    {
        num: 2,
        topic: "The Shattering of Clovis First",
        question: "Why did the 13,600-year-old human remains of 'Eva of Naharon' in Mexico shatter the traditional 'Clovis First' archaeological model?",
        options: [
            "Her remains predated the Clovis timeline and were thousands of miles south before the ice corridor opened",
            "Her DNA proved that humans originated in South America rather than Africa",
            "She was discovered alongside modern iron tools and woven cotton garments",
            "Her burial site proved that humans crossed the Pacific using steamships"
        ],
        correct: 0 // A
    },
    {
        num: 3,
        topic: "Peace & Friendship Treaties (1725–1779)",
        question: "Unlike Western Canadian 'Numbered Treaties', what makes the 1725–1779 Peace and Friendship Treaties unique?",
        options: [
            "The Mi'kmaq agreed to relocate onto reserves in exchange for annual food rations",
            "The British Crown purchased peninsular Nova Scotia using gold bullion",
            "They were temporary 10-year armistices signed during wartime",
            "They established mutual peace and alliances without the Mi'kmaq ever ceding, selling, or surrendering land"
        ],
        correct: 3 // D
    },
    {
        num: 4,
        topic: "Mi'kma'ki & Legal Title",
        question: "When First Nations leaders and Canadian courts declare that Mi'kma'ki is 'unceded territory,' what does this legally mean?",
        options: [
            "The territory was formally conquered and annexed during the Seven Years' War",
            "The territory was legally purchased by Canada at Confederation in 1867",
            "The territory was gifted to European settlers by royal proclamation",
            "The Mi'kmaw nation never signed away, sold, surrendered, or lost sovereign title to their land"
        ],
        correct: 3 // D
    },
    {
        num: 5,
        topic: "1760 Treaty & The Truckhouse Clause",
        question: "Under the 1760 Peace and Friendship Treaty, what was the primary purpose of the 'Truckhouse Clause'?",
        options: [
            "It required Mi'kmaw craftsmen to build wagons for British infantry garrisons",
            "The Crown promised to operate government trading posts where the Mi'kmaq could trade goods for necessaries",
            "It banned Indigenous people from trading with any European or American merchants",
            "It ordered all Mi'kmaw fish catches to be exported directly to Great Britain"
        ],
        correct: 1 // B
    },
    {
        num: 6,
        topic: "Donald Marshall Jr. & The 1971 Conviction",
        question: "What was the landmark finding of the 1989 Royal Commission on the Donald Marshall Jr. Prosecution regarding his 11-year wrongful imprisonment?",
        options: [
            "The wrongful conviction was an isolated procedural mistake by one inexperienced detective",
            "Marshall had accidentally misled investigators by providing inaccurate statements",
            "Systemic racism infected every stage of the justice system—police, prosecutors, judges, and government",
            "Canadian criminal courts operated with complete racial neutrality throughout the 1970s"
        ],
        correct: 2 // C
    },
    {
        num: 7,
        topic: "Gladue Rights & Sentencing Reform",
        question: "Under Canadian criminal law (Criminal Code Section 718.2(e) and R. v. Gladue), what are 'Gladue Rights'?",
        options: [
            "Automatic acquittal for any Indigenous person charged with a summary offence",
            "The legal requirement that sentencing judges consider systemic trauma and all reasonable alternatives to prison for Indigenous offenders",
            "The right to have criminal charges prosecuted exclusively by tribal police",
            "Mandatory minimum sentences for all property offences committed on reserve"
        ],
        correct: 1 // B
    },
    {
        num: 8,
        topic: "The 1993 Eel Catch & Section 35",
        question: "When Donald Marshall Jr. was charged in 1993 for catching and selling 463 lbs of eels without a federal DFO licence, what was his central legal defence?",
        options: [
            "He argued that the federal Fisheries Act only applied in international waters",
            "He claimed he was fishing on a private fish farm outside federal jurisdiction",
            "He stated that he had obtained a verbal permit from a local fisheries officer",
            "He was exercising his constitutionally protected treaty harvesting rights under the 1760 Treaty"
        ],
        correct: 3 // D
    },
    {
        num: 9,
        topic: "1999 Supreme Court Ruling (R. v. Marshall)",
        question: "In the landmark 1999 R. v. Marshall decision, how did the Supreme Court of Canada define a 'moderate livelihood'?",
        options: [
            "An unlimited right to build corporate fishing fleets and harvest industrial factory volumes",
            "Securing basic necessaries (food, clothing, housing, and modest economic security) through harvesting and trade",
            "A guaranteed monthly government salary paid to all registered band members",
            "A temporary exemption from fishing regulations that expired in the year 2000"
        ],
        correct: 1 // B
    },
    {
        num: 10,
        topic: "Civic Duty & 'We Are All Treaty People'",
        question: "What is the foundational civic meaning of the constitutional principle 'We Are All Treaty People'?",
        options: [
            "Every citizen in Nova Scotia must apply for a federal treaty status card",
            "Only Indigenous citizens are bound by the legal agreements made in historical treaties",
            "Non-Indigenous Canadians' legal right to live, work, and govern in Mi'kma'ki originates in the Peace and Friendship Treaty promises",
            "Historical treaties were dissolved when Canada passed the Constitution Act in 1982"
        ],
        correct: 2 // C
    }
];

// Current Slide Index:
// 0 = Intro Slide
// 1..10 = Questions 1..10
// 11 = Outro / Finished Slide
let currentIndex = 0;
const totalSlides = QUESTIONS.length + 1; // 0 to 11

// Build top progress segments
const progressStrip = document.getElementById("progressStrip");
for (let i = 1; i <= 10; i++) {
    const seg = document.createElement("div");
    seg.className = "progress-seg";
    seg.id = `seg-${i}`;
    progressStrip.appendChild(seg);
}

function updateProgress() {
    for (let i = 1; i <= 10; i++) {
        const seg = document.getElementById(`seg-${i}`);
        if (!seg) continue;
        seg.classList.remove("active", "completed");
        if (i < currentIndex) {
            seg.classList.add("completed");
        } else if (i === currentIndex) {
            seg.classList.add("active");
        }
    }
}

function renderSlide() {
    const container = document.getElementById("slideContent");
    const indicator = document.getElementById("slideIndicator");

    if (currentIndex === 0) {
        // Intro Slide
        indicator.textContent = "INTRO";
        container.innerHTML = `
            <div class="intro-slide">
                <div class="hero-kicker">Citizenship 9 • Formative Assessment Sprint</div>
                <h1 class="hero-title">Unit 2 Quick Quiz</h1>
                <p class="hero-desc">
                    Indigenous Peoples, Peace &amp; Friendship Treaties, and Donald Marshall Jr.
                </p>
                <div class="hero-points">
                    <span class="hero-point-tag">10 Core Questions</span>
                    <span class="hero-point-tag">Revealed One at a Time</span>
                    <span class="hero-point-tag">Pencil &amp; Paper / Answer Slip</span>
                    <span class="hero-point-tag">Zero Answers on Screen</span>
                </div>
                <div class="hero-action" id="startBtn">
                    Press [SPACE] or Click to Reveal Question 1 &rarr;
                </div>
            </div>
        `;
        document.getElementById("startBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            nextSlide();
        });
    } else if (currentIndex >= 1 && currentIndex <= 10) {
        // Question Slides
        const qIndex = currentIndex - 1;
        const q = QUESTIONS[qIndex];
        indicator.textContent = `QUESTION ${q.num} / 10`;

        const letters = ['A', 'B', 'C', 'D'];
        let optionsHTML = '';
        q.options.forEach((opt, idx) => {
            const isCorrect = (idx === q.correct);
            optionsHTML += `
                <div class="option-card ${isCorrect ? 'correct' : ''}">
                    <div class="option-letter">${letters[idx]}</div>
                    <div class="option-text">${opt}</div>
                </div>
            `;
        });

        container.innerHTML = `
            <div class="slide-meta-row">
                <div class="topic-pill">Topic: ${q.topic}</div>
                <div class="q-number-kicker">Question ${q.num} of 10</div>
            </div>
            <div class="q-text-container">
                <h2 class="q-text">${q.question}</h2>
            </div>
            <div class="options-grid">
                ${optionsHTML}
            </div>
            <div class="q-directive-bar">
                <span>Select <b>A</b>, <b>B</b>, <b>C</b>, or <b>D</b> on your answer slip.</span>
                <span>Pencils ready &bull; Move forward with Remote / [Space]</span>
            </div>
        `;
    } else {
        // Outro / Finished Slide
        indicator.textContent = "FINISHED";
        container.innerHTML = `
            <div class="outro-slide">
                <div class="hero-kicker">Quiz Complete</div>
                <h1 class="hero-title">All 10 Questions Finished</h1>
                <p class="hero-desc">
                    Pencils down. Double check your question numbers 1 through 10.
                </p>
                <div class="hero-points">
                    <span class="hero-point-tag">Press keys 1–9 or 0 to revisit any question</span>
                    <span class="hero-point-tag">Hand in papers / Prepare for class debrief</span>
                </div>
                <div class="hero-action" id="restartBtn">
                    &larr; Return to Question 1
                </div>
            </div>
        `;
        document.getElementById("restartBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            currentIndex = 1;
            renderSlide();
        });
    }

    updateProgress();
}

function nextSlide() {
    if (currentIndex < totalSlides) {
        currentIndex++;
        renderSlide();
    }
}

function prevSlide() {
    if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
    }
}

function toggleBlackout() {
    document.body.classList.toggle("blackout");
}

function toggleTeacherKey() {
    document.body.classList.toggle("show-key");
    const btn = document.getElementById("keyToggleBtn");
    if (document.body.classList.contains("show-key")) {
        btn.classList.add("btn-active");
    } else {
        btn.classList.remove("btn-active");
    }
}

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
    } else {
        if (document.exitFullscreen) document.exitFullscreen();
    }
}

// Button Listeners
document.getElementById("nextBtn").addEventListener("click", (e) => { e.stopPropagation(); nextSlide(); });
document.getElementById("prevBtn").addEventListener("click", (e) => { e.stopPropagation(); prevSlide(); });
document.getElementById("blackoutBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleBlackout(); });
document.getElementById("fullscreenBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleFullscreen(); });
document.getElementById("keyToggleBtn").addEventListener("click", (e) => { e.stopPropagation(); toggleTeacherKey(); });

// Clicking the stage advances to next question (remote clicker friendly)
document.getElementById("stageCard").addEventListener("click", (e) => {
    // Avoid double trigger if clicking buttons
    if (e.target.closest("button") || e.target.closest(".hero-action")) return;
    nextSlide();
});

// Comprehensive Keyboard Navigation
window.addEventListener("keydown", (e) => {
    // Ignore input if typing in an input element
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    switch (e.key) {
        case "ArrowRight":
        case " ":
        case "PageDown":
        case "Enter":
            e.preventDefault();
            nextSlide();
            break;
        case "ArrowLeft":
        case "PageUp":
        case "Backspace":
            e.preventDefault();
            prevSlide();
            break;
        case "Home":
            e.preventDefault();
            currentIndex = 0;
            renderSlide();
            break;
        case "End":
            e.preventDefault();
            currentIndex = totalSlides;
            renderSlide();
            break;
        case "b":
        case "B":
        case ".":
            e.preventDefault();
            toggleBlackout();
            break;
        case "f":
        case "F":
            e.preventDefault();
            toggleFullscreen();
            break;
        case "k":
        case "K":
            e.preventDefault();
            toggleTeacherKey();
            break;
        // Jump direct to numbers 1..9 and 0 (for 10)
        case "1": case "2": case "3": case "4": case "5":
        case "6": case "7": case "8": case "9":
            e.preventDefault();
            currentIndex = parseInt(e.key, 10);
            renderSlide();
            break;
        case "0":
            e.preventDefault();
            currentIndex = 10;
            renderSlide();
            break;
    }
});

// Initial Render
renderSlide();
</script>
</body>
</html>
