        { id: 'math_gap_hourly', type: 'number', step: '0.01', label: '1 · The Hourly Divide — target wage minus minimum wage', hint: '<b>How:</b> 37.27 − 16.75 = … <b>Why it matters:</b> this one number is the size of the whole problem. It is exactly what councillors and MLAs argue about: whose job is it to close the gap?' },
        { id: 'math_gap_compromises', type: 'textarea', label: '2 · Personal Reality — picture life at 25 in HRM: what trade-offs get you through the month?', hint: '<b>How:</b> think about roommates, commutes, second jobs, and what you would go without. Name the trade-offs and say what you would give up. <b>Why it matters:</b> this is what the rent math feels like in real life — and a Council speech that shows the human side, not just the numbers, is much harder to ignore.', rows: 3 },

          '<div class="src">SOURCE: HRM Zoning Amendment, Jun 13 2024</div></div></div>' },
        { id: 'evidence_most_shocking', type: 'select', label: 'Which of these four facts is most alarming? Pick one.',

  function buildNumbeo() {
    const mount = document.getElementById('numbeoMount');
    if (!mount || mount.dataset.built) return;
    mount.dataset.built = '1';
    let rows = '';
    NUMBEO_ROWS.forEach((r, i) => {
      const n = i + 1;
      const isPreset = !!r.item;
      rows += '<tr>' +
        '<td class="item-cell">' +
          (isPreset
            ? '<b>' + n + '.</b> ' + r.item + '<div class="src">' + r.city + '</div>'
            : '<input type="text" class="nb_item" data-n="' + n + '" placeholder="Surprise item ' + n + '">' +
              '<input type="text" class="nb_city" data-n="' + n + '" placeholder="Comparison city" style="margin-top:4px">') +
        '</td>' +
        '<td><input type="number" step="0.01" class="nb_hfx" data-n="' + n + '" placeholder="CAD"></td>' +
        '<td><input type="number" step="0.01" class="nb_comp" data-n="' + n + '" placeholder="CAD"></td>' +
        '<td class="pct" id="nbpct_' + n + '">—</td></tr>';
    });
    mount.innerHTML =
      '<table class="matrix"><tr><th>Item</th><th style="width:130px">Halifax (CAD)</th>' +
      '<th style="width:130px">City (CAD)</th><th style="width:180px">% difference</th></tr>' + rows + '</table>' +
      '<p class="hint" style="margin-top:6px; font-size:0.84rem;">% difference = (Halifax − City) ÷ City × 100. Positive = Halifax costs more.</p>';
    mount.addEventListener('input', function (ev) {
      if (!ev.target.classList.contains('nb_hfx') && !ev.target.classList.contains('nb_comp')) return;
      calcRow(ev.target.dataset.n);
      updatePPPButton();
    });
  }
  function numbeoRow(n) {
    const hfx  = parseFloat((document.querySelector('.nb_hfx[data-n="'  + n + '"]') || {}).value);
    const comp = parseFloat((document.querySelector('.nb_comp[data-n="' + n + '"]') || {}).value);
    const item = (document.querySelector('.nb_item[data-n="' + n + '"]') || {}).value || NUMBEO_ROWS[n-1].item;
    const city = (document.querySelector('.nb_city[data-n="' + n + '"]') || {}).value || NUMBEO_ROWS[n-1].city;
    // The autosave baseline collect runs BEFORE buildNumbeo() fills the table — tolerate missing cells.
    const pctEl = document.getElementById('nbpct_' + n);
    const pct  = pctEl ? pctEl.textContent : '—';
    return { row: Number(n), item: item, city: city,
             halifax_price: isNaN(hfx) ? '' : hfx,
             city_price:    isNaN(comp) ? '' : comp,
             pct_difference: pct };
  }
  function calcRow(n) {
    const hfx  = parseFloat((document.querySelector('.nb_hfx[data-n="'  + n + '"]') || {}).value);
    const comp = parseFloat((document.querySelector('.nb_comp[data-n="' + n + '"]') || {}).value);
    const out  = document.getElementById('nbpct_' + n);
    if (!out) return;
    if (isNaN(hfx) || isNaN(comp) || comp === 0) { out.textContent = '—'; return; }
    const pct = ((hfx - comp) / comp) * 100;
    out.textContent = pct > 0 ? 'Halifax is ' + pct.toFixed(0) + '% higher'
                    : pct < 0 ? 'Halifax is ' + Math.abs(pct).toFixed(0) + '% lower'
                              : 'Same price (0% diff)';
  }
  function computePPP() {
    const meal         = parseFloat((document.querySelector('.nb_hfx[data-n="1"]')  || {}).value);
    const salary       = parseFloat(document.getElementById('r8f_ppp_hfx_annual_salary').value);
    const delhiMonthly = parseFloat((document.querySelector('.nb_comp[data-n="7"]') || {}).value);
    if (isNaN(meal) || isNaN(salary) || isNaN(delhiMonthly) || meal <= 0 || salary <= 0 || delhiMonthly <= 0) return;
    document.getElementById('r8f_ppp_hfx_hours').value   = (meal / (salary / 2000)).toFixed(2);
    document.getElementById('r8f_ppp_delhi_hours').value = (meal / ((delhiMonthly * 12) / 2000)).toFixed(2);
  }

  }

  function checkAndImportLegacyData(idEmail) {
    if (!idEmail) return;
    const statusEl = document.querySelector('.r8-status');
    if (statusEl) statusEl.textContent = 'Checking for previously completed dossier answers…';

    fetch(LEGACY_GAS_URL + '?action=get_class_progress&className=ALL&cache=0')
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data || data.status !== 'success' || !Array.isArray(data.students)) return;
        const normEmail = idEmail.trim().toLowerCase();
        const normUser = normEmail.split('@')[0];

        const student = data.students.find(function (s) {
          const sEmail = String(s.email || '').trim().toLowerCase();
          return sEmail === normEmail || (normUser && sEmail.startsWith(normUser));
        });

        if (!student) return;
        const saved = student.savedData || {};
        const tasks = saved._tasks || {};
        let targetData = null;
        for (const k in tasks) {
          if (k.indexOf('Rent We Pay') !== -1 && tasks[k]) {
            targetData = tasks[k].data || tasks[k];
          }
        }
        if (!targetData && String(student.task || '').indexOf('Rent We Pay') !== -1) {
          targetData = saved;
        }

        if (!targetData) return;

        let restoredCount = 0;

        function setIfEmpty(id, val) {
          if (val === undefined || val === null || val === '') return;
          const el = document.getElementById(id);
          if (el && !el.value) {
            el.value = val;
            restoredCount++;
          }
        }

        function setRadioIfEmpty(name, val) {
          if (!val) return;
          const checked = document.querySelector('input[name="' + name + '"]:checked');
          if (!checked) {
            const r = document.querySelector('input[name="' + name + '"][value*="' + val + '"]');
            if (r) { r.checked = true; restoredCount++; }
          }
        }

        // 1A Rent math
        if (targetData.rent_math) {
          const rm = targetData.rent_math;
          setIfEmpty('r8f_math_hours_rent', rm.hours_for_rent);
          setIfEmpty('r8f_math_pct_rent', rm.pct_of_pay);
          setIfEmpty('r8f_math_wage_needed', rm.wage_needed);
          setIfEmpty('r8f_math_gap_hourly', rm.gap_hourly);
          setIfEmpty('r8f_math_gap_compromises', rm.gap_compromises);
          setIfEmpty('r8f_math_gap_structural', rm.gap_structural);
        }

        // 1B Evidence
        if (targetData.evidence) {
          const ev = targetData.evidence;
          setIfEmpty('r8f_evidence_system_link', ev.system_link);
          if (ev.most_shocking) {
            const sel = document.getElementById('r8f_evidence_most_shocking');
            if (sel && !sel.value) {
              for (let i = 0; i < sel.options.length; i++) {
                if (sel.options[i].value.indexOf(ev.most_shocking) !== -1 || ev.most_shocking.indexOf(sel.options[i].value) !== -1) {
                  sel.selectedIndex = i;
                  restoredCount++;
                  break;
                }
              }
            }
          }
        }

        // 1C Dilemma
        if (targetData.dilemma) {
          const dil = targetData.dilemma;
          setRadioIfEmpty('r8f_dilemma_position', dil.position);
          setIfEmpty('r8f_dilemma_justification', dil.justification);
          setIfEmpty('r8f_dilemma_counter_tradeoff', dil.counter_tradeoff);
        }

        // 2A Numbeo
        if (Array.isArray(targetData.global_numbeo)) {
          targetData.global_numbeo.forEach(function (r) {
            const n = r.row;
            if (!n) return;
            const hfx = document.querySelector('.nb_hfx[data-n="' + n + '"]');
            const comp = document.querySelector('.nb_comp[data-n="' + n + '"]');
            const hVal = r.halifax_price !== undefined ? r.halifax_price : r.halifax;
            const cVal = r.city_price !== undefined ? r.city_price : r.price;
            if (hfx && !hfx.value && hVal !== '' && hVal !== undefined) {

            }
            if (comp && !comp.value && cVal !== '' && cVal !== undefined) {
              comp.value = cVal; restoredCount++;

            calcRow(n);
            const item = document.querySelector('.nb_item[data-n="' + n + '"]');
            const city = document.querySelector('.nb_city[data-n="' + n + '"]');
            if (item && !item.value && r.item) { item.value = r.item; }
            if (city && !city.value && r.city) { city.value = r.city; }
          });
        }

        // 2B PPP
        if (targetData.ppp) {
          const p = targetData.ppp;
          setIfEmpty('r8f_ppp_career_name', p.career);
          setIfEmpty('r8f_ppp_hfx_annual_salary', p.annual_salary);
          setIfEmpty('r8f_ppp_hfx_hours', p.hfx_hours);
          setIfEmpty('r8f_ppp_delhi_hours', p.delhi_hours);
          setIfEmpty('r8f_ppp_analysis_reflection', p.analysis);
        }

        // 3A Power Map
        if (targetData.power_map) {
          const pm = targetData.power_map;
          setIfEmpty('r8f_power_city_ask', pm.city_ask);
          setIfEmpty('r8f_power_prov_ask', pm.prov_ask);
          setIfEmpty('r8f_power_fed_ask', pm.fed_ask);
          setRadioIfEmpty('r8f_power_target_level', pm.target_level);
          setIfEmpty('r8f_power_one_question', pm.one_question);
        }

        // 3B Deputation
        if (targetData.deputation) {
          const dep = targetData.deputation;
          setIfEmpty('r8f_dep_starter_1', dep.starter_1);
          setIfEmpty('r8f_dep_starter_2', dep.starter_2);
          setIfEmpty('r8f_dep_starter_3', dep.starter_3);
          setIfEmpty('r8f_dep_starter_4', dep.starter_4);
          setIfEmpty('r8f_dep_starter_5', dep.starter_5);
        }

        // 3C Fast Finisher
        if (targetData.fast_finisher) {
          const ff = targetData.fast_finisher;
          setIfEmpty('r8f_ff_response', ff.response);
          if (ff.topic) {
            const sel = document.getElementById('r8f_ff_selected_topic');
            if (sel && !sel.value) {
              for (let i = 0; i < sel.options.length; i++) {
                if (sel.options[i].value.toLowerCase().indexOf(ff.topic.toLowerCase()) !== -1) {
                  sel.selectedIndex = i;
                  restoredCount++;
                  break;
                }
              }
            }
          }
        }

        // 4 Signature
        setIfEmpty('r8f_docSignature', targetData.signature);

        updatePPPButton();

        if (restoredCount > 0) {
          if (statusEl) {
            statusEl.textContent = 'Restored ' + restoredCount + ' answers from your previous dossier! Autosaving to GAS…';
            statusEl.className = 'r8-status ok';
          }
          if (api && api.autosave) {
            api.autosave().saveNow().then(function () {
              if (api.verify) api.verify(false);
            });
          }
        } else {
          if (statusEl && statusEl.textContent.indexOf('Checking') !== -1) statusEl.textContent = '';
        }
      })
      .catch(function (err) {
        console.warn('Could not check legacy Numbeo data:', err);
      });
  }

  Room8.onIdentity(function (id) {
    setTimeout(function () {
      checkAndImportLegacyData(id.email);
    }, 700);
  });
</script>
</body>
</html>
