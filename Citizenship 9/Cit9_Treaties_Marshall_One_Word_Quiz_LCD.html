<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citizenship 9 : Treaties &amp; Donald Marshall Jr. : 10-Question LCD Reveal Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
    /* Strongly Typed Design Tokens - Room 8 Classroom LCD Standard */
    :root {
        --bg-page: #f0f2f5;          /* Warm light paper */
        --bg-surface: #ffffff;       /* Pure white panels */
        --bg-card: #ffffff;
        --bg-card-hover: #f8fafc;

        --border-card: #d5dbe3;
        --border-subtle: #e5e9f0;
        --border-highlight: #ed786a;

        --text-main: #1e2530;
        --text-heading: #181f2b;
        --text-muted: #475569;
        --text-dim: #64748b;

        --coral: #ed786a;
        --coral-hover: #fd887a;
        --coral-dark: #d65b4c;
        --coral-bg: #fff1f0;
        --coral-border: #fecdd3;

        --blue: #1d4ed8;
        --blue-bg: #eff6ff;
        --blue-border: #bfdbfe;

        --emerald: #15803d;
        --emerald-bg: #dcfce7;
        --emerald-border: #86efac;

        --amber: #b45309;
        --amber-bg: #fef3c7;
        --amber-border: #fde68a;

        --purple: #6d28d9;
        --purple-bg: #f5f3ff;
        --purple-border: #ddd6fe;

        --font-heading: 'Arvo', Georgia, serif;
        --font-body: 'Source Sans 3', 'Source Sans Pro', -apple-system, sans-serif;
        --font-mono: 'JetBrains Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
        height: 100vh;
        width: 100vw;
        overflow: hidden;
        background-color: var(--bg-page);
        color: var(--text-main);
        font-family: var(--font-body);
        user-select: none;
    }

    body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 14px 22px;
        transition: background-color 0.2s ease;
    }

    /* Black screen blackout mode (B key) */
    body.blackout {
        background-color: #000000 !important;
    }

    body.blackout * {
        visibility: hidden !important;
    }

    /* Top Progress Bar Segment Strip */
    .progress-strip {
        display: grid;
        grid-template-columns: repeat(10, 1fr);
        gap: 6px;
        width: 100%;
        margin-bottom: 8px;
    }

    .progress-seg {
        height: 7px;
        background: #cbd5e1;
        border-radius: 4px;
        transition: all 0.25s ease;
        cursor: pointer;
    }

    .progress-seg:hover {
        opacity: 0.85;
    }

    .progress-seg.active {
        background: var(--coral);
        box-shadow: 0 0 10px rgba(237, 120, 106, 0.7);
        transform: scaleY(1.2);
    }

    .progress-seg.completed {
        background: var(--blue);
    }

    /* Header Bar */
    header {
        background: var(--bg-surface);
        border: 1px solid var(--border-card);
        border-radius: 10px;
        padding: 10px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        cursor: default;
    }

    .header-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .badge-room {
        background: var(--coral);
        color: #ffffff;
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.82rem;
        padding: 4px 10px;
        border-radius: 4px;
        letter-spacing: 0.5px;
        text-transform: uppercase;
    }

    .badge-unit {
        background: var(--blue-bg);
        color: var(--blue);
        border: 1px solid var(--blue-border);
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 0.8rem;
        padding: 4px 10px;
        border-radius: 4px;
    }

    .header-title {
        font-family: var(--font-heading);
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-heading);
        text-shadow: 0.04em 0.06em 0 rgba(0, 0, 0, 0.05);
    }

    .header-right {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .counter-badge {
        font-family: var(--font-mono);
        font-size: 1.05rem;
        font-weight: 800;
        background: var(--bg-page);
        color: var(--text-heading);
        border: 1px solid var(--border-card);
        padding: 4px 14px;
        border-radius: 6px;
        letter-spacing: 0.5px;
    }

    .control-btn {
        background: var(--bg-surface);
        border: 1px solid var(--border-card);
        border-radius: 6px;
        padding: 6px 12px;
        font-family: var(--font-body);
        font-weight: 700;
        font-size: 0.85rem;
        color: var(--text-muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.15s ease;
    }

    .control-btn:hover {
        border-color: var(--coral);
        color: var(--coral-dark);
        background: var(--bg-card-hover);
    }

    .control-btn.active-mode {
        background: var(--blue-bg);
        color: var(--blue);
        border-color: var(--blue-border);
    }

    /* Main Slide Stage */
    main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px 0;
        position: relative;
    }

    .stage-card {
        background: var(--bg-surface);
        border: 2px solid var(--border-card);
        border-radius: 16px;
        width: 100%;
        max-width: 1420px;
        height: 100%;
        max-height: 700px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px 52px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06);
        position: relative;
        overflow: hidden;
        cursor: pointer;
    }

    /* Strongly Typed signature top gradient rule */
    .stage-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 6px;
        background: linear-gradient(90deg, var(--coral), var(--blue));
    }

    .slide-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        animation: fadeInSlide 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInSlide {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .topic-pill {
        display: inline-flex;
        align-items: center;
        align-self: flex-start;
        gap: 8px;
        background: var(--coral-bg);
        color: var(--coral-dark);
        border: 1px solid var(--coral-border);
        font-family: var(--font-mono);
        font-weight: 800;
        font-size: 0.95rem;
        padding: 5px 14px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        margin-bottom: 20px;
    }

    .q-number-kicker {
        font-family: var(--font-mono);
        font-size: 1.4rem;
        font-weight: 800;
        color: var(--blue);
        letter-spacing: 1px;
        margin-bottom: 16px;
        text-transform: uppercase;
    }

    .q-text {
        font-family: var(--font-heading);
        font-size: 2.85rem;
        font-weight: 700;
        color: var(--text-heading);
        line-height: 1.35;
        letter-spacing: -0.3px;
        text-shadow: 0.03em 0.04em 0 rgba(0, 0, 0, 0.05);
        max-width: 1260px;
        margin-bottom: 24px;
    }

    .q-directive {
        margin-top: 10px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-size: 1.15rem;
        font-weight: 700;
        color: var(--text-muted);
        background: #f8fafc;
        border: 1px solid var(--border-subtle);
        padding: 8px 18px;
        border-radius: 8px;
        align-self: flex-start;
    }

    .q-directive strong {
        color: var(--coral-dark);
        font-family: var(--font-mono);
    }

    .advance-hint {
        margin-top: 28px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 0.88rem;
        color: var(--text-dim);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .advance-hint span {
        color: var(--coral);
    }

    /* Intro Slide */
    .intro-slide {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        gap: 18px;
    }

    .hero-kicker {
        font-family: var(--font-mono);
        font-size: 1.15rem;
        font-weight: 800;
        color: var(--coral);
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .hero-title {
        font-family: var(--font-heading);
        font-size: 3.6rem;
        font-weight: 700;
        color: var(--text-heading);
        line-height: 1.2;
        text-shadow: 0.04em 0.06em 0 rgba(0, 0, 0, 0.06);
    }

    .hero-desc {
        font-size: 1.35rem;
        color: var(--text-muted);
        max-width: 860px;
        line-height: 1.5;
    }

    .hero-points {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin: 8px 0;
    }

    .hero-point-tag {
        background: var(--bg-page);
        border: 1px solid var(--border-card);
        color: var(--text-heading);
        font-family: var(--font-mono);
        font-size: 0.92rem;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 6px;
    }

    .hero-action {
        margin-top: 14px;
        background: var(--blue-bg);
        border: 2px dashed var(--blue);
        color: var(--blue);
        padding: 14px 32px;
        border-radius: 12px;
        font-family: var(--font-mono);
        font-size: 1.25rem;
        font-weight: 800;
        animation: pulseBorder 1.8s infinite alternate;
        cursor: pointer;
    }

    @keyframes pulseBorder {
        from { transform: scale(1); box-shadow: 0 0 0 rgba(29, 78, 216, 0.1); }
        to { transform: scale(1.02); box-shadow: 0 0 16px rgba(29, 78, 216, 0.25); }
    }

    /* Outro Slide */
    .outro-slide {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100%;
        gap: 18px;
    }

    /* Question Board / Grid View */
    .grid-view-container {
        display: flex;
        flex-direction: column;
        height: 100%;
        gap: 16px;
    }

    .grid-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--border-subtle);
        padding-bottom: 12px;
    }

    .grid-title {
        font-family: var(--font-heading);
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--text-heading);
    }

    .grid-instruction {
        font-family: var(--font-mono);
        font-size: 0.95rem;
        color: var(--coral-dark);
        font-weight: 700;
    }

    .questions-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        grid-gap: 14px;
        flex: 1;
        align-content: stretch;
    }

    .grid-card {
        background: #ffffff;
        border: 2px solid var(--border-card);
        border-radius: 10px;
        padding: 16px 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: all 0.2s ease;
        cursor: pointer;
        position: relative;
    }

    .grid-card:hover {
        border-color: var(--coral);
        transform: translateY(-3px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        background: var(--coral-bg);
    }

    .grid-card.viewed {
        border-color: var(--blue-border);
        background: var(--blue-bg);
    }

    .grid-card-num {
        font-family: var(--font-mono);
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--coral-dark);
    }

    .grid-card.viewed .grid-card-num {
        color: var(--blue);
    }

    .grid-card-topic {
        font-family: var(--font-body);
        font-size: 0.92rem;
        font-weight: 700;
        color: var(--text-heading);
        line-height: 1.3;
        margin: 8px 0;
    }

    .grid-card-badge {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
        align-self: flex-start;
    }

    /* Footer Toolbar */
    footer {
        background: var(--bg-surface);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        padding: 8px 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        color: var(--text-muted);
        cursor: default;
    }

    .nav-hints {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    kbd {
        background: var(--bg-page);
        border: 1px solid var(--border-card);
        box-shadow: 0 1px 0 rgba(0,0,0,0.1);
        border-radius: 4px;
        padding: 2px 7px;
        font-family: var(--font-mono);
        font-size: 0.78rem;
        font-weight: 700;
        color: var(--text-heading);
    }

    .hint-item {
        display: flex;
        align-items: center;
        gap: 5px;
    }
</style>
</head>
<body>

    <!-- Top Segmented Progress Bar -->
    <div class="progress-strip" id="progressStrip" title="Click any segment to jump">
        <!-- 10 segments injected by JS -->
    </div>

    <!-- Header Section -->
    <header>
        <div class="header-left">
            <span class="badge-room">Room 8</span>
            <span class="badge-unit">Citizenship 9 &bull; Unit 2</span>
            <span class="header-title">Treaties &amp; Donald Marshall Jr. : 10-Question Quick Quiz</span>
        </div>
        <div class="header-right">
            <div class="counter-badge" id="slideIndicator">READY TO START</div>
            <button class="control-btn" id="gridToggleBtn" title="Question Board / Grid View (G)">
                <span>&#9638; Question Board</span>
            </button>
            <button class="control-btn" id="prevBtn" title="Previous Question (Left Arrow / Page Up)">
                <span>&larr; Prev</span>
            </button>
            <button class="control-btn" id="nextBtn" title="Next Question (Right Arrow / Space / Remote)">
                <span>Next &rarr;</span>
            </button>
            <button class="control-btn" id="fullscreenBtn" title="Fullscreen (F)">
                <span>Fullscreen</span>
            </button>
        </div>
    </header>

    <!-- Main Question Stage -->
    <main id="mainStage">
        <div class="stage-card" id="stageCard">
            <div class="slide-content" id="slideContent">
                <!-- Dynamically rendered slide content -->
            </div>
        </div>
    </main>

    <!-- Footer Controls & Remote Shortcuts -->
    <footer>
        <div class="nav-hints">
            <div class="hint-item"><kbd>Remote / Click</kbd> <span>Next Question</span></div>
            <div class="hint-item"><kbd>&rarr;</kbd> or <kbd>Space</kbd> <span>Advance</span></div>
            <div class="hint-item"><kbd>&larr;</kbd> <span>Back</span></div>
            <div class="hint-item"><kbd>1-0</kbd> <span>Jump Q1-Q10</span></div>
            <div class="hint-item"><kbd>G</kbd> <span>Board Grid</span></div>
            <div class="hint-item"><kbd>B</kbd> <span>Blackout</span></div>
            <div class="hint-item"><kbd>F</kbd> <span>Fullscreen</span></div>
        </div>
        <div class="nav-hints">
            <span style="font-weight: 700; color: var(--coral-dark); font-family: var(--font-mono);">
                Strictly Student View &bull; Zero Answers on Screen
            </span>
        </div>
    </footer>

<script>
// Quiz Question Data - Exactly 10 questions, NO answers
// Properly escaped strings and clean topic mappings
const QUESTIONS = [
    {
        num: 1,
        topic: "Deep Time & Ice Age Migrations",
        question: "What exposed tundra plain connected Siberia and Alaska during the last Ice Age?",
        directive: "Write your answer on Line 1 (1 to 3 words)"
    },
    {
        num: 2,
        topic: "Archaeology & Early Discoveries",
        question: "What 13,600-year-old skeletal discovery in Mexico challenged the traditional \"Clovis First\" model?",
        directive: "Write your answer on Line 2 (1 to 3 words)"
    },
    {
        num: 3,
        topic: "Coastal Routes & Marine Ecosystems",
        question: "What Pacific coastal boat migration route relied on rich marine kelp forest ecosystems?",
        directive: "Write your answer on Line 3 (1 to 3 words)"
    },
    {
        num: 4,
        topic: "Indigenous Territory & Unceded Homeland",
        question: "What is the traditional, unsurrendered homeland of the Mi'kmaw nation called?",
        directive: "Write your answer on Line 4 (1 to 3 words)"
    },
    {
        num: 5,
        topic: "Treaty Covenants & Historical Alliances",
        question: "What specific type of treaties were signed between the British Crown and the Mi'kmaq from 1725 to 1779?",
        directive: "Write your answer on Line 5 (1 to 3 words)"
    },
    {
        num: 6,
        topic: "Systemic Injustice & 1971 Conviction",
        question: "How many years was Donald Marshall Jr. wrongfully imprisoned in federal maximum-security penitentiaries?",
        directive: "Write your answer on Line 6 (1 to 3 words)"
    },
    {
        num: 7,
        topic: "Sentencing Reform & Criminal Law",
        question: "What legal principles require sentencing judges to consider systemic trauma and alternatives to prison?",
        directive: "Write your answer on Line 7 (1 to 3 words)"
    },
    {
        num: 8,
        topic: "Constitutional Defense & 1993 Harvesting",
        question: "What marine species did Donald Marshall Jr. catch in Pomquet Harbour in August 1993?",
        directive: "Write your answer on Line 8 (1 to 3 words)"
    },
    {
        num: 9,
        topic: "Supreme Court Precedent & R. v. Marshall",
        question: "What standard did the Supreme Court define as securing modern basic amenities rather than corporate wealth?",
        directive: "Write your answer on Line 9 (1 to 3 words)"
    },
    {
        num: 10,
        topic: "1760 Treaty Promises & Crown Obligations",
        question: "What government-operated trading posts were promised by the Crown in the 1760 Treaty?",
        directive: "Write your answer on Line 10 (1 to 3 words)"
    }
];

// Navigation State
// currentIndex:
// -1 = Question Board Grid View
//  0 = Intro Slide
//  1..10 = Question Slides
// 11 = Finished Slide
let currentIndex = 0;
let previousIndexBeforeGrid = 0;
const viewedQuestions = new Set();

// Build top progress segments
const progressStrip = document.getElementById("progressStrip");
for (let i = 1; i <= 10; i++) {
    const seg = document.createElement("div");
    seg.className = "progress-seg";
    seg.id = `seg-${i}`;
    seg.title = `Jump to Question ${i}`;
    seg.addEventListener("click", (e) => {
        e.stopPropagation();
        goToQuestion(i);
    });
    progressStrip.appendChild(seg);
}

function updateProgress() {
    for (let i = 1; i <= 10; i++) {
        const seg = document.getElementById(`seg-${i}`);
        if (!seg) continue;
        seg.classList.remove("active", "completed");
        if (viewedQuestions.has(i) && i !== currentIndex) {
            seg.classList.add("completed");
        }
        if (i === currentIndex) {
            seg.classList.add("active");
        }
    }
}

function renderSlide() {
    const container = document.getElementById("slideContent");
    const indicator = document.getElementById("slideIndicator");
    const gridBtn = document.getElementById("gridToggleBtn");

    if (currentIndex === -1) {
        // Question Board / Grid View
        indicator.textContent = "QUESTION BOARD";
        gridBtn.classList.add("active-mode");
        gridBtn.innerHTML = "<span>&times; Close Board</span>";

        let cardsHtml = "";
        QUESTIONS.forEach(q => {
            const isViewed = viewedQuestions.has(q.num);
            cardsHtml += `
                <div class="grid-card ${isViewed ? 'viewed' : ''}" onclick="goToQuestion(${q.num})">
                    <div class="grid-card-num">QUESTION ${q.num}</div>
                    <div class="grid-card-topic">${q.topic}</div>
                    <div class="grid-card-badge">${isViewed ? '&#10003; Viewed' : 'Click to Reveal'}</div>
                </div>
            `;
        });

        container.innerHTML = `
            <div class="grid-view-container">
                <div class="grid-header">
                    <div class="grid-title">10-Question Quick Reveal Board</div>
                    <div class="grid-instruction">Click any question card to reveal on the projector</div>
                </div>
                <div class="questions-grid">
                    ${cardsHtml}
                </div>
            </div>
        `;
    } else if (currentIndex === 0) {
        // Intro Slide
        indicator.textContent = "READY TO START";
        gridBtn.classList.remove("active-mode");
        gridBtn.innerHTML = "<span>&#9638; Question Board</span>";

        container.innerHTML = `
            <div class="intro-slide">
                <div class="hero-kicker">Room 8 &bull; Citizenship 9</div>
                <h1 class="hero-title">Treaties &amp; Marshall Case Sprint</h1>
                <p class="hero-desc">
                    10 core formative questions covering Ice Age migrations, Peace &amp; Friendship Treaties, and Donald Marshall Jr. Write 1 to 3 words per line on your answer slip.
                </p>
                <div class="hero-points">
                    <span class="hero-point-tag">10 Core Questions</span>
                    <span class="hero-point-tag">Revealed 1-by-1 on LCD</span>
                    <span class="hero-point-tag">Paper &amp; Pencil Slip</span>
                    <span class="hero-point-tag">Zero Answers on Screen</span>
                </div>
                <div class="hero-action" id="startHeroBtn">
                    CLICK ANYWHERE OR PRESS REMOTE / SPACE TO REVEAL QUESTION 1 &rarr;
                </div>
            </div>
        `;

        document.getElementById("startHeroBtn").addEventListener("click", (e) => {
            e.stopPropagation();
            nextSlide();
        });
    } else if (currentIndex >= 1 && currentIndex <= 10) {
        // Question Slides
        const q = QUESTIONS[currentIndex - 1];
        viewedQuestions.add(currentIndex);
        indicator.textContent = `QUESTION ${currentIndex} OF 10`;
        gridBtn.classList.remove("active-mode");
        gridBtn.innerHTML = "<span>&#9638; Question Board</span>";

        container.innerHTML = `
            <div>
                <div class="topic-pill">${q.topic}</div>
                <div class="q-number-kicker">QUESTION ${q.num} OF 10</div>
                <h2 class="q-text">${q.question}</h2>
                <div class="q-directive">
                    <span>Instructions:</span>
                    <strong>${q.directive}</strong>
                </div>
            </div>
            <div class="advance-hint">
                <span>[Click / Remote / Space]</span> &bull; Advance to Question ${currentIndex === 10 ? 'Finish' : currentIndex + 1} &rarr;
            </div>
        `;
    } else {
        // Finished Outro Slide
        indicator.textContent = "FINISHED";
        gridBtn.classList.remove("active-mode");
        gridBtn.innerHTML = "<span>&#9638; Question Board</span>";

        container.innerHTML = `
            <div class="outro-slide">
                <div class="hero-kicker">Sprint Complete</div>
                <h1 class="hero-title">All 10 Questions Finished</h1>
                <p class="hero-desc">
                    Pencils down. Review your answers, write your name and class on your slip, and pass it forward.
                </p>
                <div class="hero-action" style="border-color: var(--emerald); color: var(--emerald); background: var(--emerald-bg);" onclick="goToQuestion(1)">
                    &#8635; RESTART FROM QUESTION 1
                </div>
            </div>
        `;
    }

    updateProgress();
}

function nextSlide() {
    if (currentIndex === -1) {
        currentIndex = (previousIndexBeforeGrid >= 1 && previousIndexBeforeGrid <= 10) ? previousIndexBeforeGrid : 1;
        renderSlide();
        return;
    }
    if (currentIndex < 11) {
        currentIndex++;
        renderSlide();
    }
}

function prevSlide() {
    if (currentIndex === -1) {
        currentIndex = (previousIndexBeforeGrid >= 1 && previousIndexBeforeGrid <= 10) ? previousIndexBeforeGrid : 1;
        renderSlide();
        return;
    }
    if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
    }
}

function goToQuestion(num) {
    if (num >= 1 && num <= 10) {
        currentIndex = num;
        renderSlide();
    }
}

function toggleGridView() {
    if (currentIndex === -1) {
        currentIndex = (previousIndexBeforeGrid >= 0 && previousIndexBeforeGrid <= 11) ? previousIndexBeforeGrid : 1;
    } else {
        previousIndexBeforeGrid = currentIndex;
        currentIndex = -1;
    }
    renderSlide();
}

// Stage Click advances slide (when not in grid mode)
document.getElementById("stageCard").addEventListener("click", (e) => {
    if (currentIndex === -1) {
        // In grid view, click on cards handles navigation directly
        return;
    }
    nextSlide();
});

// Top control buttons
document.getElementById("prevBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    prevSlide();
});

document.getElementById("nextBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    nextSlide();
});

document.getElementById("gridToggleBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleGridView();
});

document.getElementById("fullscreenBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleFullscreen();
});

function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            console.log("Fullscreen request error:", err);
        });
    } else {
        if (document.exitFullscreen) {
            document.exitFullscreen();
        }
    }
}

// Keyboard navigation
document.addEventListener("keydown", (e) => {
    // Blackout toggle
    if (e.key === "b" || e.key === "B") {
        document.body.classList.toggle("blackout");
        return;
    }

    // Ignore other keys during blackout
    if (document.body.classList.contains("blackout")) {
        return;
    }

    // Fullscreen toggle
    if (e.key === "f" || e.key === "F") {
        toggleFullscreen();
        return;
    }

    // Grid toggle
    if (e.key === "g" || e.key === "G") {
        toggleGridView();
        return;
    }

    // Navigation keys
    if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown" || e.key === "Enter") {
        e.preventDefault();
        nextSlide();
    } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        prevSlide();
    } else if (e.key === "Home") {
        e.preventDefault();
        currentIndex = 0;
        renderSlide();
    } else if (e.key === "End") {
        e.preventDefault();
        currentIndex = 11;
        renderSlide();
    } else if (e.key >= "1" && e.key <= "9") {
        goToQuestion(parseInt(e.key, 10));
    } else if (e.key === "0") {
        goToQuestion(10);
    }
});

// Initial slide render
renderSlide();
</script>
</body>
</html>
