<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Trolley Problem — a rail track splitting into two branches">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- track: main line splits into two branches -->
  <g stroke="#475569" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M120 430 H560"/>
    <path d="M560 430 C 700 430, 700 300, 860 300"/>
    <path d="M560 430 C 700 430, 700 545, 860 545"/>
  </g>
  <g stroke="#1e293b" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M120 400 H556"/>
    <path d="M560 400 C 700 400, 700 270, 862 270"/>
    <path d="M560 400 C 700 400, 700 515, 862 515"/>
  </g>

  <!-- sleepers -->
  <g stroke="#334155" stroke-width="4" stroke-linecap="round">
    <path d="M150 395 V435"/><path d="M210 395 V435"/><path d="M270 395 V435"/>
    <path d="M330 395 V435"/><path d="M390 395 V435"/><path d="M450 395 V435"/>
    <path d="M660 400 V435"/><path d="M740 355 V400"/><path d="M790 300 V345"/>
    <path d="M660 400 V470"/><path d="M740 470 V515"/><path d="M790 515 V555"/>
  </g>

  <!-- trolley -->
  <g transform="translate(255 358)">
    <rect x="0" y="0" width="150" height="64" rx="12" fill="#38bdf8"/>
    <rect x="16" y="14" width="118" height="22" rx="6" fill="#0f172a" opacity="0.55"/>
    <circle cx="30" cy="66" r="13" fill="#e2e8f0"/>
    <circle cx="120" cy="66" r="13" fill="#e2e8f0"/>
    <circle cx="30" cy="66" r="5" fill="#475569"/>
    <circle cx="120" cy="66" r="5" fill="#475569"/>
  </g>

  <!-- lever -->
  <g transform="translate(905 470)">
    <rect x="-34" y="34" width="68" height="26" rx="8" fill="#334155"/>
    <rect x="-7" y="-26" width="14" height="64" rx="7" fill="#f59e0b"/>
    <circle cx="0" cy="-34" r="19" fill="#f59e0b"/>
    <circle cx="0" cy="-34" r="8" fill="#0f172a" opacity="0.5"/>
  </g>

  <!-- outcome markers -->
  <g font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="1015" y="288" fill="#22c55e" font-size="86" font-weight="bold">5</text>
    <text x="1015" y="318" fill="#64748b" font-size="20" font-weight="bold" letter-spacing="3">SURVIVE</text>

    <text x="1015" y="545" fill="#f43f5e" font-size="86" font-weight="bold">1</text>
    <text x="1015" y="575" fill="#64748b" font-size="20" font-weight="bold" letter-spacing="3">SURVIVES</text>
  </g>

  <!-- title -->
  <text x="80" y="128" fill="#ffffff" font-family="Georgia, serif" font-size="66" font-weight="bold">The Trolley Problem</text>
  <text x="80" y="182" fill="#94a3b8" font-family="Helvetica, Arial, sans-serif" font-size="27" letter-spacing="1">Same math. Six scenarios. Zero right answers.</text>
  <rect x="80" y="205" width="150" height="5" rx="2.5" fill="#38bdf8"/>
</svg>