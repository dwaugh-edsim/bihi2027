<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>8 ILT Survival Council — Squad Slips (Legal, Cut Out)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@600;700;800&family=Roboto+Slab:wght@700;800;900&display=swap" rel="stylesheet">
<style>
    /* ── A4 print setup ─────────────────────────────────────── */
    @page { size: legal portrait; margin: 0; }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: #d8dee7;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px 0 30px 0;
        -webkit-font-smoothing: antialiased;
    }

    /* Screen-only toolbar */
    .print-bar {
        margin-bottom: 14px;
        display: flex;
        align-items: center;
        gap: 14px;
        background: #ffffff;
        border: 2px solid #0f172a;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #0f172a;
    }
    .print-bar button {
        font-family: 'Roboto Slab', serif;
        font-size: 1rem;
        font-weight: 800;
        padding: 9px 22px;
        background: #0f172a;
        color: #ffffff;
        border: 1.5px solid #0f172a;
        border-radius: 6px;
        cursor: pointer;
    }
    .print-bar button:hover { background: #334155; }

    /* ── The A4 sheet ───────────────────────────────────────── */
    .sheet {
        width: 8.5in;
        height: 14in;
        background: #ffffff;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18);
        padding: 7mm;
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: repeat(4, 1fr);
        gap: 4mm;
    }

    /* ── Cut-out slip cards ─────────────────────────────────── */
    .slip {
        border: 1.2px dashed #64748b;
        border-radius: 2mm;
        padding: 4mm 5mm 3mm 5mm;
        display: flex;
        flex-direction: column;
        background: #ffffff;
        position: relative;
        overflow: hidden;
    }

    .slip-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2.5px solid #0f172a;
        padding-bottom: 1.6mm;
        margin-bottom: 2.2mm;
    }

    .slip-title {
        font-family: 'Roboto Slab', serif;
        font-size: 12.5pt;
        font-weight: 900;
        color: #0f172a;
        letter-spacing: 0.01em;
    }

    .slip-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 6.5pt;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        background: #0f172a;
        color: #ffffff;
        padding: 1mm 2mm;
        border-radius: 1.2mm;
        white-space: nowrap;
    }

    .slip-line-row {
        display: flex;
        align-items: baseline;
        gap: 2mm;
        margin-bottom: 2.2mm;
        font-size: 9pt;
        font-weight: 700;
        color: #334155;
    }

    .slip-line-row .write-line {
        flex: 1;
        border-bottom: 1px solid #94a3b8;
        min-height: 6mm;
    }

    .items-heading {
        font-family: 'JetBrains Mono', monospace;
        font-size: 7.5pt;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #0f172a;
        margin: 1mm 0 1.6mm 0;
        padding: 1.2mm 2mm;
        background: #eef2f7;
        border-left: 2.5mm solid #0f172a;
        border-radius: 1mm;
    }

    .item-entry {
        display: flex;
        align-items: center;
        gap: 2.5mm;
        margin-bottom: 0;
        flex: 1;
        min-height: 0;
    }

    .item-num {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11pt;
        font-weight: 800;
        color: #0f172a;
        background: #e2e8f0;
        border: 1px solid #94a3b8;
        width: 7mm;
        height: 7mm;
        border-radius: 1.5mm;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .item-entry .write-line {
        flex: 1;
        border-bottom: 1.2px solid #475569;
        height: 100%;
    }

    .items-wrap {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1mm;
        min-height: 0;
    }

    .slip-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid #cbd5e1;
        padding-top: 1.4mm;
        margin-top: 1.6mm;
        font-size: 6.8pt;
        font-weight: 600;
        color: #64748b;
    }
    .slip-foot .rule { font-weight: 800; color: #334155; }

    /* ── Print ──────────────────────────────────────────────── */
    @media print {
        body { background: #ffffff; padding: 0; display: block; }
        .print-bar { display: none !important; }
        .sheet {
            box-shadow: none;
            width: 8.5in;
            height: 14in;
            padding: 7mm;
        }
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
    }
</style>
</head>
<body>

    <div class="print-bar">
        <span>✂️ 8 cut-out slips per legal sheet (8.5×14") &bull; dashed lines = cut here &bull; works on the photocopier (black &amp; white friendly)</span>
        <button onclick="window.print()">🖨️ Print Legal</button>
    </div>

    <div class="sheet" id="sheet"><!-- slips injected by script --></div>

    <script>
        const SLIP_COUNT = 8;
        const sheet = document.getElementById('sheet');
        let slips = '';
        for (let i = 1; i <= SLIP_COUNT; i++) {
            slips += `
            <div class="slip">
                <div class="slip-head">
                    <span class="slip-title">🧟 Survival Council</span>
                    <span class="slip-tag">Slip ${i}/8 &bull; 8 ILT</span>
                </div>

                <div class="slip-line-row">Squad Name: <span class="write-line"></span></div>
                <div class="slip-line-row">Members: <span class="write-line"></span></div>

                <div class="items-heading">Our 4 Survival Items — 100% Unanimous</div>

                <div class="items-wrap">
                    <div class="item-entry"><span class="item-num">1</span><span class="write-line"></span></div>
                    <div class="item-entry"><span class="item-num">2</span><span class="write-line"></span></div>
                    <div class="item-entry"><span class="item-num">3</span><span class="write-line"></span></div>
                    <div class="item-entry"><span class="item-num">4</span><span class="write-line"></span></div>
                </div>

                <div class="slip-foot">
                    <span class="rule">No majority votes • No coin flips</span>
                    <span>Room 8 • Mr. Waugh</span>
                </div>
            </div>`;
        }
        sheet.innerHTML = slips;
    </script>
</body>
</html>
